  alts: ['25 °C / 60% UR', '30 °C / 65% UR', '30 °C / 75% UR', '40 °C / 75% UR', '5 °C ± 3 °C'],
  c: 'C',
  e: [
    'Errada. Essa é a condição das zonas climáticas I e II.',
    'Errada. Essa é a condição da zona IVa.',
    'Correta. A zona IVb (quente e muito úmida) usa 30 °C / 75% UR na longa duração.',
    'Errada. Essa é a condição do estudo ACELERADO.',
    'Errada. Essa é a condição para produtos refrigerados.'
  ],
  fonte: 'Guia ANVISA nº 28/2019, p. 6 (zona climática IVb); RDC 318/2019.'
},
{
  id: 'CQ-IN-20', origem: 'Inédita', assunto: 'Gestão da qualidade e ferramentas',
  enun: `Após investigar um desvio de dureza baixa causado por desgaste dos punções, a empresa trocou os punções do equipamento (ação 1) e implantou inspeção periódica do ferramental com troca programada (ação 2). Essas ações correspondem, respectivamente, a:`,
  alts: [
    'Ação preventiva e ação corretiva.',
    'Ação corretiva e ação preventiva.',
    'Duas ações corretivas.',
    'Duas ações preventivas.',
    'Controle estatístico e autoinspeção.'
  ],
  c: 'B',
  e: [
    'Errada. A ordem está invertida.',
    'Correta. A corretiva elimina a causa do desvio que já ocorreu (troca dos punções desgastados); a preventiva evita que ele ocorra de novo (inspeção e troca programada). Juntas, formam o CAPA.',
    'Errada. A ação 2 é preventiva.',
    'Errada. A ação 1 é corretiva.',
    'Errada. Não correspondem a essas ferramentas.'
  ],
  fonte: 'Artigo "Ferramentas da qualidade" (Infarma, 2021) — CAPA; RDC 658/2022, Art. 8º.'
},
{
  id: 'CQ-IN-21', origem: 'Inédita', assunto: 'Ensaios físicos de formas farmacêuticas',
  enun: `Um pó formou um cone com altura de 2,0 cm e raio da base de 4,0 cm. Sabendo que tan α = H/R, e que ângulos ≤ 30° indicam fluxo livre e ≥ 40° indicam fluxo baixo, o ângulo de repouso e a conclusão são:`,
  alts: [
    'α ≈ 63°; fluxo baixo.',
    'α ≈ 27°; fluxo livre.',
    'α ≈ 45°; fluxo baixo.',
    'α = 2°; fluxo livre.',
    'α ≈ 27°; fluxo baixo.'
  ],
  c: 'B',
  e: [
    'Errada. Usou R/H (4/2 = 2): a razão está invertida.',
    'Correta. tan α = 2,0/4,0 = 0,5, então α ≈ 26,6°, ou seja, ≤ 30°: fluxo livre.',
    'Errada. tan 45° = 1, que exigiria H = R.',
    'Errada. Confundiu a razão com o ângulo.',
    'Errada. O ângulo está certo, mas abaixo de 30° o fluxo é livre.'
  ],
  fonte: 'Cap. 14, p. 261 (ângulo de repouso).'
},
{
  id: 'CQ-IN-22', origem: 'Inédita', assunto: 'CQ de matérias-primas: identificação e pureza',
  enun: `Sobre a ordem dos ensaios no recebimento de matérias-primas, assinale a correta.`,
  alts: [
    'Matérias-primas podem ser usadas na produção assim que chegam, e os ensaios são feitos depois.',
    'Após o recebimento, a matéria-prima fica em quarentena até ser aprovada pelo CQ; os ensaios de identificação devem ser feitos em amostras de todos os recipientes, salvo exceções com fornecedor qualificado.',
    'Basta analisar um único recipiente de cada lote para a identificação, sempre.',
    'O certificado do fornecedor dispensa qualquer ensaio, inclusive para produtos parenterais.',
    'A quarentena só é necessária para matérias-primas de origem vegetal.'
  ],
  c: 'B',
  e: [
    'Errada. A matéria-prima fica em quarentena até a aprovação.',
    'Correta. Segue a p. 242: quarentena e identificação em todos os recipientes (a isenção não vale para intermediários, fracionados e parenterais).',
    'Errada. A regra geral é amostrar todos os recipientes para identificação.',
    'Errada. O certificado não dispensa a identificação, muito menos para parenterais.',
    'Errada. A quarentena vale para todas as matérias-primas.'
  ],
  fonte: 'CQ MPs (Cap. 13), p. 242 (recebimento, quarentena e amostragem).'
},
{
  id: 'CQ-IN-23', origem: 'Inédita', assunto: 'Cálculos de controle de qualidade',
  enun: `Na complexometria com EDTA, o íon metálico reage com o EDTA na proporção 1:1. Uma amostra contendo cálcio consumiu 20,0 mL de EDTA 0,0500 mol/L. A quantidade de cálcio (MM = 40,0 g/mol) na amostra é:`,
  alts: ['20 mg', '40 mg', '80 mg', '1,0 mg', '400 mg'],
  c: 'B',
  e: [
    'Errada. Considerou proporção 1:2.',
    'Correta. n(EDTA) = 20,0 × 0,0500 = 1,00 mmol, igual a n(Ca²⁺) pela proporção 1:1. Massa = 1,00 × 40,0 = 40 mg.',
    'Errada. Considerou proporção 2:1.',
    'Errada. Ficou no número de mmol sem multiplicar pela massa molar.',
    'Errada. Erro de potência.'
  ],
  obs: 'A grande vantagem do EDTA é reagir 1:1 com praticamente todos os metais, o que simplifica a estequiometria.',
  fonte: 'Cap. 3 – Técnicas clássicas, p. 52 (complexometria com EDTA).'
}
]);

/* ================= PROVA INTEGRADORA (UNIFSA) — Q11 a Q20: Produção e Controle de Qualidade de Medicamentos na Indústria ================= */
addQ('cq', 'integradora', 'Integradora', [
{
  id: 'INT-11', origem: 'Prova Integradora (Q11)', assunto: 'Intercambialidade e bioequivalência',
  enun: `Durante uma entrevista para a TV, você é convidado a tirar dúvidas sobre o tema intercambialidade. Porém, o entrevistador se atrapalhou e fez algumas considerações questionáveis sobre o tema. Analise as afirmativas a seguir e assinale a alternativa que contém todas as afirmações corretas:

I. Os estudos de equivalência farmacêutica antecedem o estudo de biodisponibilidade, quando este for aplicável, sendo o primeiro realizado in vitro e o segundo in vivo.
II. É possível intercambiar medicamentos que contêm o mesmo fármaco, na mesma dose, sob a mesma forma farmacêutica, administrados pela mesma via, que cumpram os requisitos de qualidade farmacopeicos e sejam bioequivalentes.
III. No caso de uma prescrição contendo um medicamento similar, por exemplo, o paciente poderá optar por adquirir o genérico, similar ou referência, de acordo com a conveniência.
IV. Durante os testes de bioequivalência, os medicamentos são analisados em grupos de voluntários, os quais serão monitorados a partir da quantificação do fármaco nas amostras biológicas e nos sinais clínicos que apresentarem.
V. Os medicamentos, independentemente da origem (sintéticos, biológicos ou fitoterápicos), possuem opções disponíveis de genéricos e similares, lançados ao expirar a patente do medicamento de referência.`,
  alts: ['Apenas I e III.', 'Apenas I e II.', 'Apenas III, IV e V.', 'Apenas II, III e V.', 'Apenas I, II e IV.'],
  c: 'E',
  e: [
    'Errada. III é falsa: a intercambialidade é entre referência e genérico (ou similar intercambiável e seu referência). Não há troca livre "por conveniência" a partir de um similar prescrito.',
    'Errada. I e II são verdadeiras, mas a IV também é: faltou incluí-la.',
    'Errada. III e V são falsas.',
    'Errada. III e V são falsas.',
    'Correta. I (V): equivalência farmacêutica (in vitro) vem antes da bioequivalência (in vivo). II (V): é o conceito de medicamentos intercambiáveis. IV (V): o estudo é feito em voluntários, com quantificação do fármaco em amostras biológicas (farmacocinética) e acompanhamento clínico. III (F) e V (F): biológicos não têm genéricos (têm biossimilares, por via de comparabilidade) e fitoterápicos também não.'
  ],
  obs: 'Gabarito montado a partir do conteúdo, sem gabarito oficial. Ponto de atenção: o parâmetro do estudo de bioequivalência é farmacocinético (quantificação do fármaco); o monitoramento clínico dos voluntários é de segurança.',
  fonte: 'Lei nº 9.787/1999 (genéricos); normas da Anvisa sobre equivalência farmacêutica e bioequivalência.'
},
{
  id: 'INT-12', origem: 'Prova Integradora (Q12)', assunto: 'CQ de matérias-primas: identificação e pureza',
  enun: `Ao receber um lote de extrato seco de Curcuma longa (Açafrão) em sua farmácia magistral, você observou que o laudo do fornecedor continha os seguintes ensaios com seus respectivos resultados e valores de referência: aspecto; análise granulométrica; análise microscópica; perda por secagem; metais pesados; teor de curcuminoides (marcador fitoquímico); cinzas insolúveis em ácido; contagem de bactérias e fungos; pesquisa de patógenos. Sobre a situação acima, assinale a alternativa correta:`,
  alts: [
    'Caso a contagem de bactérias e fungos resulte em valores abaixo do limite especificado, não seria necessário realizar a pesquisa de patógenos.',
    'O aspecto e a análise microscópica são importantes ensaios para garantir a identidade do material recebido.',
    'As análises perda por secagem, metais pesados e teor de curcuminoides são consideradas ensaios de pureza, pois visam a determinação de contaminantes na amostra.',
    'A fim de determinar o conteúdo de matéria orgânica volátil aplica-se o ensaio cinzas insolúveis em ácido, o qual é considerado semiquantitativo.',
    'A perda por secagem corresponde a um ensaio-limite que visa a determinação qualitativa de água na matéria-prima mediante uma reação química.'
  ],
  c: 'B',
  e: [
    'Errada. A pesquisa de patógenos é independente da contagem total: mesmo com contagem baixa, um patógeno específico (ex.: Salmonella, E. coli) pode estar presente.',
    'Correta. Aspecto (características organolépticas) e análise microscópica (estruturas vegetais típicas) são ensaios de identificação do insumo vegetal.',
    'Errada. Perda por secagem e metais pesados são de pureza, mas o teor de curcuminoides é doseamento do marcador (ensaio de teor/potência), não de pureza.',
    'Errada. Cinzas insolúveis em ácido avaliam o resíduo inorgânico (principalmente sílica, terra, areia), não matéria orgânica volátil.',
    'Errada. A perda por secagem é gravimétrica e quantitativa (perda de massa por aquecimento: água e voláteis), sem reação química. Determinação específica de água por reação química é o Karl Fischer.'
  ],
  fonte: 'Farmacopeia Brasileira (métodos de farmacognosia: perda por secagem, cinzas, metais pesados; ensaios microbiológicos).'
},
{
  id: 'INT-13', origem: 'Prova Integradora (Q13)', assunto: 'Cromatografia (CCD, CLAE e CG)',
  enun: `A pregabalina é um fármaco indicado no tratamento da dor neuropática causada por lesão ou mau funcionamento dos nervos ou do sistema nervoso; na terapia adjunta de crises epilépticas parciais, com ou sem generalizações secundárias; no tratamento do Transtorno da Ansiedade Generalizada (TAG); e no controle da fibromialgia. No mercado, pode ser encontrada nas apresentações de cápsulas contendo 75 ou 150 mg do ativo. Um estudo validou o doseamento das cápsulas de pregabalina em cromatografia líquida de alta eficiência (CLAE). A fase móvel consistiu em tampão de hidrogenofosfato dissódico:acetonitrila:metanol na razão 80:10:10 (v/v/v). A coluna utilizada foi ODS-3V-C18 (250 mm x 4,6 mm x 5 µm). O comprimento de onda foi 210 nm.

Na prova, as figuras mostravam: Figura A, o cromatograma do padrão; Figura B, o cromatograma da amostra (ambos com o pico da pregabalina no mesmo tempo de retenção, entre 2,5 e 5 min); e Figura C, a curva de linearidade (área × concentração em mg/mL, de 0 a cerca de 0,4 mg/mL, com áreas de 0 a cerca de 200 000; y = 525658x + b; R² = 0,9996).

Considerando as informações apresentadas, assinale a opção correta.`,
  alts: [
    'A análise da amostra e do padrão visam comparar o tempo de retenção obtido, o qual deve ser semelhante para a mesma substância, analisada nas mesmas condições.',
    'O cromatograma da amostra das cápsulas permite confirmar a identidade da substância, mas não será possível quantificá-la por essa técnica.',
    'As amostras injetadas com área igual a 150 000 estão fora da faixa de trabalho (intervalo) do método desenvolvido, devendo ser mais diluídas.',
    'A análise foi realizada pela técnica de CLAE em coluna de fase normal (polar).',
    'A figura C indica que o método apresenta robustez, ou seja, os resultados obtidos são reprodutíveis após uma série de repetições realizadas por um mesmo analista.'
  ],
  c: 'A',
  e: [
    'Correta. Na CLAE, a identificação é feita comparando o tempo de retenção da amostra com o do padrão, nas mesmas condições cromatográficas.',
    'Errada. A CLAE identifica (tempo de retenção) e também quantifica (área do pico comparada à curva de calibração). Foi justamente um doseamento.',
    'Errada. A curva vai até cerca de 200 000 de área; 150 000 está dentro do intervalo, então não precisa diluir.',
    'Errada. Coluna C18 (octadecilsilano, apolar) com fase móvel polar = fase reversa.',
    'Errada. A figura C mostra linearidade (R² próximo de 1). Robustez é a resistência a pequenas variações do método, e repetições por um mesmo analista avaliam a precisão (repetibilidade).'
  ],
  fonte: 'SEEMA, A.; JEEJA, P.; ASHISH, J. Pharm Anal Acta, v. 7, 2016 (adaptado); RDC 166/2017 (validação de métodos analíticos).'
},
{
  id: 'INT-14', origem: 'Prova Integradora (Q14)', assunto: 'Cálculos de controle de qualidade',
  enun: `Uma amostra de matéria-prima de pantoprazol sódico (MP1) foi adquirida de uma nova empresa fornecedora. O teor de água nas matérias-primas foi previamente determinado pelo método de Karl Fischer. O doseamento da amostra foi realizado por titulação. A matéria-prima foi pesada em béquer, solubilizada em 50 mL de etanol 96% V/V, adicionada de uma gota de azul de bromofenol 0,1% SI e titulada diretamente com ácido clorídrico 0,1 M SV (Fator de correção = 0,98), por meio de bureta. Cada mL de ácido clorídrico 0,1 M SV corresponde a 40,535 mg de pantoprazol sódico anidro. A faixa de especificação é 98,0% a 102,0% em relação à substância anidra.

Dados da MP1: água = 4,0%; massa da amostra = 350,0 mg; volume consumido de HCl = 8,0 mL.

A partir dos princípios das técnicas e dados da questão, julgue as afirmativas abaixo:
I. A determinação prévia de água não era relevante para o doseamento das amostras.
II. O método de Karl Fischer é considerado um método volumétrico de pureza, ou seja, por meio de titulação quantifica a impureza (água).
III. O doseamento das matérias-primas foi realizado empregando-se um método clássico de quantificação.
IV. Ao dessecar a amostra MP1 antes de analisá-la, o resultado obtido encontra-se fora da especificação.
V. No doseamento descrito, o titulante foi o pantoprazol sódico, o titulado o ácido clorídrico 0,1 M e o indicador foi o azul de bromotimol 0,1%.

É correto o que se afirma em:`,
  alts: ['Apenas III e V.', 'Apenas I e III.', 'Apenas I, II e IV.', 'Apenas II, III e IV.', 'Apenas II, IV e V.'],
  c: 'D',
  e: [
    'Errada. V é falsa (titulante e titulado estão invertidos, e o indicador é o azul de bromoFENOL).',
    'Errada. I é falsa: a água é necessária para expressar o teor em relação à substância anidra.',
    'Errada. I é falsa.',
    'Correta. II (V), III (V) e IV (V). Cálculo: 8,0 × 0,98 × 40,535 = 317,8 mg encontrados. Base anidra = 350,0 × (1 − 0,04) = 336,0 mg. Teor = 317,8 ÷ 336,0 × 100 = 94,6%, fora de 98,0–102,0%.',
    'Errada. V é falsa.'
  ],
  obs: 'Mesma estrutura da questão da 1ª VA de 2025 (CQ). Fórmula: teor (%) = (V × f × equivalente) ÷ (massa × (1 − %água)) × 100.',
  fonte: 'Cap. 3 – Técnicas clássicas (Karl Fischer volumétrico; acidimetria/alcalimetria).'
},
{
  id: 'INT-15', origem: 'Prova Integradora (Q15)', assunto: 'Ensaios físicos de formas farmacêuticas',
  enun: `Em uma indústria, foi preparada a seguinte fórmula de um xarope de guaco (Mikania glomerata):
- Extrato hidroalcoólico de guaco .......... 20% (v/v)
- Xarope simples .......... qsp 1000 L

A formulação foi entregue ao técnico do controle de qualidade para realizar a determinação da densidade do xarope, a partir da qual autorizaria o envase em frascos de 100 mL. Para a determinação da densidade, o técnico utilizou um instrumento específico para essa finalidade e uma balança analítica. Os dados da realização da densidade foram os seguintes:
- Massa do instrumento vazio: 50 g
- Massa do instrumento preenchido com o xarope: 100 g
- Volume do instrumento: 25 mL

Assinale a alternativa que descreve corretamente e respectivamente o nome do instrumento utilizado no ensaio, a densidade em g/mL obtida para o produto e qual foi o tipo de ensaio realizado:`,
  alts: [
    'Picnômetro; 2 g/mL; físico.',
    'Friabilômetro; 0,2 g/mL; químico.',
    'Durômetro; 1 g/mL; físico.',
    'Polarímetro; 0,1 g/mL; químico.',
    'Refratômetro; 0,5 g/mL; químico.'
  ],
  c: 'A',
  e: [
    'Correta. Densidade com picnômetro: (100 − 50) g ÷ 25 mL = 2 g/mL. É um ensaio físico.',
    'Errada. Friabilômetro mede a friabilidade de comprimidos (resistência à abrasão).',
    'Errada. Durômetro mede a dureza de comprimidos; a densidade também está errada.',
    'Errada. Polarímetro mede o desvio da luz polarizada (rotação óptica).',
    'Errada. Refratômetro mede o índice de refração.'
  ],
  fonte: 'Farmacopeia Brasileira (densidade de massa e densidade relativa); "Cap. Ensaios Físicos Líquidos e Semissólidos".'
},
{
  id: 'INT-16', origem: 'Prova Integradora (Q16)', assunto: 'Água para uso farmacêutico',
  enun: `Na indústria farmacêutica, o controle da água de uso farmacêutico é essencial para garantir a qualidade e segurança dos produtos. Considerando os tipos de água empregados e os ensaios realizados para seu controle de qualidade, assinale a alternativa CORRETA:`,
  alts: [
    'A água purificada (AP) é obtida por osmose reversa e utilizada exclusivamente na produção de medicamentos injetáveis, devendo atender aos limites de endotoxinas bacterianas estabelecidos pela Farmacopeia Brasileira.',
    'A água purificada (AP) é destinada à formulação de medicamentos não estéreis e ao preparo de reagentes, devendo atender aos testes de condutividade elétrica, carbono orgânico total (TOC), e contagem microbiana, além de ser isenta de patógenos.',
    'A água para injetáveis (API) pode ser produzida por destilação ou osmose reversa simples, devendo apresentar teor elevado de sólidos dissolvidos, como minerais, para garantir isotonicidade.',
    'A água purificada obtida por destilação simples apresenta elevada condutividade elétrica devido à alta concentração de íons residuais provenientes do processo térmico.',
    'O teste de TOC (Carbono Orgânico Total) é realizado apenas em águas potáveis, pois avalia a presença de íons metálicos que interferem na pureza química, permitindo identificar a água "dura".'
  ],
  c: 'B',
  e: [
    'Errada. Injetáveis usam água para injetáveis (API), não água purificada.',
    'Correta. A AP é usada em não estéreis e no preparo de reagentes, com controle de condutividade, TOC e contagem microbiana.',
    'Errada. A API deve ter baixíssimo teor de sólidos dissolvidos; a isotonicidade é ajustada na formulação, não pela água.',
    'Errada. A destilação remove íons, então a água destilada tem baixa condutividade.',
    'Errada. O TOC mede a contaminação por matéria orgânica (não íons metálicos) e é aplicado às águas purificada e para injetáveis.'
  ],
  fonte: 'Farmacopeia Brasileira (água para uso farmacêutico); RDC 658/2022.'
},
{
  id: 'INT-17', origem: 'Prova Integradora (Q17)', assunto: 'Medicamentos biológicos e biossimilares',
  enun: `Para os medicamentos biológicos e biossimilares, a farmacovigilância é imprescindível, pois, dada a alta sensibilidade dos medicamentos, alterações nos métodos de produção ou impurezas podem aumentar a probabilidade de provocar uma resposta imune, tornando difícil prever suas reações adversas. De forma a minimizar esses eventos, deve ser considerado pelo controle de qualidade o seguinte:`,
  alts: [
    'A via de comparabilidade é utilizada para os medicamentos biossimilares e exige demonstração de similaridade em qualidade, segurança e eficácia em relação ao produto de referência.',
    'A denominação medicamentos biológicos significa que os medicamentos dessa categoria correspondem a seres vivos, ou seja, linhagens celulares administradas para fins terapêuticos.',
    'A escolha do vetor responsável pela produção do IFA de um medicamento biológico não é relevante, pois apenas parte do conteúdo celular será administrado (ex. proteínas, enzimas, etc).',
    'A imunogenicidade não é considerada nos estudos clínicos de comparabilidade, pois os biossimilares possuem estruturas idênticas às dos biológicos de referência.',
    'A avaliação da imunogenicidade é dispensável quando o biossimilar é aprovado pela via de desenvolvimento individual.'
  ],
  c: 'A',
  e: [
    'Correta. Pela via de desenvolvimento por comparabilidade, o biossimilar deve demonstrar similaridade em qualidade, segurança e eficácia com o biológico de referência.',
    'Errada. Biológicos são moléculas obtidas a partir de fontes biológicas (ex.: proteínas recombinantes); não são células vivas administradas.',
    'Errada. O sistema de expressão (vetor/linhagem) influencia a estrutura, as modificações pós-traducionais e as impurezas, logo afeta a imunogenicidade.',
    'Errada. Biossimilares são semelhantes, não idênticos; a imunogenicidade é sempre avaliada.',
    'Errada. A imunogenicidade deve ser avaliada em qualquer via de registro.'
  ],
  fonte: 'RDC nº 55/2010 (registro de produtos biológicos: vias de desenvolvimento individual e por comparabilidade).'
},
{
  id: 'INT-18', origem: 'Prova Integradora (Q18)', assunto: 'Estabilidade e degradação',
  enun: `Considere que uma indústria farmacêutica brasileira está submetendo ao registro um medicamento genérico sólido na forma de comprimido, e precisa adequar-se às exigências da RDC 318/2019. Sobre os estudos de estabilidade previstos nessa norma, assinale a alternativa correta:`,
  alts: [
    'A RDC 318/2019 não exige estudos de estabilidade para medicamentos acondicionados em frascos multidose, já que a rotulagem resolveria qualquer variação após abertura da embalagem.',
    'O estudo de estabilidade de longa duração para o medicamento genérico deve prever ensaios no tempo inicial, depois a cada 3 e 6 meses.',
    'A escolha do material de embalagem pode ser realizada após a conclusão do estudo de estabilidade, tendo em vista que não afetará significativamente os resultados obtidos.',
    'A análise dos comprimidos não envolverá parâmetros como dureza e friabilidade, pois durante os estudos de estabilidade somente é necessário comprovar a integridade do IFA na formulação.',
    'A empresa deve seguir as condições climáticas relacionadas à Zona IVB (quente e muito úmida), aplicáveis ao Brasil, para definir a temperatura e umidade nas quais os produtos deverão ser mantidos durante o estudo.'
  ],
  c: 'E',
  e: [
    'Errada. Produtos multidose exigem inclusive estudo de estabilidade em uso (após abertura).',
    'Errada. No longa duração, os pontos são 0, 3, 6, 9, 12, 18 e 24 meses (e depois anualmente), não só 3 e 6 meses. 0, 3 e 6 meses é o cronograma do estudo acelerado.',
    'Errada. O estudo deve ser feito na embalagem definitiva, pois ela influencia a estabilidade (umidade, luz, oxigênio).',
    'Errada. Atributos físicos como dureza, friabilidade e dissolução também devem ser monitorados.',
    'Correta. O Brasil é classificado na Zona climática IVb (quente e muito úmida): longa duração a 30 °C ± 2 °C / 75% ± 5% UR.'
  ],
  fonte: 'RDC 318/2019 (estudos de estabilidade); Guia Anvisa nº 28/2019.'
},
{
  id: 'INT-19', origem: 'Prova Integradora (Q19)', assunto: 'Controle microbiológico',
  enun: `Durante a rotina de controle de qualidade, um laboratório detectou crescimento microbiano em um lote de xarope antitussígeno antes de seu prazo de validade. A equipe de garantia da qualidade iniciou uma investigação para verificar se os limites microbiológicos adotados estavam de acordo com as especificações da Farmacopeia Brasileira. Com base nas normas vigentes, assinale a alternativa correta:`,
  alts: [
    'Medicamentos não estéreis não exigem controle microbiológico, desde que contenham conservantes antimicrobianos.',
    'O controle microbiológico de medicamentos não estéreis é realizado apenas para detecção de bactérias patogênicas específicas, como Escherichia coli e Staphylococcus aureus.',
    'O controle microbiológico de medicamentos não estéreis deve incluir a contagem total de bactérias e de fungos, além da pesquisa de microrganismos patogênicos específicos.',
    'Somente a contagem de microrganismos viáveis é exigida para medicamentos na forma farmacêutica xarope, tendo em vista que não haver risco de contaminação em produtos com alta atividade de água.',
    'O teste de endotoxinas bacterianas é obrigatório para todos os medicamentos não estéreis, incluindo o xarope do enunciado.'
  ],
  c: 'C',
  e: [
    'Errada. Conservantes não dispensam o controle microbiológico.',
    'Errada. Inclui também a contagem total de bactérias aeróbias e de fungos/leveduras.',
    'Correta. Não estéreis: contagem de bactérias aeróbias totais, contagem de fungos e leveduras e pesquisa de patógenos específicos.',
    'Errada. A alta atividade de água aumenta o risco de contaminação, e a pesquisa de patógenos também é exigida.',
    'Errada. Endotoxinas são exigidas para parenterais e alguns produtos estéreis, não para não estéreis como xarope.'
  ],
  fonte: 'Farmacopeia Brasileira (ensaios microbiológicos para produtos não estéreis).'
},
{
  id: 'INT-20', origem: 'Prova Integradora (Q20)', assunto: 'Controle microbiológico',
  enun: `Uma indústria farmacêutica que fabrica soluções parenterais de grande volume observou, durante o controle de rotina, crescimento de microrganismos em um dos frascos submetidos ao teste de esterilidade. A equipe de qualidade iniciou investigação conforme as Boas Práticas de Fabricação. Com base na regulamentação vigente, assinale a alternativa correta sobre o controle microbiológico de medicamentos estéreis:`,
  alts: [
    'A produção de medicamentos estéreis requer que ao final de sua produção haja a aplicação de uma técnica de esterilização, como radiação ou filtração.',
    'O teste de esterilidade pode ser substituído por análises visuais e físico-químicas, desde que o processo de filtração final seja asséptico.',
    'O uso de conservantes antimicrobianos dispensa a necessidade de realização do teste de esterilidade em preparações sólidas e semissólidas.',
    'O teste de esterilidade deve ser realizado em condições assépticas, com amostragem representativa e incubação em meios de cultura por pelo menos 14 dias.',
    'A pesquisa de pirogênios (exógeno) e endotoxinas (endógeno) é exigida em todos os medicamentos estéreis, pois determinam contaminantes de origens distintas.'
  ],
  c: 'D',
  e: [
    'Errada. Nem sempre há esterilização terminal: produtos sensíveis são fabricados por processamento asséptico.',
    'Errada. Análises visuais e físico-químicas não substituem o teste de esterilidade.',
    'Errada. Conservantes não dispensam o teste de esterilidade de um produto declarado estéril.',
    'Correta. O teste de esterilidade é feito em ambiente asséptico, com amostragem representativa e incubação por no mínimo 14 dias.',
    'Errada. Endotoxinas são um tipo de pirogênio (de bactérias Gram-negativas), e as exigências variam conforme o produto, não valendo para todo estéril.'
  ],
  fonte: 'Farmacopeia Brasileira (teste de esterilidade); RDC 658/2022 (BPF).'
}
]);

/* ================= PROVA INTEGRADORA (UNIFSA) — Q21 a Q30: Cuidados Farmacêuticos II ================= */
addQ('cf', 'integradora', 'Integradora', [
{
  id: 'INT-21', origem: 'Prova Integradora (Q21)', assunto: 'Telefarmácia e intercambialidade',
  enun: `Uma paciente realiza um atendimento por telefarmácia síncrona, conforme autorizado pela Resolução CFF nº 727/2022, buscando esclarecimentos sobre a prescrição recebida. O medicamento indicado pelo médico é um medicamento de referência, porém o custo elevado dificultará o tratamento. A paciente pergunta ao farmacêutico se pode adquirir uma alternativa mais acessível com o mesmo princípio ativo.
Durante o atendimento remoto, o farmacêutico explica as diferenças entre medicamentos de referência, genéricos e similares, considerando:
Com base nesse contexto e na legislação aplicável, assinale a alternativa correta:`,
  alts: [
    'De acordo com a Lei nº 5.991/73, o farmacêutico somente pode substituir o medicamento de referência mediante autorização do prescritor, mesmo quando o genérico possui critérios de equivalência estabelecidos pela Lei nº 9.787/99, não havendo previsão ética que garanta autonomia técnica ao profissional.',
    'A Lei nº 9.787/99 e a RDC nº 98/2016 autorizam que os medicamentos similares sejam automaticamente intercambiáveis com os de referência, e o Código de Ética Farmacêutica permite que tais substituições ocorram sem necessidade de esclarecimento à paciente durante a telefarmácia.',
    'O farmacêutico pode realizar a intercambialidade entre medicamento de referência e genérico (inclusive em atendimento remoto regulamentado pela Resolução CFF nº 727/2022), desde que o genérico tenha comprovação de bioequivalência conforme a Lei nº 9.787/99. Além disso, deve cumprir o Código de Ética Farmacêutica, oferecendo informação clara e garantindo decisão segura à paciente, lembrando que substâncias da Portaria nº 344/1998 não podem ser substituídas automaticamente.',
    'A Portaria nº 344/1998 permite que medicamentos controlados possam ser substituídos por genéricos ou similares desde que haja registro válido, e o Código de Ética autoriza tais substituições como forma de ampliar o acesso, mesmo sem avaliação técnica da equivalência.',
    'A Lei nº 5.991/73 e o Código de Ética Farmacêutica determinam que genéricos e similares são equivalentes entre si, permitindo substituição imediata pelo farmacêutico em qualquer atendimento, inclusive no âmbito da telefarmácia, independentemente dos critérios da RDC nº 98/2016.'
  ],
  c: 'C',
  e: [
    'Errada. A Lei 9.787/99 permite ao farmacêutico trocar referência por genérico sem autorização do prescritor (salvo restrição expressa na receita).',
    'Errada. Similar não é automaticamente intercambiável (só o similar intercambiável, e com o seu referência), e o paciente deve sempre ser informado.',
    'Correta. Troca referência ↔ genérico com bioequivalência comprovada, informação clara à paciente e atenção às restrições para controlados.',
    'Errada. A troca exige equivalência comprovada; o Código de Ética não autoriza substituição sem avaliação técnica.',
    'Errada. Genérico e similar não são automaticamente intercambiáveis entre si.'
  ],
  fonte: 'Lei nº 9.787/1999; Resolução CFF nº 727/2022 (telefarmácia); Código de Ética Farmacêutica; Portaria SVS/MS nº 344/1998.'
},
{
  id: 'INT-22', origem: 'Prova Integradora (Q22)', assunto: 'Ética e interações medicamentosas',
  enun: `Uma paciente de 67 anos, portadora de insuficiência cardíaca e fibrilação atrial, utiliza varfarina com controle estável de INR. Durante uma visita à farmácia comunitária, ela relata sangramentos gengivais após iniciar, por conta própria, um fitoterápico recomendado por um influenciador digital. Ao analisar a composição do produto, o farmacêutico identifica substâncias com forte potencial de interação com varfarina, aumentando significativamente o risco de hemorragia.
No entanto, o estabelecimento possui metas agressivas de venda de produtos naturais e nutracêuticos. O gerente, que está presente no balcão, orienta o farmacêutico a evitar alarmar a paciente, sugerindo que minimize os riscos e ofereça um fitoterápico alternativo, alegando que isso "evitaria perder a venda".
O farmacêutico percebe um conflito entre sua responsabilidade profissional e a pressão comercial imposta pelo gerente.
Com base no caso clínico e nos princípios éticos que regem a atuação farmacêutica, assinale a alternativa correta:`,
  alts: [
    'O farmacêutico pode seguir a orientação do gerente e reduzir as informações sobre o risco da interação, desde que recomende um produto registrado na Anvisa, evitando comprometer a relação de trabalho.',
    'Para manter o equilíbrio entre interesses comerciais e clínicos, o farmacêutico pode apenas aconselhar a paciente a reduzir a dose do fitoterápico, sem necessidade de discutir potenciais interações graves, já que ela não apresentou hemorragias significativas.',
    'A conduta correta é alertar a paciente sobre o risco da interação entre o fitoterápico e a varfarina, orientar a suspensão imediata do produto e encaminhar para avaliação médica; omitir tais informações representa falha ética grave, pois coloca interesses comerciais acima da segurança da paciente.',
    'O farmacêutico pode recomendar outro fitoterápico considerado "mais seguro", pois sua função ética é facilitar o acesso a alternativas naturais, desde que não envolvam medicamentos controlados.',
    'O gerente, como responsável administrativo, pode interferir no conteúdo da orientação farmacêutica, permitindo que o profissional reduza a explicação técnica desde que haja registro sanitário do produto vendido.'
  ],
  c: 'C',
  e: [
    'Errada. Omitir risco à saúde por interesse comercial é infração ética.',
    'Errada. Sangramento gengival já é sinal de alerta; a interação precisa ser explicada e o produto suspenso.',
    'Correta. Segurança da paciente acima de interesses comerciais: alertar, suspender o fitoterápico e encaminhar ao médico (avaliar INR).',
    'Errada. Trocar por outro produto sem avaliação e sem encaminhar não resolve o risco e mantém o foco na venda.',
    'Errada. A autonomia técnica do farmacêutico não pode ser limitada por gestores leigos.'
  ],
  fonte: 'Código de Ética Farmacêutica (Resolução CFF nº 724/2022); Lei nº 13.021/2014.'
},
{
  id: 'INT-23', origem: 'Prova Integradora (Q23)', assunto: 'Resoluções CFF 585 e 586/2013',
  enun: `Em uma manhã de segunda-feira, no consultório farmacêutico vinculado a uma Unidade Básica de Saúde, chega um paciente de 29 anos, estudante universitário e trabalhador em regime de escala. Ele relata que, nos últimos dois dias, apresentou dor de garganta moderada, sensação de ardência ao engolir, febre baixa (máximo de 37,8 °C), fadiga leve e coriza discreta. Preocupado com o acúmulo de atividades acadêmicas e com o trabalho, afirma que "não pode ficar doente" e solicita diretamente um antibiótico, dizendo que "da outra vez tomou um e melhorou rápido".

Durante a anamnese inicial, o farmacêutico percebe que o paciente não apresenta sinais de alarme, não refere dificuldade respiratória, não apresenta placas purulentas, consegue se alimentar normalmente e relata histórico recorrente de episódios virais semelhantes, sobretudo em períodos de estresse e privação de sono.

Considerando a Resolução CFF nº 585/2013, que define as atribuições clínicas do farmacêutico, e o manejo de problemas de saúde autolimitados:`,
  alts: [
    'Recomendar antibiótico de amplo espectro para evitar agravamento do quadro.',
    'Avaliar os sinais e sintomas, tratar como condição autolimitada, orientar medidas não farmacológicas, prescrever MIPs quando indicados e reforçar sinais de alerta.',
    'Encaminhar de imediato ao médico, pois o farmacêutico não pode atuar clinicamente nessas situações.',
    'Indicar AINEs e antitérmicos sem registro de atendimento.',
    'Recomendar apenas fitoterápicos sem realizar avaliação clínica.'
  ],
  c: 'B',
  e: [
    'Errada. Antibiótico exige prescrição médica e não é indicado em quadro viral.',
    'Correta. Manejo de problema de saúde autolimitado: avaliação, medidas não farmacológicas, MIPs e orientação sobre sinais de alerta.',
    'Errada. O farmacêutico tem atribuição clínica para manejar problemas autolimitados (Res. 585 e 586/2013).',
    'Errada. Todo atendimento clínico deve ser registrado.',
    'Errada. Toda recomendação deve ser precedida de avaliação clínica.'
  ],
  fonte: 'Resoluções CFF nº 585/2013 (atribuições clínicas) e 586/2013 (prescrição farmacêutica).'
},
{
  id: 'INT-24', origem: 'Prova Integradora (Q24)', assunto: 'Dispensação e Farmácia Especializada',
  enun: `Durante o atendimento na farmácia comunitária, um senhor de 72 anos chega à dispensação com uma receita contendo metformina 850 mg. Ele conta que recebeu o diagnóstico de diabetes tipo 2 há cerca de três meses e ainda está se adaptando ao tratamento. Demonstra confusão sobre como tomar o medicamento, relatando que às vezes usa antes de comer, outras vezes depois, e que em alguns dias acaba esquecendo a segunda dose.

Durante a conversa, menciona episódios de desconforto gástrico e relata que tem dificuldade em compreender as orientações médicas por conta de problemas auditivos e baixa escolaridade. A filha, que costuma ajudar com a organização dos medicamentos, não estava presente.

Considerando que a dispensação é um ato clínico previsto na Resolução CFF nº 585/2013 e envolve avaliação, orientação e registro:`,
  alts: [
    'Entregar rapidamente o medicamento, evitando atrasos na fila.',
    'Encaminhar ao médico para que ele esclareça todas as dúvidas.',
    'Conferir a prescrição, avaliar riscos, orientar detalhadamente sobre uso correto, horários, efeitos adversos e registrar o atendimento para seguimento.',
    'Apenas repetir a posologia indicada na receita.',
    'Substituir o medicamento por dosagem diferente se não houver 850 mg disponível.'
  ],
  c: 'C',
  e: [
    'Errada. Ignora os problemas de adesão e de compreensão relatados.',
    'Errada. Orientar o uso do medicamento é atribuição do farmacêutico na dispensação.',
    'Correta. Dispensação como ato clínico: avaliar, orientar (tomar com ou após as refeições reduz o desconforto gástrico), adaptar a linguagem e registrar para seguimento.',
    'Errada. Só repetir a posologia não resolve a confusão nem o desconforto gástrico.',
    'Errada. Mudar a dose sem avaliação e sem o prescritor é inadequado.'
  ],
  fonte: 'Resolução CFF nº 585/2013; material de Cuidado Farmacêutico (dispensação).'
},
{
  id: 'INT-25', origem: 'Prova Integradora (Q25)', assunto: 'Educação em saúde e prática baseada em evidências',
  enun: `Uma farmacêutica de uma Unidade Básica de Saúde foi convidada a integrar uma campanha de prevenção e controle da hipertensão arterial voltada principalmente para idosos e agentes comunitários de saúde. O bairro atendido possui população vulnerável, com dificuldades de acesso à informação e baixo nível de escolaridade, e muitos idosos relatam desconhecimento sobre a doença, uso incorreto de medicamentos e hábitos prejudiciais à saúde.

Durante o planejamento, discutem-se diferentes abordagens: palestras tradicionais, rodas de conversa, oficinas, visitas domiciliares e atividades lúdicas. A farmacêutica percebe que a maior parte dos participantes aprende melhor com dinâmicas práticas, exemplos do cotidiano e troca de experiências. Além disso, considera importante estimular autonomia e corresponsabilidade dos usuários no cuidado à saúde, valorizando suas vivências.

Qual estratégia representa uma atuação efetiva e eticamente adequada?`,
  alts: [
    'Realizar palestra expositiva utilizando linguagem técnica e artigos científicos.',
    'Conduzir atividades educativas dialogadas, valorizando saber popular, promovendo autocuidado e usando recursos acessíveis e lúdicos.',
    'Focar apenas nos medicamentos disponíveis na UBS.',
    'Distribuir cartilhas sem interação presencial.',
    'Deixar a condução para outros profissionais e atuar apenas no fornecimento de medicamentos.'
  ],
  c: 'B',
  e: [
    'Errada. Linguagem técnica não se adequa a um público de baixa escolaridade.',
    'Correta. Educação em saúde dialógica: valoriza o saber popular, promove autonomia e usa recursos acessíveis.',
    'Errada. A educação em saúde é mais ampla que os medicamentos (hábitos, prevenção).',
    'Errada. Sem interação, o material é pouco efetivo para essa população.',
    'Errada. Educação em saúde é atribuição clínica do farmacêutico.'
  ],
  fonte: 'Resolução CFF nº 585/2013 (educação em saúde); material de Cuidado Farmacêutico.'
},
{
  id: 'INT-26', origem: 'Prova Integradora (Q26)', assunto: 'Acompanhamento farmacoterapêutico',
  enun: `Uma mulher de 38 anos, com diagnóstico de asma persistente leve, participa de acompanhamento farmacoterapêutico mensal. Durante a consulta, a farmacêutica percebe que a paciente apresenta dificuldade para utilizar o dispositivo inalatório, aplica a técnica de forma incorreta, não identifica a diferença entre o medicamento de manutenção e o broncodilatador de resgate e admite usar o inalador apenas "quando lembra" ou quando sente falta de ar.

Além disso, relata que abandonou o tratamento por algumas semanas ao se sentir melhor, mas posteriormente apresentou exacerbação. Sente-se insegura e confusa com o uso dos dispositivos e relata vergonha de perguntar na consulta médica por achar que deveria "saber usar".

Com base em diretrizes de cuidado farmacêutico e construção de plano terapêutico individualizado:`,
  alts: [
    'Estabelecer metas compartilhadas, reorientar técnica inalatória, reforçar importância do tratamento contínuo, monitorar evolução e registrar todo o processo.',
    'Encaminhar diretamente ao pneumologista sem realizar intervenções.',
    'Orientar verbalmente e entregar folheto educativo sem demonstrações práticas.',
    'Alterar por conta própria o medicamento de manutenção.',
    'Orientar a suspender o controle em períodos sem sintomas.'
  ],
  c: 'A',
  e: [
    'Correta. Plano individualizado: metas compartilhadas, treino da técnica inalatória (com demonstração), adesão ao tratamento de manutenção, seguimento e registro.',
    'Errada. O farmacêutico pode e deve intervir na técnica e na adesão.',
    'Errada. A técnica inalatória exige demonstração prática e checagem do uso pela paciente.',
    'Errada. Trocar o medicamento sem o prescritor é inadequado.',
    'Errada. Suspender a manutenção na ausência de sintomas foi justamente o que causou a exacerbação.'
  ],
  fonte: 'Material de Cuidado Farmacêutico (acompanhamento farmacoterapêutico; plano de cuidado).'
},
{
  id: 'INT-27', origem: 'Prova Integradora (Q27)', assunto: 'Acompanhamento farmacoterapêutico',
  enun: `Durante o seguimento farmacoterapêutico em uma USF, um paciente de 56 anos, recém-iniciado em um anti-hipertensivo, relata episódios frequentes de tontura, principalmente ao levantar da cama. Ele relata medo de desmaiar e explica que já evitou dirigir em alguns dias.

Ao revisar o histórico, o farmacêutico percebe que o paciente iniciou o medicamento há menos de duas semanas e não recebeu orientações adequadas sobre efeitos adversos, horários adequados de administração ou medidas de prevenção, como levantar lentamente da posição deitada ou sentada.

Diante desse cenário:`,
  alts: [
    'Aconselhar a interrupção imediata do medicamento.',
    'Ignorar o relato por ser comum no início do tratamento.',
    'Documentar o evento, orientar medidas de segurança, avaliar necessidade de intervenção e comunicar o médico para possível ajuste terapêutico.',
    'Prescrever medicamento adicional para combater o sintoma.',
    'Pedir ao paciente para esperar a próxima consulta médica.'
  ],
  c: 'C',
  e: [
    'Errada. Suspender o anti-hipertensivo sem avaliação pode causar descontrole pressórico.',
    'Errada. Hipotensão postural com risco de queda precisa de intervenção.',
    'Correta. Registrar o evento adverso, orientar (levantar devagar, hidratação), avaliar e comunicar o prescritor.',
    'Errada. Tratar efeito adverso com outro medicamento (cascata de prescrição) não é a conduta.',
    'Errada. Há risco de queda: a comunicação com o médico não deve esperar.'
  ],
  fonte: 'Material de Cuidado Farmacêutico (seguimento farmacoterapêutico; farmacovigilância).'
},
{
  id: 'INT-28', origem: 'Prova Integradora (Q28)', assunto: 'Consultório farmacêutico (Res. CFF 720/2022)',
  enun: `Um farmacêutico decide abrir um consultório particular para prestação de serviços clínicos como anamnese farmacêutica, revisão de farmacoterapia, acompanhamento farmacoterapêutico e prescrição de MIPs. Para isso, busca orientação sobre os requisitos legais necessários ao funcionamento do espaço.

Ele verifica que será necessário seguir as normas sanitárias aplicáveis, garantir estrutura adequada, manter registros dos atendimentos, instituir fluxos de encaminhamento e assegurar conformidade com regulamentações do Conselho Federal de Farmácia.

De acordo com a Resolução CFF nº 720/2022:`,
  alts: [
    'Apenas registro no CRF é necessário.',
    'Alvará sanitário, inscrição no CRF e cumprimento das normas da Anvisa (RDC nº 44/2009).',
    'Apenas autorização municipal basta.',
    'Não é preciso autorização específica.',
    'Apenas a formação acadêmica é exigida.'
  ],
  c: 'B',
  e: [
    'Errada. Também são exigidos licenciamento sanitário e cumprimento das normas sanitárias.',
    'Correta. O consultório farmacêutico exige alvará/licença sanitária, inscrição no CRF e cumprimento das normas sanitárias (Anvisa).',
    'Errada. É necessário também o registro no CRF.',
    'Errada. Há requisitos legais específicos.',
    'Errada. A formação sozinha não autoriza o funcionamento do estabelecimento.'
  ],
  fonte: 'Resolução CFF nº 720/2022 (consultório farmacêutico); RDC nº 44/2009.'
},
{
  id: 'INT-29', origem: 'Prova Integradora (Q29)', assunto: 'Educação em saúde e prática baseada em evidências',
  enun: `Durante uma consulta, uma paciente de 54 anos comenta que uma vizinha lhe recomendou um fitoterápico "muito bom para ansiedade". Ela está insegura, pois não sabe se funcionará, se pode interagir com o antidepressivo que já utiliza e se há riscos associados. Afirma que confiou na recomendação porque "é natural", mas queria a opinião do farmacêutico.

    ['Conceitos', 'Definição de Hepler & Strand (1990) para Pharmaceutical Care.', 'Provisão responsável do tratamento farmacológico com o propósito de alcançar resultados concretos que melhorem a qualidade de vida do paciente.'],
    ['Dispensação', 'Dispensação: diferença entre Lei 5.991/1973 e PNM (2001).', 'Lei 5.991: "ato de fornecimento" de medicamentos. PNM: ATO PROFISSIONAL de proporcionar medicamentos, no qual o farmacêutico DEVE informar e orientar sobre o uso adequado.'],

    ['Conciliação', 'Discrepância intencional × não intencional: exemplos.', 'Intencional (justificada): troca de dose, frequência ou via pela situação clínica; substituição por medicamento padronizado no hospital. Não intencional: omissão, duplicidade, medicamento contraindicado, prescrição incompleta, doses/frequências/vias diferentes sem justificativa.'],
    ['Acompanhamento', 'Quais são os 7 PRM de Strand (2004)?', '1) Necessita tratamento adicional; 2) tratamento desnecessário; 3) medicamento inadequado; 4) dose abaixo da necessária; 5) dose acima da necessária; 6) reação adversa; 7) adesão inapropriada.'],
    ['Acompanhamento', 'Quais as 4 etapas do método clínico (Correr & Otuki)?', '1) Coletar e organizar dados do paciente; 2) identificar problemas relacionados à farmacoterapia; 3) elaborar o plano de cuidado EM CONJUNTO com o paciente; 4) seguimento individual (resultados, metas, novos problemas).'],
    ['Acompanhamento', 'O que significa SOAP?', 'Subjetivo (relato do paciente), Objetivo (dados medidos: PA, glicemia, exames), Avaliação (julgamento clínico, PRM) e Plano (intervenções e seguimento). O Método Clínico é a adaptação brasileira do SOAP.'],
    ['Acompanhamento', 'Como se avaliam os resultados no acompanhamento farmacoterapêutico?', 'Efetividade: parâmetros clínicos e laboratoriais. Segurança: reações adversas. O acompanhamento é sistemático, contínuo e DOCUMENTADO.'],
    ['Prescrição farmacêutica', 'Conceito de prescrição farmacêutica (CFF 586/2013).', 'Ato pelo qual o farmacêutico seleciona e documenta terapias farmacológicas e NÃO farmacológicas e outras intervenções relativas ao cuidado do paciente, visando promoção, proteção e recuperação da saúde e prevenção de doenças.'],
    ['Prescrição farmacêutica', 'Quando o farmacêutico pode prescrever medicamento que exige prescrição médica?', '"Se, e somente se": diagnóstico prévio; previsto em programas, protocolos, diretrizes ou normas técnicas; aprovado pela instituição de saúde; com acordo de colaboração com outros prescritores (e título de especialista na área clínica).'],
    ['Prescrição farmacêutica', 'Qual a norma atual dos MIP?', 'RDC nº 98/2016 (revogou a RDC 138/2003), regulamentada pela Instrução Normativa nº 11/2016.'],

    ['Educação em saúde', 'O que significa PICO?', 'P: paciente/problema; I: intervenção; C: comparação; O: outcome (resultado). Ex.: a falta de ar (O) pode decorrer do propranolol (I) em paciente asmática (P)?'],

    ['Legislação', 'Validade das receitas: antimicrobiano, controle especial (C1) e Notificações A e B.', 'Antimicrobiano (RDC 20/2011): 10 dias, retenção da 2ª via. Receita de Controle Especial (branca, 2 vias): 30 dias. Notificação A (amarela): 30 dias. Notificação B (azul): 30 dias.']

  add('dpf', [

    ['Pré-formulação', 'Fator de Hausner: fórmula e leitura.', 'FH = densidade compactada ÷ densidade bruta. Até 1,25: fluxo bom/razoável. Acima de 1,25: fluxo fraco ou ruim. Quanto maior o FH, pior o fluxo.'],
    ['Pré-formulação', 'Índice de Carr: fórmula.', 'IC (%) = (dc − db) ÷ dc × 100. 1–10 excelente; 11–15 bom; 16–20 razoável; 21–31 fraco; 32–37 muito fraco; ≥38 extremamente deficiente.'],
    ['Pré-formulação', 'Ângulo de repouso: como ler?', 'Quanto MENOR o ângulo, melhor o fluxo. 25–30°: excelente. Acima de 66°: extremamente fraco. Adjuvantes (deslizantes) reduzem o ângulo.'],
    ['Pré-formulação', 'O que é polimorfismo e o que ele altera?', 'Capacidade de uma substância existir em diferentes formas cristalinas (quimicamente idênticas) ou amorfa. Altera ponto de fusão, solubilidade, dissolução, higroscopicidade e compressibilidade. A forma metaestável tem menor PF e maior solubilidade.'],
    ['Pré-formulação', 'Por que avaliar a higroscopicidade?', 'A umidade absorvida altera o material e DESESTABILIZA o sólido (hidrólise, mudança de forma cristalina, aglomeração), influenciando processo, armazenamento e escolha de excipientes.'],
    ['Granulação', 'Granulação por via SECA: como e quando?', 'Sem líquido e sem secagem: compactação em compressora (slugs) ou rolos (flakes) → moagem → calibração. Indicada para fármacos sensíveis à umidade e ao calor e de alta dosagem.'],
    ['Granulação', 'Granulação por via ÚMIDA: como e quando?', 'Mistura → líquido de granulação com aglutinante (pontes líquidas) → granulação → SECAGEM (pontes sólidas) → calibração. Indicada para fármacos termorresistentes. É o aglutinante que mantém a coesão.'],
    ['Comprimidos', 'Compressão direta: características.', 'Mistura de ativos e excipientes (diluentes, aglutinantes secos, lubrificantes) comprimida sem pré-tratamento, sem etapa de granulação. Sem água nem calor; poucas etapas; fármacos de baixa dosagem.'],
    ['Comprimidos', 'Capping × laminação.', 'Capping: separação da "tampa" (parte superior ou inferior). Laminação: separação em camadas horizontais. Causa comum: ar aprisionado; também excesso de finos, grânulo úmido ou rígido, pouco aglutinante, velocidade alta.'],
    ['Comprimidos', 'Sticking e picking.', 'Sticking: aderência às matrizes ou punções (lubrificação insuficiente, punções riscados). Picking: material arrancado pelos punções (grânulos úmidos, aderência).'],
    ['Comprimidos', 'Por que revestir comprimidos?', 'Facilitar a deglutição; mascarar sabor e aparência; proteger do ambiente; modificar a liberação (ex.: entérico); proteger a mucosa gástrica; associar fármacos incompatíveis. Tipos: drageamento e película.'],
    ['Cápsulas', 'Tamanhos de cápsulas duras.', '000 é a MAIOR e 5 é a menor. Ex.: nº 0 = 0,69 mL; nº 1 = 0,50 mL; nº 2 = 0,37 mL; nº 3 = 0,28 mL; nº 4 = 0,20 mL. Volume necessário = massa ÷ densidade aparente.'],
    ['Cápsulas', 'Composição e características das softgel.', 'Gelatina + PLASTIFICANTE (glicerina ou sorbitol) + água. Conteúdo geralmente líquido ou oleoso. Enchimento e selagem simultâneos (dose unitária precisa). Exigem controle rigoroso de temperatura e umidade.'],
    ['Cápsulas', 'Máquina semiautomática de cápsulas: enchimento total ou parcial?', 'TOTAL (dosagem dependente). Enchimento parcial (dosagem independente) é feito por dosadores, como os de plug.'],

    ['Validação', 'Parâmetros de validação (RDC 166/2017).', 'Linearidade (curva de calibração); precisão (repetibilidade, DPR); exatidão (recuperação); seletividade (sem interferência de placebo e degradados); robustez (pequenas variações); LD e LQ.'],

    uso: 'Primeiro subtraia o intercepto (b), depois divida pela inclinação (a). O C obtido é da solução ANALISADA (diluída).',
    ex: 'A = 0,025C + 0,010 e A = 0,315 → C = 0,305 ÷ 0,025 = 12,2 µg/mL.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Fator de diluição', formula: 'C inicial = C final × (volume final ÷ alíquota)',
    uso: 'Multiplique por cada diluição feita. Depois: massa = C inicial × volume do balão inicial. Converta µg → mg (÷ 1000).',
    ex: '12,2 µg/mL; 1 mL → 100 mL (×100) = 1220 µg/mL; × 250 mL = 305 000 µg = 305 mg.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Comparação com padrão', formula: 'C amostra = (A amostra ÷ A padrão) × C padrão',
    uso: 'Usado quando amostra e padrão são preparados na mesma concentração teórica e lidos juntos.',
    ex: 'A amostra = 0,490; A padrão = 0,500; C padrão = 100 µg/mL → 98 µg/mL.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Lei de Lambert-Beer', formula: 'A = ε · b · c   →   c = A ÷ (ε · b)',
    uso: 'ε = absortividade molar (L·mol⁻¹·cm⁻¹); b = caminho óptico (cm); c em mol/L.',
    ex: 'ε = 3200, b = 1,5 cm, A = 0,48 → c = 0,48 ÷ 4800 = 1,0 × 10⁻⁴ mol/L.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Titulação direta com equivalente', formula: 'massa (mg) = V (mL) × f × equivalente (mg/mL)\nteor (%) = massa ÷ massa da amostra × 100',
    uso: 'f = fator de correção do titulante. "Cada mL equivale a X mg" é o equivalente.',
    ex: '23,8 mL × 1,010 × 20,628 mg = 495,9 mg em 500 mg → 99,2%.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Teor na base anidra', formula: 'teor (%) = massa encontrada ÷ [massa da amostra × (1 − %água/100)] × 100',
    uso: 'Usado quando a especificação é "em relação à substância anidra" (água por Karl Fischer).',
    ex: '317,8 mg encontrados; amostra 350,1 mg com 4% de água → 317,8 ÷ 336,1 = 94,6%.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Titulação por estequiometria (mol)', formula: 'n (mmol) = C (mol/L) × V (mL)\nmassa (mg) = n × MM × (proporção da reação)',
    uso: 'Atenção à proporção: I₂ e ácido ascórbico 1:1; HCl e CaCO₃ 2:1; EDTA e metal 1:1.',
    ex: '5,68 mL × 0,0500 = 0,284 mmol × 10 (alíquota) × 176 = 499,8 mg.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Titulação de retorno', formula: 'n analito = n reagente adicionado em excesso − n titulado de volta',
    uso: 'Ajuste pela estequiometria. Exemplo clássico: AAS (excesso de NaOH titulado com HCl).',
    ex: '25,00 mL × 0,1 = 2,500 mmol; 8,40 mL × 0,1 = 0,840 mmol → 1,66 mmol.' },
  { grupo: 'CQ · Doseamento e pureza', nome: 'Perda por dessecação, resíduo e insolúveis', formula: '% = massa perdida (ou resíduo) ÷ massa da amostra × 100',
    uso: 'Desconte a tara do pesa-filtro ou cadinho. Converta para a mesma unidade antes de dividir.',

];

<script>
/* FarmaQuest — login e progresso na nuvem (Firebase), usado só na versão "site".
   Precisa de: firebase-app-compat, firebase-auth-compat, firebase-firestore-compat e window.FQ_FIREBASE. */
(function () {
  let auth = null, fdb = null, unsub = null, uidAtual = null;
  const DONO_KEY = 'farmaquest:dono';
  const naWebView = /\bwv\b|WhatsApp|FBAN|FBAV|Instagram/i.test(navigator.userAgent || '');

  function vazio() { return { answers: {}, attempts: [], custom: {}, orders: {}, settings: { shuffle: false }, fc: {}, updatedAt: 0, perfil: null }; }
  function lerDono() { try { return localStorage.getItem(DONO_KEY); } catch (e) { return null; } }
  function gravarDono(u) { try { if (u) localStorage.setItem(DONO_KEY, u); else localStorage.removeItem(DONO_KEY); } catch (e) {} }

  const ERROS = {
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'Não existe conta com este e-mail. Toque em "Criar conta".',
    'auth/invalid-email': 'Este e-mail não parece válido.',
    'auth/email-already-in-use': 'Já existe uma conta com este e-mail. Toque em "Entrar".',
    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/missing-password': 'Digite a senha.',
    'auth/too-many-requests': 'Muitas tentativas. Espere alguns minutos e tente de novo.',
    'auth/network-request-failed': 'Sem conexão com a internet. Verifique e tente de novo.',
    'auth/popup-closed-by-user': 'A janela do Google foi fechada antes de terminar.',
    'auth/operation-not-supported-in-this-environment': 'O login com Google não funciona dentro do WhatsApp. Use e-mail e senha, ou abra o link no Safari/Chrome.',
    'auth/web-storage-unsupported': 'Este navegador está bloqueando o login. Abra o link no Safari ou Chrome.',
    'auth/unauthorized-domain': 'Este endereço ainda não foi autorizado no Firebase (Authentication → Configurações → Domínios autorizados).'
  };
  const msgErro = e => (e && ERROS[e.code]) || ('Não foi possível entrar agora' + (e && e.code ? ` (${e.code})` : '') + '. Tente de novo.');

  /* ---------- tela de login ---------- */
  let modo = 'entrar';
  function telaLogin(aviso) {
    const m = document.getElementById('perfil-modal'); if (!m) return;
    const criar = modo === 'criar';
    m.innerHTML = `<form class="perfil-card" id="login-form" onsubmit="fqEnviarLogin(event)" aria-labelledby="login-tit" novalidate>
      <span class="avatar big">${typeof ICON_PESSOA !== 'undefined' ? ICON_PESSOA : ''}</span>
      <h2 id="login-tit">${criar ? 'Criar sua conta' : 'Entrar no FarmaQuest'}</h2>
      <p>Entre para o seu progresso ficar salvo e aparecer em qualquer aparelho.</p>
      ${naWebView ? '<p class="nota-wv">Você abriu pelo WhatsApp (ou outro app). Aqui funciona o login com <b>e-mail e senha</b>.</p>'
        : `<button type="button" class="btn ghost google-btn" onclick="fqGoogle()"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Entrar com Google</button>
        <div class="ou"><span>ou</span></div>`}
      ${criar ? '<label for="lg-nome">Como você quer ser chamado?</label><input id="lg-nome" maxlength="30" autocomplete="given-name" placeholder="Ex.: Luiz">' : ''}
      <label for="lg-email">E-mail</label><input id="lg-email" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com">
      <label for="lg-senha">Senha</label><input id="lg-senha" type="password" autocomplete="${criar ? 'new-password' : 'current-password'}" placeholder="${criar ? 'Mínimo de 6 caracteres' : 'Sua senha'}">
      <div class="erro" id="lg-erro">${aviso || ''}</div>
      <button type="submit" class="btn" id="lg-ok">${criar ? 'Criar conta' : 'Entrar'}</button>
      <div class="login-links">
        ${criar ? '<button type="button" class="linkbtn" onclick="fqModo(\'entrar\')">Já tenho conta: entrar</button>'
          : '<button type="button" class="linkbtn" onclick="fqModo(\'criar\')">Não tenho conta: criar agora</button><button type="button" class="linkbtn" onclick="fqEsqueci()">Esqueci minha senha</button>'}
      </div>
    </form>`;
    m.hidden = false;
  }
  function fecharLogin() { const m = document.getElementById('perfil-modal'); if (m) { m.hidden = true; m.innerHTML = ''; } }
  function erro(t) { const el = document.getElementById('lg-erro'); if (el) el.textContent = t; const b = document.getElementById('lg-ok'); if (b) b.disabled = false; }
  window.fqModo = function (m) { modo = m; telaLogin(); };
  window.fqEnviarLogin = async function (ev) {
    ev.preventDefault();
    const email = (document.getElementById('lg-email').value || '').trim();
    const senha = document.getElementById('lg-senha').value || '';
    const nomeEl = document.getElementById('lg-nome');
    const nome = nomeEl ? (nomeEl.value || '').replace(/\s+/g, ' ').trim().slice(0, 30) : '';
    if (modo === 'criar' && !nome) return erro('Digite seu nome.');
    if (!email) return erro('Digite seu e-mail.');
    if (!senha) return erro('Digite a senha.');
    document.getElementById('lg-ok').disabled = true; erro('');
    try {
      if (modo === 'criar') {
        window.FQ_NOME_NOVO = nome; /* antes de criar: o login dispara na hora */
        const c = await auth.createUserWithEmailAndPassword(email, senha);
        await c.user.updateProfile({ displayName: nome });
      } else {
        await auth.signInWithEmailAndPassword(email, senha);
      }
    } catch (e) { erro(msgErro(e)); }
  };
  window.fqGoogle = async function () {
    const p = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(p); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request')) { try { await auth.signInWithRedirect(p); return; } catch (e2) { e = e2; } }
      erro(msgErro(e));
    }
  };
  window.fqEsqueci = async function () {
    const email = (document.getElementById('lg-email').value || '').trim();
    if (!email) return erro('Digite seu e-mail acima e toque de novo em "Esqueci minha senha".');
    try { await auth.sendPasswordResetEmail(email); erro(''); toast('Enviamos um e-mail para você criar uma nova senha.'); }
    catch (e) { erro(msgErro(e)); }
  };
  window.sairConta = async function () {
    try { if (unsub) unsub(); } catch (e) {}
    unsub = null; sync.ref = null;
    state = vazio(); saveLocal(); gravarDono(null);
    window.FQ_LOGADO = false;
    try { await auth.signOut(); } catch (e) {}
    perfilAberto = false; go('simulados');
  };

  /* ---------- progresso na nuvem ---------- */
  function conectar(user) {
    uidAtual = user.uid;
    const ref = fdb.collection('usuarios').doc(user.uid);
    sync.ref = { set: dados => ref.set(dados) };
    setSync('conectando');
    let primeiro = true;
    const timer = setTimeout(() => { if (sync.status === 'conectando') setSync('offline'); }, 10000);
    unsub = ref.onSnapshot({ includeMetadataChanges: true }, snap => {
      if (snap.metadata.hasPendingWrites) return;
      const confirmado = !snap.metadata.fromCache;
      if (primeiro) {
        if (!confirmado) return;
        primeiro = false; clearTimeout(timer);
        const remoto = snap.exists ? unpack(JSON.parse(JSON.stringify(snap.data()))) : null;
        const localDoUsuario = lerDono() === user.uid || !lerDono();
        if (remoto) state = localDoUsuario ? mesclar(state, remoto) : remoto;
        else if (!localDoUsuario) state = vazio();
        if (!state.perfil || !state.perfil.nome) {
          const nome = window.FQ_NOME_NOVO || user.displayName || '';
          if (nome) state.perfil = { nome: nome.split(' ')[0].slice(0, 30), criado: Date.now() };
        }
        state.updatedAt = Date.now(); saveLocal(); gravarDono(user.uid);
        window.FQ_LOGADO = true; fecharLogin(); perfilAberto = false; render(); escrever();
        return;
      }
      if (!confirmado) return;
      const remoto = snap.exists ? unpack(JSON.parse(JSON.stringify(snap.data()))) : null;
      if (remoto && remoto.updatedAt > (state.updatedAt || 0)) { state = remoto; saveLocal(); render(); setSync('ok'); }
      else if (!remoto || remoto.updatedAt < (state.updatedAt || 0)) escrever();
      else if (!sync.writing) setSync('ok');
    }, () => { clearTimeout(timer); setSync('offline'); });
  }

  window.iniciarNuvem = function () {
    const cfg = window.FQ_FIREBASE;
    if (!window.firebase || !cfg || !cfg.apiKey || /COLE/.test(cfg.apiKey)) {
      window.FQ_NUVEM_ATIVA = false; render(); /* sem configuração: funciona como antes, salvo no aparelho */
      return;
    }
    firebase.initializeApp(cfg);
    auth = firebase.auth(); fdb = firebase.firestore();
    try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
    auth.getRedirectResult().catch(e => { if (e && e.code) telaLogin(msgErro(e)); });
    let resolvido = false;
    setTimeout(() => { if (!resolvido) telaLogin(); }, 4000);
    auth.onAuthStateChanged(user => {
      resolvido = true;
      if (user) { if (user.uid !== uidAtual) conectar(user); }
      else { window.FQ_LOGADO = false; uidAtual = null; sync.ref = null; telaLogin(); }
    });
  };
})();

</script>
<script>
/* FarmaQuest — plataforma de simulados (UNIFSA · Farmácia) */
const MATERIAS = {
  cf:  { nome: 'Cuidados Farmacêuticos', prof: 'Prof. Manoel', sigla: 'CF' },
  dpf: { nome: 'Desenvolvimento de Produtos Farmacêuticos', prof: 'Prof. Bernardo', sigla: 'DPF' },
  cq:  { nome: 'Controle de Qualidade', prof: 'Profa. Líghia', sigla: 'CQ' },
};
const SIMS = [
  { key: '2026', nome: 'Provas 2026' },
  { key: '2025', nome: 'Provas 2025' },
  { key: 'ineditas', nome: 'Questões inéditas' },
  { key: 'integradora', nome: 'Prova Integradora', separada: true },
];
/* Prova Integradora: avaliação geral das 3 matérias, num bloco próprio abaixo dos cartões (rota sim/geral/integradora) */
const GERAL = 'geral';
const LETRAS = ['A', 'B', 'C', 'D', 'E', 'F'];
const STORE = 'farmaquest:v1';
const VIEWS = ['simulados', 'treinar', 'flashcards', 'formulas', 'desempenho'];

/* ---------- o navegador consegue guardar dados? ---------- */
const armazenamentoOk = (() => {
  try { const k = 'farmaquest:teste'; localStorage.setItem(k, '1'); const ok = localStorage.getItem(k) === '1'; localStorage.removeItem(k); return ok; }
  catch (e) { return false; }
})();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

/* ---------- estado salvo ---------- */
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
  if (!s || typeof s !== 'object') s = {};
  return {
    answers: s.answers || {}, attempts: s.attempts || [], custom: s.custom || {},
    orders: s.orders || {}, settings: Object.assign({ shuffle: false }, s.settings || {}), fc: s.fc || {},
    updatedAt: s.updatedAt || 0, perfil: s.perfil || null
  };
}
let state = load();
function saveLocal() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function save() { state.updatedAt = Date.now(); saveLocal(); agendarSync(); }

/* ---------- sincronização com a conta do Claude (privada por pessoa) ---------- */
const sync = { ref: null, status: 'local', timer: null, writing: false, again: false };
const SYNC_TXT = {
  local: '💾 Progresso salvo neste aparelho',
  conectando: '⏳ Conectando à sua conta…',
  salvando: '☁️ Salvando na sua conta…',
  ok: '☁️ Progresso sincronizado com sua conta',
  offline: '⚠️ Sem conexão com a conta agora: salvando neste aparelho',
  erro: '💾 Progresso salvo neste aparelho',
  bloqueado: '⚠️ Este navegador não está salvando seu progresso. Antes de sair, toque aqui e copie seu código de backup.'
};
function syncEfetivo() { return sync.status; }
function syncBadge() {
  const s = syncEfetivo();
  return `<span class="sync-pill ${s === 'bloqueado' ? 'alerta' : ''}" id="sync-status" role="status" ${s === 'bloqueado' ? 'onclick="abrirBackup(\'export\')" style="cursor:pointer"' : ''}>${SYNC_TXT[s]}</span>`;
}
function setSync(s) { sync.status = s; const el = document.getElementById('sync-status'); if (el) el.outerHTML = syncBadge(); }

/* ---------- backup por código ---------- */
function gerarCodigo() {
  const p = pack(); delete p.orders;
  return 'FQ1:' + btoa(unescape(encodeURIComponent(JSON.stringify(p))));
}
function lerCodigo(txt) {
  const t = String(txt || '').replace(/\s+/g, '');
  if (!t.startsWith('FQ1:')) throw new Error('formato');
  return unpack(JSON.parse(decodeURIComponent(escape(atob(t.slice(4))))));
}
function abrirBackup(modo) {
  const m = document.getElementById('perfil-modal'); if (!m) return;
  if (modo === 'export') {
    m.innerHTML = `<div class="perfil-card" role="dialog" aria-labelledby="bk-tit">
      <h2 id="bk-tit">Copiar meu progresso</h2>
      <p>Este código guarda seu perfil e todas as suas respostas. Mande para você mesmo no WhatsApp. Para recuperar em outro aparelho ou navegador, use <b>Restaurar com código</b>.</p>
      <textarea id="bk-out" class="bk-area" readonly aria-label="Seu código de backup">${gerarCodigo()}</textarea>
      <div class="acoes"><button class="btn ghost" onclick="fecharPerfil()">Fechar</button><button class="btn" id="bk-copiar" onclick="copiarCodigo()">Copiar código</button></div>
    </div>`;
  } else {
    m.innerHTML = `<div class="perfil-card" role="dialog" aria-labelledby="bk-tit">
      <h2 id="bk-tit">Restaurar meu progresso</h2>
      <p>Cole aqui o código que você copiou antes (começa com <b>FQ1:</b>).</p>
      <textarea id="bk-in" class="bk-area" aria-label="Código de backup" placeholder="FQ1:..."></textarea>
      <div class="erro" id="bk-erro"></div>
      <div class="acoes"><button class="btn ghost" onclick="fecharPerfil()">Cancelar</button><button class="btn" onclick="restaurarCodigo()">Restaurar</button></div>
    </div>`;
  }
  m.hidden = false; perfilAberto = true; perfilPrimeira = false;
}
function copiarCodigo() {
  const ta = document.getElementById('bk-out'); const b = document.getElementById('bk-copiar');
  const ok = () => { if (b) b.textContent = 'Copiado ✓'; };
  const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { if (b) b.textContent = 'Selecione e copie'; } };
  try { navigator.clipboard.writeText(ta.value).then(ok, fallback); } catch (e) { fallback(); }
}
function restaurarCodigo() {
  let r;
  try { r = lerCodigo(document.getElementById('bk-in').value); }
  catch (e) { document.getElementById('bk-erro').textContent = 'Código inválido. Confira se copiou o código inteiro, começando por FQ1:'; return; }
  const perfil = r.perfil && r.perfil.nome ? r.perfil : state.perfil;
  state = mesclar(state, r); state.perfil = perfil;
  save(); fecharPerfil(); render();
  toast('Progresso restaurado' + (perfil && perfil.nome ? `. Bem-vindo de volta, ${perfil.nome}!` : '.'));
}
function pack() {
  return {
    v: 1, updatedAt: state.updatedAt || Date.now(), answers: state.answers, custom: state.custom,
    orders: state.orders, settings: state.settings, fc: state.fc, perfil: state.perfil || null,
    att: state.attempts.map(a => `${a.q}|${a.s}|${a.ok ? 1 : 0}|${(a.t || 0).toString(36)}`)
  };
}
function unpack(d) {
  return {
    answers: d.answers || {}, custom: d.custom || {}, orders: d.orders || {},
    settings: Object.assign({ shuffle: false }, d.settings || {}), fc: d.fc || {}, updatedAt: d.updatedAt || 0,
    perfil: d.perfil || null,
    attempts: (d.att || []).map(str => {
      const [q, s, ok, t] = String(str).split('|'); const qq = QIDX[q];
      return { q, m: qq ? qq.materia : '', s, a: qq ? qq.assunto : '', ok: ok === '1', t: parseInt(t, 36) || 0 };
    })
  };
}
function mesclar(a, b) {
  const answers = {};
  new Set([...Object.keys(a.answers), ...Object.keys(b.answers)]).forEach(k => { answers[k] = Object.assign({}, b.answers[k] || {}, a.answers[k] || {}); });
  const vistos = new Set(); const attempts = [];
  [...b.attempts, ...a.attempts].forEach(x => { const k = x.q + '@' + x.t; if (!vistos.has(k)) { vistos.add(k); attempts.push(x); } });
  attempts.sort((x, y) => x.t - y.t);
  return {
    answers, attempts, custom: Object.assign({}, b.custom, a.custom), orders: Object.assign({}, b.orders, a.orders),
    settings: a.settings, fc: Object.assign({}, b.fc, a.fc), updatedAt: Date.now(),
    perfil: (a.perfil && a.perfil.nome) ? a.perfil : (b.perfil || null)
  };
}
async function escrever() {
  if (!sync.ref) return;
  if (sync.writing) { sync.again = true; return; }
  sync.writing = true; setSync('salvando');
  try { await sync.ref.set(pack()); setSync('ok'); }
  catch (e) {
    if (e && e.code === 'unavailable') { setSync('offline'); setTimeout(escrever, 2000 + Math.random() * 2000); }
    else { setSync('erro'); sync.ref = null; }
  } finally {
    sync.writing = false;
    if (sync.again && sync.ref) { sync.again = false; escrever(); }
  }
}
function agendarSync() { if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(escrever, 1200); }
async function iniciarSync() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  let uid = null; try { uid = await user.id(); } catch (e) {}
  if (!uid) return;
  let ref; try { ref = db.doc('data/users/' + uid + '/progresso'); } catch (e) { return; }
  sync.ref = ref; setSync('conectando');
  const flag = 'farmaquest:sync:' + uid;
  let jaMesclou = false; try { jaMesclou = localStorage.getItem(flag) === '1'; } catch (e) {}
  const timer = setTimeout(() => { if (sync.status === 'conectando') setSync('offline'); }, 10000);
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const confirmado = !snap.metadata.fromCache;
    if (confirmado) clearTimeout(timer);
    const remoto = snap.exists ? unpack(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (!jaMesclou) {
      if (!confirmado) return;
      state = remoto ? mesclar(state, remoto) : Object.assign(state, { updatedAt: Date.now() });
      saveLocal(); jaMesclou = true; try { localStorage.setItem(flag, '1'); } catch (e) {}
      render(); escrever(); return;
    }
    if (remoto && remoto.updatedAt > (state.updatedAt || 0)) { state = remoto; saveLocal(); render(); if (confirmado) setSync('ok'); }
    else if (confirmado && (!remoto || remoto.updatedAt < (state.updatedAt || 0))) escrever();
    else if (confirmado && !sync.writing) setSync('ok');
  }, () => { clearTimeout(timer); setSync('offline'); sync.ref = null; });
}

/* ---------- simulados e treinos ---------- */
const simKey = (m, s) => m + '|' + s;
const getAns = (m, s) => (state.answers[simKey(m, s)] ||= {});
function baseQs(m, s) {
  if (m === 'treino') { const c = state.custom[s]; return c ? c.ids.map(byId).filter(Boolean) : []; }
  if (m === GERAL) return window.QUESTOES.filter(q => q.simulado === s);
  return window.QUESTOES.filter(q => q.materia === m && q.simulado === s);
}
function questoes(m, s) {
  const qs = baseQs(m, s);
  const o = state.orders[simKey(m, s)];
  if (!o) return qs;
  const pos = new Map(o.q.map((id, i) => [id, i]));
  return qs.slice().sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9));
}
function perm(m, s, q) {
  const o = state.orders[simKey(m, s)];
  const p = o && o.a && o.a[q.id];
  return (p && p.length === q.alternativas.length) ? p : q.alternativas.map((_, i) => i);
}
const embaralhado = (m, s) => !!state.orders[simKey(m, s)];
function iniciar(m, s) {
  const k = simKey(m, s);
  if (state.settings.shuffle) {
    const qs = baseQs(m, s); const a = {};
    qs.forEach(q => { a[q.id] = shuffle(q.alternativas.map((_, i) => i)); });
    state.orders[k] = { q: shuffle(qs.map(q => q.id)), a };
  } else delete state.orders[k];
}
function simNome(m, s) {
  if (m === 'treino') return (state.custom[s] || {}).nome || 'Treino';
  return (SIMS.find(x => x.key === s) || {}).nome || s;
}
function simSub(m, s) {
  if (m === 'treino') return (state.custom[s] || {}).sub || '';
  if (m === GERAL) return 'Avaliação geral · ' + Object.values(MATERIAS).map(x => x.sigla).join(', ');
  return MATERIAS[m].nome + ' · ' + MATERIAS[m].prof;
}
function ultimos() { const last = {}; state.attempts.forEach(a => { last[a.q] = a.ok; }); return last; }
function erradasIds(m) {
  const last = ultimos();
  return Object.keys(last).filter(id => last[id] === false && byId(id) && (!m || byId(id).materia === m));
}
function criarTreino(nome, sub, ids) {
  if (!ids.length) { toast('Não há questões para treinar aqui.'); return; }
  const id = 't' + Date.now().toString(36);
  state.custom[id] = { nome, sub, ids, t: Date.now() };
  Object.keys(state.custom).sort((a, b) => state.custom[b].t - state.custom[a].t).slice(15).forEach(k => {
    delete state.custom[k]; delete state.answers[simKey('treino', k)]; delete state.orders[simKey('treino', k)];

  iniciar('treino', id); save(); go(`sim/treino/${id}/1`);
}
function treinarErradas(m) {
  criarTreino(m ? 'Erradas · ' + MATERIAS[m].sigla : 'Todas as que errei', m ? MATERIAS[m].nome : 'Todas as matérias', erradasIds(m));
}
function treinarAssunto(m, i) {
  const a = ASSUNTOS[m][i];

}
function treinarMateria(m) {
  criarTreino('Tudo de ' + MATERIAS[m].sigla, MATERIAS[m].nome + ' · todas as questões', window.QUESTOES.filter(q => q.materia === m).map(q => q.id));
}
function refazerErradas(m, s) {
  const ans = getAns(m, s);
  const ids = questoes(m, s).filter(q => ans[q.id] !== undefined && ans[q.id] !== q.correta).map(q => q.id);
  criarTreino('Erradas · ' + simNome(m, s), simSub(m, s), ids);
}
