/* ---------- questão ---------- */
function viewQuestao(m, s, n) {
  const qs = questoes(m, s);
  if (!qs.length) return go(m === 'treino' ? 'treinar' : 'simulados');
  n = Math.min(Math.max(1, n || 1), qs.length);
  const q = qs[n - 1];
  const ans = getAns(m, s);
  const resp = ans[q.id];
  const respondida = resp !== undefined;
  const p = perm(m, s, q);
  const feitos = qs.filter(x => ans[x.id] !== undefined).length;
  const mat = MATERIAS[q.materia];

  const nav = qs.map((x, i) => {
    const r = ans[x.id];
    const cls = r === undefined ? '' : r === x.correta ? 'ok' : 'err';
    return `<button class="${cls} ${i === n - 1 ? 'cur' : ''}" aria-label="Questão ${i + 1}" onclick="go('sim/${m}/${s}/${i + 1}')">${i + 1}</button>`;
  }).join('');
  const alts = p.map((orig, pos) => {
    let cls = '';
    if (respondida) { if (orig === q.correta) cls = 'right'; else if (orig === resp) cls = 'wrong'; }
    else if (selecao === orig) cls = 'sel';
    return `<li class="alt ${cls}" ${respondida ? '' : `onclick="selecionar(${orig})"`}><span class="L">${LETRAS[pos]}</span><span class="T">${q.alternativas[orig]}</span></li>`;
  }).join('');
  const acertou = respondida && resp === q.correta;
  const meta = `<span><b>Ano:</b> ${q.ano}</span><span><b>Matéria:</b> ${mat.nome}</span><span><b>Prova:</b> ${q.origem}</span>${q.adaptada ? '<span class="badge" title="Questão discursiva ou V/F convertida em múltipla escolha">Adaptada</span>' : ''}${q.simulado === 'ineditas' ? '<span class="badge blue">Inédita</span>' : ''}`;
  const voltar = m === 'treino' ? `go('treinar')` : `go('simulados')`;

  app.innerHTML = `
  <button class="backlink" onclick="${voltar}">← Voltar</button>
  <div class="qlayout">
    <section style="min-width:0">
      <div class="qcard">
        <div class="qhead"><span class="qnum">${n}</span><span class="qcode">${q.id}</span>
          <span class="qpath">${mat.nome}<span class="sep">›</span>${esc(q.assunto)}</span></div>
        <div class="qmeta">${meta}</div>
        <div class="qbody ${respondida ? 'locked' : ''}">
          <div class="enun">${q.enunciado}</div>
          <ul class="alts">${alts}</ul>
        </div>
        <div class="qactions">
          ${respondida
            ? `<span class="result ${acertou ? 'ok' : 'err'}">${acertou ? '✓ Você acertou!' : `✗ Você errou (marcou ${LETRAS[p.indexOf(resp)]})`}</span>`
            : `<button class="btn" ${selecao === null ? 'disabled' : ''} onclick="responder('${m}','${s}','${q.id}')">Responder</button>`}
          <span class="spacer"></span>
          <button class="btn ghost small" ${n === 1 ? 'disabled' : ''} onclick="go('sim/${m}/${s}/${n - 1}')">‹ Anterior</button>
          ${n < qs.length
            ? `<button class="btn ghost small" onclick="go('sim/${m}/${s}/${n + 1}')">Próxima ›</button>`
            : `<button class="btn small" onclick="go('resumo/${m}/${s}')">Finalizar e ver resumo</button>`}
        </div>
        <div class="tabs">
          <button class="${tabAtual === 'gab' ? 'active' : ''}" ${respondida ? '' : 'disabled title="Responda para liberar"'} onclick="trocarTab('gab')">Gabarito Comentado</button>
          <button class="${tabAtual === 'est' ? 'active' : ''}" onclick="trocarTab('est')">Estatísticas</button>
        </div>
        ${painelTab(m, s, q, resp)}
      </div>
    </section>
    <aside class="sidebar">
      <h4>${esc(simNome(m, s))}</h4>
      <div class="muted">${esc(simSub(m, s))} · ${feitos}/${qs.length} respondidas${embaralhado(m, s) ? ' · embaralhado' : ''}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Acerto</span><span><i style="background:var(--err)"></i>Erro</span><span><i style="background:var(--card)"></i>Em branco</span></div>
      <div class="qnav">${nav}</div>
      <button class="btn small" style="width:100%" onclick="go('resumo/${m}/${s}')">Ver resumo</button>
    </aside>
  </div>`;
}
function painelTab(m, s, q, resp) {
  const respondida = resp !== undefined;
  if (tabAtual === 'gab' && respondida) {
    const p = perm(m, s, q);
    const mix = embaralhado(m, s);
    const posC = p.indexOf(q.correta);
    const exps = p.map((orig, pos) => {
      const certa = orig === q.correta, minha = orig === resp && !certa;
      const o = mix && orig !== pos ? `<span class="orig">(letra ${LETRAS[orig]} na prova original)</span>` : '';
      return `<div class="exp ${certa ? 'right' : 'wrongx'} ${minha ? 'mine' : ''}">
        <h5>${LETRAS[pos]}) ${certa ? '✓ Correta' : '✗ Errada'}${minha ? '<span class="you">(sua resposta)</span>' : ''}${o}</h5>
        <p>${q.explicacoes[orig]}</p></div>`;
    }).join('');
    return `<div class="tabpanel"><p class="gab">Gabarito: letra ${LETRAS[posC]}${mix && posC !== q.correta ? `<span class="orig">(letra ${LETRAS[q.correta]} na prova original)</span>` : ''}</p>${exps}
      ${mix ? '<div class="note info"><b>Embaralhado:</b> as letras citadas dentro dos comentários e avisos seguem a prova original.</div>' : ''}
      ${q.obs ? `<div class="note"><b>Atenção:</b> ${q.obs}</div>` : ''}
      ${q.fonte ? `<div class="src"><b>Base:</b> ${q.fonte}</div>` : ''}</div>`;
  }
  if (!respondida && tabAtual !== 'est') return `<div class="tabpanel"><p class="empty">Marque uma alternativa e clique em <b>Responder</b> para ver o gabarito comentado.</p></div>`;
  const at = state.attempts.filter(a => a.q === q.id);
  const ok = at.filter(a => a.ok).length;
  return `<div class="tabpanel"><div class="stat-big">
    <div><b>${at.length}</b><span>vezes respondida</span></div>
    <div><b>${ok}</b><span>acertos</span></div>
    <div><b>${at.length ? pct(ok, at.length) + '%' : '—'}</b><span>aproveitamento</span></div></div></div>`;
}
function trocarTab(t) { tabAtual = t; render(); }
function selecionar(i) { selecao = i; render(); }
function responder(m, s, id) {
  if (selecao === null) return;
  const q = byId(id);
  getAns(m, s)[id] = selecao;
  state.attempts.push({ q: id, m: q.materia, s: m === 'treino' ? 'treino' : s, a: q.assunto, ok: selecao === q.correta, t: Date.now() });
  save(); selecao = null; tabAtual = 'gab'; render();
}

/* ---------- resumo ---------- */
function viewResumo(m, s) {
  const qs = questoes(m, s);
  const ans = getAns(m, s);
  const feitos = qs.filter(q => ans[q.id] !== undefined);
  const certos = feitos.filter(q => ans[q.id] === q.correta);
  const erradas = feitos.filter(q => ans[q.id] !== q.correta);
  const porAssunto = {};
  feitos.forEach(q => { const a = (porAssunto[q.assunto] ||= { t: 0, ok: 0 }); a.t++; if (ans[q.id] === q.correta) a.ok++; });
  const nota = qs.length ? ((certos.length / qs.length) * 10).toFixed(1).replace('.', ',') : '0';
  const embranco = qs.length - feitos.length;
  const voltar = m === 'treino' ? `go('treinar')` : `go('simulados')`;

  app.innerHTML = `
  <button class="backlink" onclick="${voltar}">← Voltar</button>
  <h1>Resumo · ${esc(simNome(m, s))}</h1><p class="sub">${esc(simSub(m, s))}</p>
  <div class="kpis">
    <div class="kpi"><span>Nota (0 a 10)</span><b>${nota}</b><small>sobre ${qs.length} questões</small></div>
    <div class="kpi"><span>Acertos</span><b style="color:var(--ok)">${certos.length}</b><small>${pct(certos.length, feitos.length)}% das respondidas</small></div>
    <div class="kpi"><span>Erros</span><b style="color:var(--err)">${erradas.length}</b></div>
    <div class="kpi"><span>Em branco</span><b style="color:var(--muted)">${embranco}</b></div>
  </div>
  <div class="row-actions" style="margin:4px 0 18px">
    ${erradas.length ? `<button class="btn" onclick="refazerErradas('${m}','${s}')">Refazer só as que errei (${erradas.length})</button>` : ''}
    ${embranco ? `<button class="btn ghost" onclick="go('sim/${m}/${s}/${qs.findIndex(q => ans[q.id] === undefined) + 1}')">Continuar respondendo</button>` : ''}
    <button class="btn ghost" onclick="refazer('${m}','${s}')">${confirmando === 'refazer' ? 'Clique de novo para apagar e recomeçar' : 'Refazer este simulado'}</button>
  </div>
  <div class="panel"><h3>% de acertos por assunto</h3>${barras(porAssunto) || '<p class="empty">Nenhuma questão respondida ainda.</p>'}</div>
  <div class="panel"><h3>Questões que você errou</h3>${erradas.length ? `<ul class="list">${erradas.map(q => {
      const i = qs.indexOf(q) + 1; const p = perm(m, s, q);
      return `<li><span class="dot" style="background:var(--err)"></span><span class="grow"><b>Questão ${i}</b> · ${esc(q.assunto)}<br><span class="meta">marcou ${LETRAS[p.indexOf(ans[q.id])]}, correta ${LETRAS[p.indexOf(q.correta)]}</span></span><button class="btn ghost small" onclick="go('sim/${m}/${s}/${i}')">Rever</button></li>`;
    }).join('')}</ul>` : '<p class="empty">Nenhum erro até aqui.</p>'}</div>`;
}
function refazer(m, s) {
  if (confirmando !== 'refazer') { confirmando = 'refazer'; render(); return; }
  state.answers[simKey(m, s)] = {}; iniciar(m, s); save(); go(`sim/${m}/${s}/1`);
}
function barras(obj, m) {
  return Object.entries(obj).sort((a, b) => pct(a[1].ok, a[1].t) - pct(b[1].ok, b[1].t)).map(([nome, v]) => {
    const p = pct(v.ok, v.t);
    const idx = m ? ASSUNTOS[m].indexOf(nome) : -1;
    return `<div class="brow ${idx > -1 ? 'has-btn' : ''}"><span>${esc(nome)}</span><span class="bar"><i style="width:${Math.max(p, 2)}%;background:${corPct(p)}"></i></span><span class="v">${p}% <span class="n">(${v.ok}/${v.t})</span></span>${idx > -1 ? `<button class="btn ghost small" onclick="treinarAssunto('${m}',${idx})">Treinar</button>` : ''}</div>`;
  }).join('');
}

/* ---------- treinar ---------- */
function viewTreinar() {
  const m = treinoMat;
  const last = ultimos();
  const todas = window.QUESTOES.filter(q => q.materia === m);
  const err = erradasIds(m).length;
  const chips = Object.entries(MATERIAS).map(([k, v]) => `<button class="chip ${k === m ? 'on' : ''}" onclick="treinoMat='${k}';render()">${v.sigla} · ${v.nome}</button>`).join('');
  const linhas = ASSUNTOS[m].map((a, i) => {
    const qs = todas.filter(q => q.assunto === a);
    const resp = qs.filter(q => last[q.id] !== undefined); const ok = resp.filter(q => last[q.id]).length;
    const p = pct(ok, resp.length);
    return `<li><span class="grow"><b>${esc(a)}</b><br><span class="meta">${qs.length} questões · ${resp.length ? `${p}% de acerto nas últimas respostas (${ok}/${resp.length})` : 'ainda não respondido'}</span>
      <span class="pbar" style="display:block;max-width:320px"><i style="width:${resp.length ? Math.max(p, 2) : 0}%;background:${corPct(p)}"></i></span></span>
      <button class="btn small" onclick="treinarAssunto('${m}',${i})">Treinar</button></li>`;
  }).join('');
  const recentes = Object.entries(state.custom).sort((a, b) => b[1].t - a[1].t).map(([id, c]) => {
    const ans = getAns('treino', id); const feitos = c.ids.filter(x => ans[x] !== undefined).length;
    return `<li><span class="grow"><b>${esc(c.nome)}</b><br><span class="meta">${esc(c.sub)} · ${feitos}/${c.ids.length} respondidas</span></span><button class="btn ghost small" onclick="abrir('treino','${id}')">${feitos === c.ids.length ? 'Ver resumo' : 'Continuar'}</button></li>`;
  }).join('');
  app.innerHTML = `<h1>Treinar</h1><p class="sub">Monte um treino com questões de um assunto (provas de 2025, 2026 e inéditas juntas) ou só com as que você errou. O embaralhamento da página inicial também vale aqui.</p>
  <div class="chips">${chips}</div>
  <div class="panel"><h3>Atalhos</h3><ul class="list">
    <li><span class="grow"><b>Só as que errei</b><br><span class="meta">${err} questões cuja última resposta foi errada</span></span><button class="btn small" ${err ? '' : 'disabled'} onclick="treinarErradas('${m}')">Treinar</button></li>
    <li><span class="grow"><b>Todas as questões da matéria</b><br><span class="meta">${todas.length} questões</span></span><button class="btn ghost small" onclick="treinarMateria('${m}')">Treinar</button></li>
  </ul></div>
  <div class="panel"><h3>Por assunto</h3><ul class="list">${linhas}</ul></div>
  ${recentes ? `<div class="panel"><h3>Treinos recentes</h3><ul class="list">${recentes}</ul></div>` : ''}`;
}

/* ---------- flashcards ---------- */
function fcMontar() {
  let cards = window.FLASHCARDS.filter(c => fcMat === 'todas' || c.m === fcMat);
  if (fcSoErros) cards = cards.filter(c => state.fc[c.id] === false);
  fcDeck = shuffle(cards.map(c => c.id)); fcPos = 0; fcVirado = false;
}
function fcFiltro(m) { fcMat = m; fcMontar(); render(); }
function fcToggleErros(v) { fcSoErros = v; fcMontar(); render(); }
function fcVirar() { fcVirado = !fcVirado; render(); }
function fcMover(d) { if (!fcDeck.length) return; fcPos = (fcPos + d + fcDeck.length) % fcDeck.length; fcVirado = false; render(); }
function fcMarcar(ok) { state.fc[fcDeck[fcPos]] = ok; save(); fcMover(1); }
function viewFlash() {
  if (!fcDeck) fcMontar();
  const FC = {}; window.FLASHCARDS.forEach(c => { FC[c.id] = c; });
  const chips = [['todas', 'Todas']].concat(Object.entries(MATERIAS).map(([k, v]) => [k, v.nome])).map(([k, l]) => `<button class="chip ${k === fcMat ? 'on' : ''}" onclick="fcFiltro('${k}')">${l}</button>`).join('');
  const universo = window.FLASHCARDS.filter(c => fcMat === 'todas' || c.m === fcMat);
  const acert = universo.filter(c => state.fc[c.id] === true).length, err = universo.filter(c => state.fc[c.id] === false).length;
  let corpo;
  if (!fcDeck.length) corpo = `<div class="panel"><p class="empty">${fcSoErros ? 'Você não tem cartões marcados como "Errei" neste filtro.' : 'Nenhum cartão neste filtro.'}</p></div>`;
  else {
    const c = FC[fcDeck[fcPos]];
    corpo = `<div class="fc-meta">Cartão ${fcPos + 1} de ${fcDeck.length} · ${MATERIAS[c.m].nome} · ${esc(c.assunto)}</div>
    <button class="fc-card ${fcVirado ? 'flip' : ''}" onclick="fcVirar()" aria-label="Virar cartão">
      <span class="lbl">${fcVirado ? 'Resposta' : 'Pergunta'}</span>
      <span class="txt">${fcVirado ? c.v : c.f}</span>
      <span class="hint">${fcVirado ? 'Toque para voltar à pergunta' : 'Toque para ver a resposta'}</span>
    </button>
    <div class="row-actions">
      <button class="btn ghost small" onclick="fcMover(-1)">‹ Anterior</button>
      <button class="btn danger small" onclick="fcMarcar(false)">✗ Errei</button>
      <button class="btn small" onclick="fcMarcar(true)">✓ Acertei</button>
      <button class="btn ghost small" onclick="fcMover(1)">Próximo ›</button>
      <span class="spacer"></span>
      <button class="btn ghost small" onclick="fcMontar();render()">Embaralhar</button>
    </div>`;
  }
  app.innerHTML = `<h1>Flashcards</h1><p class="sub">Leia a pergunta, responda de cabeça e toque no cartão para conferir. Marque se acertou; depois revise só os que errou.</p>
  <div class="chips">${chips}</div>
  <label class="toggle" for="opt-fcerr"><input type="checkbox" id="opt-fcerr" ${fcSoErros ? 'checked' : ''} onchange="fcToggleErros(this.checked)"><span>Mostrar só os cartões que marquei como <b>Errei</b></span></label>
  ${corpo}
  <div class="fc-stats">Neste filtro: ${universo.length} cartões · ${acert} marcados como acertei · ${err} como errei</div>`;
}

/* ---------- fórmulas ---------- */
function viewFormulas() {
  const grupos = [...new Set(window.FORMULAS.map(f => f.grupo))];
  const chips = [['todas', 'Todas']].concat(grupos.map(g => [g, g])).map(([k, l]) => `<button class="chip ${k === fmGrupo ? 'on' : ''}" onclick="fmGrupo=this.dataset.g;render()" data-g="${esc(k)}">${esc(l)}</button>`).join('');
  const html = grupos.filter(g => fmGrupo === 'todas' || g === fmGrupo).map(g => `<h2 class="grp">${esc(g)}</h2><div class="fgrid">${window.FORMULAS.filter(f => f.grupo === g).map(f => `
    <div class="fcard"><h4>${f.nome}</h4><div class="formula">${f.formula}</div>${f.uso ? `<p>${f.uso}</p>` : ''}${f.ex ? `<p class="ex"><b>Exemplo:</b> ${f.ex}</p>` : ''}</div>`).join('')}</div>`).join('');
  app.innerHTML = `<h1>Fórmulas</h1><p class="sub">Os cálculos que mais caem nas provas, com quando usar e um exemplo resolvido.</p><div class="chips">${chips}</div>${html}`;
}

/* ---------- desempenho ---------- */
function viewDesempenho() {
  const at = state.attempts;
  const ok = at.filter(a => a.ok).length;
  const distintas = new Set(at.map(a => a.q)).size;
  const errTotal = erradasIds().length;
  let h = `<h1>Desempenho</h1><p class="sub">Calculado com todas as suas respostas. Os assuntos aparecem do mais fraco para o mais forte; use "Treinar" para praticar um assunto.</p>${syncBadge()}
  <div class="kpis">
    <div class="kpi"><span>Aproveitamento geral</span><b style="color:${at.length ? corPct(pct(ok, at.length)) : 'var(--heading)'}">${at.length ? pct(ok, at.length) + '%' : '—'}</b><small>${ok} acertos em ${at.length} respostas</small></div>
    <div class="kpi"><span>Questões já vistas</span><b>${distintas}</b><small>de ${window.QUESTOES.length} no banco</small></div>`;
  for (const [m, info] of Object.entries(MATERIAS)) {
    const a = at.filter(x => x.m === m); const o = a.filter(x => x.ok).length;
    h += `<div class="kpi"><span>${info.sigla} · ${info.prof}</span><b style="color:${a.length ? corPct(pct(o, a.length)) : 'var(--heading)'}">${a.length ? pct(o, a.length) + '%' : '—'}</b><small>${a.length} respostas</small></div>`;
  }
  h += `</div><div class="row-actions" style="margin:4px 0 18px"><button class="btn" ${errTotal ? '' : 'disabled'} onclick="treinarErradas()">Treinar todas as que errei (${errTotal})</button></div>`;
  for (const [m, info] of Object.entries(MATERIAS)) {
    const a = at.filter(x => x.m === m);
    const porAssunto = {}; a.forEach(x => { const r = (porAssunto[x.a] ||= { t: 0, ok: 0 }); r.t++; if (x.ok) r.ok++; });
    const porSim = SIMS.concat([{ key: 'treino', nome: 'Treinos' }]).map(s => { const b = a.filter(x => x.s === s.key); const o = b.filter(x => x.ok).length; return b.length ? `${s.nome}: <b>${pct(o, b.length)}%</b>` : null; }).filter(Boolean).join(' · ');
    const o = a.filter(x => x.ok).length; const em = erradasIds(m).length;
    h += `<div class="panel"><h3>${info.nome}<span class="pct" style="color:${a.length ? corPct(pct(o, a.length)) : 'var(--muted)'}">${a.length ? pct(o, a.length) + '%' : 'sem respostas'}</span></h3>
      ${porSim ? `<p style="margin:-4px 0 10px;font-size:14px;color:var(--muted)">${porSim}</p>` : ''}
      ${barras(porAssunto, m) || '<p class="empty">Responda questões desta matéria para ver o % por assunto.</p>'}
      ${em ? `<div class="row-actions"><button class="btn ghost small" onclick="treinarErradas('${m}')">Treinar as que errei em ${info.sigla} (${em})</button></div>` : ''}</div>`;
  }
  h += `<div class="row-actions"><button class="btn danger small" onclick="zerar()">${confirmando === 'zerar' ? 'Clique de novo para apagar TUDO' : 'Apagar todo o progresso'}</button></div>`;
  app.innerHTML = h;
}
function zerar() {
  if (confirmando !== 'zerar') { confirmando = 'zerar'; render(); return; }
  state = { answers: {}, attempts: [], custom: {}, orders: {}, settings: state.settings, fc: {}, updatedAt: 0, perfil: state.perfil }; save(); go('desempenho'); toast('Progresso apagado.');
}

/* ---------- tema claro/escuro ---------- */
const TEMA_KEY = 'farmaquest:tema';
const ICON_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const ICON_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
function temaAtual() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark' || t === 'light') return t;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function aplicarTema(t) {
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('theme-btn');
  if (b) {
    const escuro = temaAtual() === 'dark';
    b.innerHTML = escuro ? ICON_SOL : ICON_LUA;
    b.title = escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro';
    b.setAttribute('aria-label', b.title);
  }
}
function alternarTema() {
  const novo = temaAtual() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(TEMA_KEY, novo); } catch (e) {}
  aplicarTema(novo);
}
(function () { let t = null; try { t = localStorage.getItem(TEMA_KEY); } catch (e) {} aplicarTema(t); })();

render();
if (window.FQ_NUVEM_ATIVA && typeof window.iniciarNuvem === 'function') window.iniciarNuvem();
else iniciarSync();

</script>
</body>
</html>
