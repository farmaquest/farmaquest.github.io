    'Errada. Basta dividir pelo declarado (500 mg) para ter o %.',
    'Errada. A dissolução avalia a liberação do fármaco (resistência mecânica é dureza e friabilidade), e ambos passam (≥ 80%).'
  ],
  obs: 'Na prova original nenhuma das alternativas estava correta pelos cálculos, e a questão parece ter sido anulada (todos ganharam o ponto). Aqui ela foi reescrita com uma alternativa certa para você treinar os cálculos.',
  fonte: 'Cap. 14 (Ensaios Físicos Sólidos), p. 265–267 (friabilidade ≤ 1,5%; peso médio > 324 mg ± 5%; teor 95–105%).'
},
{
  id: 'CQ26-P2-02', origem: '2026 – 2ª VA (Q2)', assunto: 'Cromatografia (CCD, CLAE e CG)',
  enun: `Uma placa de CCD foi usada para avaliar a estabilidade do maleato de timolol: A – padrão; B – amostra em meio ácido; C – amostra em meio básico; D – amostra aquecida a 190 °C por 10 min. Fase estacionária: sílica-gel 60 F254; fase móvel: metanol, água e hidróxido de amônio; visualização em UV 254 nm. (Na figura, B, C e D apresentam manchas adicionais em alturas diferentes da do padrão.)

Assinale a correta:`,
  alts: [
    'Na fase reversa, a fase estacionária é polar e a móvel predominantemente apolar; por isso os compostos mais polares ficam mais retidos.',
    'A formação de novas manchas em B, C ou D, com Rf diferentes do padrão, pode indicar a formação de produtos de degradação do fármaco.',
    'Quanto maior o Rf, maior a afinidade pela fase estacionária e mais retida a substância.',
    'A comparação dos Rf entre as amostras permite quantificar os produtos de degradação.',
    'Uma única mancha na mesma posição do padrão comprova definitivamente identidade e pureza, dispensando outras técnicas.'
  ],
  c: 'B',
  e: [
    'Errada. Isso descreve a fase NORMAL. Na fase reversa, a fase estacionária é apolar (C18) e a móvel é polar.',
    'Correta. Manchas novas, com Rf diferente do padrão, indicam compostos diferentes do fármaco, ou seja, produtos de degradação formados pelo estresse (degradação forçada).',
    'Errada. É o contrário: Rf alto significa que a substância migrou mais, tem menor afinidade pela estacionária e maior pela móvel.',
    'Errada. A CCD comum é qualitativa (ou semiquantitativa); o Rf não quantifica.',
    'Errada. Compostos diferentes podem ter o mesmo Rf; a CCD sozinha não é definitiva.'
  ],
  fonte: 'Material "Cap. 3 – Técnicas clássicas" (CCD) e "Guia de estudos de estabilidade".'
},
{
  id: 'CQ26-P2-03', origem: '2026 – 2ª VA (Q3)', assunto: 'Cálculos de controle de qualidade',
  enun: `Comprimidos com 500 mg de ácido ascórbico foram analisados por titulação de oxirredução com I₂ 0,0500 mol/L. Um comprimido foi dissolvido em 100,0 mL, e uma alíquota de 10,0 mL foi titulada, gastando 5,68 mL de I₂. Reação 1:1: C₆H₈O₆ + I₂ → C₆H₆O₆ + 2I⁻ + 2H⁺ (MM = 176 g/mol). Especificação: 95% a 105% do declarado.`,
  alts: [
    '~50 mg; 10% do declarado; reprovado.',
    '~250 mg; 50% do declarado; reprovado.',
    '~500 mg; ~100% do declarado; aprovado.',
    '~568 mg; 113,6% do declarado; reprovado.',
    'Não é possível determinar, pois a titulação com iodo é qualitativa.'
  ],
  c: 'C',
  e: [
    'Errada. Esse é o valor só da alíquota (10 mL): faltou multiplicar pelo fator de diluição (100/10 = 10).',
    'Errada. Valor sem base no cálculo.',
    'Correta. n(I₂) = 5,68 mL × 0,0500 mmol/mL = 0,284 mmol; como a reação é 1:1, há 0,284 mmol de ácido ascórbico na alíquota. × 10 (100 mL/10 mL) = 2,84 mmol × 176 mg/mmol = 499,8 mg, ou seja, ≈ 100%: aprovado.',
    'Errada. Usou o volume gasto como se fosse massa.',
    'Errada. A iodimetria é volumetria quantitativa (doseamento).'
  ],
  obs: 'Roteiro de cálculo: mol do titulante → estequiometria → fator de diluição → massa → % do declarado.',
  fonte: 'Cap. 3 – Técnicas clássicas, p. 54 (iodimetria: FB preconiza para ácido ascórbico em MP e comprimidos).'
},
{
  id: 'CQ26-P2-04', origem: '2026 – 2ª VA (Q4)', assunto: 'Cromatografia (CCD, CLAE e CG)', adaptada: true,
  enun: `O laboratório precisa escolher a técnica cromatográfica para identificar e quantificar o princípio ativo e um produto de degradação B com as propriedades: massa molecular 180 g/mol; estável até 250 °C; solubilidade aquosa moderada; estável em solução; temperatura de ebulição 165 °C.

Para o produto de degradação B, qual técnica é a mais adequada?`,
  alts: [
    'CLAE, porque a CG só analisa compostos com massa molecular acima de 500 g/mol.',
    'CG, porque B é volátil (ebulição a 165 °C), termicamente estável até 250 °C (não se decompõe na vaporização) e tem baixa massa molecular.',
    'CG, porque B é solúvel em água, e a CG exige amostras aquosas.',
    'CLAE, porque compostos termicamente estáveis não podem ser analisados por CG.',
    'Nenhuma das duas, pois produtos de degradação só podem ser analisados por titulação.'
  ],
  c: 'B',
  e: [
    'Errada. É o contrário: a CG favorece moléculas pequenas e voláteis.',
    'Correta. Os três argumentos exigidos: volatilidade (PE baixo), estabilidade térmica na faixa de operação e baixa massa molecular. Esses são os requisitos da CG.',
    'Errada. A solubilidade em água não é critério da CG.',
    'Errada. A estabilidade térmica é justamente o requisito para a CG.',
    'Errada. Técnicas cromatográficas são as indicadas para separar e quantificar produtos de degradação.'
  ],
  obs: 'Na prova original esta questão era discursiva (3 argumentos). Regra rápida: volátil e termoestável → CG; não volátil, termolábil ou polar de alta massa → CLAE.',
  fonte: 'Material de cromatografia — critérios de escolha CG × CLAE.'
},
{
  id: 'CQ26-P2-05', origem: '2026 – 2ª VA (Q5)', assunto: 'Estabilidade e degradação',
  enun: `Uma indústria preparou uma tintura de Matricaria chamomilla. O produto apresentou coloração mais intensa e odor diferente dos lotes anteriores. A investigação considera alterações na composição química, na concentração do solvente extrator ou na qualidade da matéria-prima vegetal.

Qual conjunto de ensaios fornece informações mais relevantes para investigar a causa?`,
  alts: [
    'Peso médio, friabilidade, dureza e desintegração.',
    'Características organolépticas, densidade, teor alcoólico, perfil cromatográfico e determinação de marcadores.',
    'Friabilidade, dureza, dissolução e uniformidade de massa.',
    'Apenas pH, densidade e análise visual.',
    'Peso médio, volume de sedimentação, desintegração e dissolução.'
  ],
  c: 'B',
  e: [
    'Errada. São ensaios de comprimidos, não de uma forma líquida.',
    'Correta. Para uma tintura: os organolépticos confirmam o desvio, densidade e teor alcoólico avaliam o solvente extrator, e o perfil cromatográfico e os marcadores avaliam a composição química e a matéria-prima vegetal.',
    'Errada. São ensaios de formas sólidas.',
    'Errada. São insuficientes e não avaliam composição nem teor alcoólico.',
    'Errada. Mistura ensaios de suspensão e de sólidos sem relação com tintura.'
  ],
  fonte: 'Material "Cap. Ensaios Físicos Líquidos e Semissólidos"; controle de fitoterápicos.'
},
{
  id: 'CQ26-P2-06', origem: '2026 – 2ª VA (Q6)', assunto: 'Cálculos de controle de qualidade', adaptada: true,
  enun: `Comprimidos com 300 mg de fármaco foram doseados por espectrofotometria. Curva analítica: A = 0,025C + 0,010 (C em µg/mL). Um comprimido foi dissolvido em 250,0 mL (solução inicial); 1,0 mL dessa solução foi diluído a 100,0 mL. A solução final teve absorbância de 0,315. Especificação: 95% a 105% do declarado.`,
  alts: [
    'C = 12,6 µg/mL; 3,15 mg por comprimido; reprovado.',
    'C = 12,2 µg/mL na solução analisada; × 100 = 1.220 µg/mL na solução inicial; × 250 mL = 305 mg, ou seja, 101,7% do declarado: aprovado.',
    'C = 12,2 µg/mL; 122 mg por comprimido (40,7%); reprovado.',
    'C = 7,6 µg/mL; 190 mg por comprimido; reprovado.',
    'C = 12,2 µg/mL; 3.050 mg por comprimido (1.016%); reprovado.'
  ],
  c: 'B',
  e: [
    'Errada. Não subtraiu o intercepto (0,315 ÷ 0,025 = 12,6) e não aplicou as diluições.',
    'Correta. C = (0,315 − 0,010) ÷ 0,025 = 12,2 µg/mL. Diluição 1 → 100: 1.220 µg/mL. Massa = 1.220 µg/mL × 250 mL = 305.000 µg = 305 mg. 305 ÷ 300 = 101,7%: conforme.',
    'Errada. Aplicou só um dos fatores (faltou o volume de 250 mL ou a diluição).',
    'Errada. Conta sem base na equação.',
    'Errada. Erro de unidade (µg → mg) ou fator de diluição aplicado duas vezes.'
  ],
  obs: 'Na prova original esta questão era discursiva. Treine o roteiro: (1) isolar C na equação da reta; (2) multiplicar pelo fator de diluição; (3) multiplicar pelo volume inicial; (4) converter µg → mg; (5) calcular o % do declarado.',
  fonte: 'Cap. 5 (Espectroscopia), p. 84–87; lista "Questões titulação e espectrofotometria" (curva A = 0,025C + 0,010).'
},
{
  id: 'CQ26-P2-07', origem: '2026 – 2ª VA (Q7)', assunto: 'Espectrofotometria UV-Vis',
  enun: `Uma indústria está validando métodos para comprimidos contendo um princípio ativo, além de possíveis impurezas e excipientes, e considera titulação, espectrofotometria UV-Vis e CLAE.

Assinale a associação correta entre o método e seu fundamento.`,
  alts: [
    'A titulação baseia-se na reação seletiva com o fármaco, e a espectrofotometria mede a velocidade com que a luz atravessa a amostra.',
    'A espectrofotometria UV-Vis quantifica pela relação entre absorbância e concentração, mas outras substâncias que absorvem na mesma região podem comprometer a seletividade.',
    'A CLAE quantifica pelo tempo de retenção, que é proporcional à concentração.',
    'Titulação e cromatografia têm o mesmo princípio, pois dependem de um complexo colorido.',
    'UV-Vis e CLAE são equivalentes em seletividade, pois ambas separam fisicamente o ativo dos excipientes.'
  ],
  c: 'B',
  e: [
    'Errada. A espectrofotometria mede a ABSORÇÃO de luz (Lambert-Beer), não a velocidade.',
    'Correta. Lambert-Beer (A = ε·b·c), com a limitação de seletividade: interferentes que absorvem no mesmo comprimento de onda.',
    'Errada. O tempo de retenção IDENTIFICA; a quantificação é pela ÁREA (ou altura) do pico.',
    'Errada. Os princípios são diferentes (estequiometria × separação por partição/adsorção).',
    'Errada. Só a CLAE separa; o UV mede a mistura toda, por isso é menos seletivo.'
  ],
  fonte: 'Material "Espectroscopia" e cromatografia.'
}
]);

{

    'O objetivo é definir o prazo de validade final; a condição mais prejudicial foi a luz UVA.',
    'O objetivo é identificar as vias e os produtos de degradação e demonstrar que o método é indicativo de estabilidade; a condição mais prejudicial foi a oxidação (H₂O₂ 3%: 18,17%), e uma medida seria adicionar antioxidantes ou substituir o ar por nitrogênio na embalagem.',
    'O objetivo é verificar a dissolução; a condição mais prejudicial foi a hidrólise básica a 55 °C.',
    'O objetivo é avaliar a esterilidade; a condição mais prejudicial foi a hidrólise ácida a 25 °C.',
    'A condição mais prejudicial foi a hidrólise ácida a 55 °C (77,54%), e a medida é usar embalagem âmbar.'
  ],
  c: 'B',
  e: [
    'Errada. A validade se define nos estudos de longa duração; e a luz UVA praticamente não degradou (102,8%).',
    'Correta. A degradação forçada revela as vias de degradação e valida a seletividade do método. A oxidação foi a mais agressiva (menor recuperação), daí o antioxidante ou a atmosfera inerte (N₂).',
    'Errada. Não avalia dissolução, e o meio básico quase não degradou.',
    'Errada. Não é ensaio de esterilidade, e o HCl a 25 °C não degradou.',
    'Errada. A hidrólise ácida a quente degradou, mas menos que o H₂O₂ 3%; e embalagem âmbar protege da luz, não da oxidação.'
  ],
  obs: 'Na prova original esta questão era discursiva. A professora anotou na prova: "trocar o ar atmosférico por N₂".',
  fonte: 'Guia ANVISA nº 28/2019, p. 13 e 22–23 (degradação forçada desafia o método; método indicativo de estabilidade).'
},
{
  id: 'CQ25-A-03', origem: '2025 – 2ª VA (Q3)', assunto: 'Ensaios físicos de formas farmacêuticas', adaptada: true,
  enun: `Um estudo comparou perfis de dissolução de comprimidos de hidroclorotiazida de referência (R1, R2), genéricos (G1, G2) e similares (S1, S2), dois lotes de cada, a 50 rpm. Em 40 min, R e G liberaram ~90–100%, enquanto S2 liberou ~75% e S1 ~68%.

Assinale a alternativa correta.`,
  alts: [
    'A dissolução é irrelevante para comprimidos, pois o fármaco é absorvido mesmo sem se dissolver.',
    'A dissolução é pré-requisito para a absorção e prediz o desempenho in vivo e a uniformidade entre lotes; as diferenças entre produtos com mesma dose, ativo e forma podem vir da formulação (excipientes), do processo (força de compressão, granulação) e das características do IFA (tamanho de partícula, polimorfismo).',
    'As diferenças só podem ser explicadas por erro do analista, pois produtos com o mesmo ativo têm o mesmo perfil.',
    'O ensaio de dissolução avalia a dureza dos comprimidos.',
    'Como todos têm a mesma dose, os similares são automaticamente bioequivalentes.'
  ],
  c: 'B',
  e: [
    'Errada. Só o fármaco dissolvido é absorvido.',
    'Correta. Traz a importância da dissolução (item a) e as causas da variação (item b). A professora destacou "IFA" na correção.',
    'Errada. Formulação e processo alteram o perfil de dissolução.',
    'Errada. Dureza é outro ensaio físico.',
    'Errada. A equivalência precisa ser demonstrada; o perfil de S1 e S2 sugere que não são equivalentes.'
  ],
  obs: 'Na prova original esta questão era discursiva (itens a e b).',
  fonte: 'Material "Cap. Ensaios Físicos Sólidos" — dissolução; equivalência farmacêutica.'
},
{
  id: 'CQ25-A-04', origem: '2025 – 2ª VA (Q4)', assunto: 'Estabilidade e degradação',
  enun: `A Anvisa determinou a interdição cautelar do lote 2518163 do Vancotrat 500 mg (pó para solução injetável), com validade até 04/2027, por suspeita de desvio de qualidade: após a diluição, a solução ficou alaranjada, diferente do descrito na bula (solução límpida, isenta de partículas visíveis ao adicionar 10 mL de água).

Assinale a correta.`,
  alts: [
    'A alteração de cor indica falha nos ensaios de dureza e friabilidade, que devem ser repetidos.',
    'O desvio de cor caracteriza possível instabilidade do produto, podendo estar relacionado à degradação do princípio ativo; deve ser investigado por ensaios de estabilidade e análise cromatográfica comparada ao padrão de referência.',
    'A diferença de coloração indica erro no volume médio envasado, comprovável por dissolução e pH.',
    'A validação analítica substitui os estudos de estabilidade, dispensando ensaios periódicos.',
    'O desvio restringe-se à aparência, sem necessidade de confirmação analítica, pois a cor não se relaciona com a eficácia.'
  ],
  c: 'B',
  e: [
    'Errada. Dureza e friabilidade são ensaios de comprimidos, não de pó injetável.',
    'Correta. A mudança de cor é sinal de possível degradação química, a ser investigada com CLAE (teor e impurezas) frente ao padrão e com estudos de estabilidade.',
    'Errada. A cor não tem relação com o volume envasado (e, no pó, o ensaio seria de peso médio).',
    'Errada. Validação de método e estudo de estabilidade são coisas diferentes e complementares.',
    'Errada. Alteração de cor pode indicar perda de teor ou produtos de degradação tóxicos.'
  ],
  fonte: 'Guia ANVISA nº 28/2019, p. 5 (degradação pode gerar compostos tóxicos) e p. 22 (coloração é parte essencial do aspecto de injetáveis).'
},
{
  id: 'CQ25-A-05', origem: '2025 – 2ª VA (Q5)', assunto: 'Validação de métodos analíticos', adaptada: true,
  enun: `Alunos não encontraram monografia de rosuvastatina na Farmacopeia Brasileira 7ª ed. e pretendem usar um método espectrofotométrico da literatura. Antes, construíram uma curva de calibração (absorbância × concentração) com o padrão de rosuvastatina.

A qual parâmetro de validação corresponde a curva, e qual sua finalidade?`,
  alts: [
    'Precisão: avaliar a concordância entre medidas repetidas.',
    'Linearidade: demonstrar que as respostas são diretamente proporcionais à concentração do analito dentro de um intervalo definido (avaliada pela equação da reta e pelo coeficiente de correlação).',
    'Robustez: avaliar a resistência do método a pequenas variações.',
    'Exatidão: comparar o resultado com o valor verdadeiro por recuperação.',
    'Seletividade: demonstrar ausência de interferência dos excipientes.'
  ],
  c: 'B',
  e: [
    'Errada. A precisão (repetibilidade, intermediária) é OUTRO parâmetro; a professora marcou isso na correção.',
    'Correta. A curva de calibração avalia linearidade e intervalo (r ≥ 0,99 e análise de resíduos).',
    'Errada. A robustez varia condições como pH, comprimento de onda e temperatura.',
    'Errada. A exatidão usa ensaios de recuperação.',
    'Errada. A seletividade compara amostra, placebo e padrão.'
  ],
  obs: 'Na prova original esta questão era discursiva (0,75). A curva de calibração avalia a LINEARIDADE; repetibilidade/precisão é outro parâmetro e não deve ser citada como finalidade da curva.',
  fonte: 'RDC 166/2017 (validação de métodos analíticos).'
},
{
  id: 'CQ25-A-06', origem: '2025 – 2ª VA (Q6)', assunto: 'Validação de métodos analíticos',
  enun: `Uma empresa desenvolve um medicamento similar na forma de suspensão oral, a partir de um fármaco de referência já comercializado. Considerando os princípios de desenvolvimento farmacotécnico e de controle de qualidade, assinale a correta.`,
  alts: [
    'A validação do método é dispensável se o método já está em farmacopeia, bastando o teste de robustez.',
    'A suspensão deve passar por pH, desintegração, dissolução, teor e volume médio; além disso, espera-se início de efeito mais rápido com uma cápsula do que com a suspensão do mesmo ativo e dose.',
    'Na estabilidade acelerada, o principal objetivo é estimar o comportamento em condições normais de armazenamento ao longo do tempo.',
    'O tamanho médio das partículas não interfere na estabilidade física da suspensão e não tem relação com os cuidados de uso.',
    'No desenvolvimento do método de teor de um similar, os resultados da validação devem estar de acordo com os critérios de aceitação previamente descritos no protocolo de validação.'
  ],
  c: 'E',
  e: [
    'Errada. Métodos farmacopeicos exigem verificação ou validação parcial (seletividade, precisão etc.), não só robustez.',
    'Errada. Dois erros: suspensão não passa por DESINTEGRAÇÃO (ensaio de formas sólidas), embora a dissolução seja aplicável a suspensões; e a suspensão, já dispersa, tende a ter início de ação mais rápido que a cápsula, e não o contrário.',
    'Errada. Quem avalia o comportamento em condições normais é a estabilidade de LONGA DURAÇÃO; a acelerada usa condições forçadas (ex.: 40 °C/75% UR) para PREVER.',
    'Errada. O tamanho de partícula afeta a sedimentação (Lei de Stokes) e se relaciona com o "agite antes de usar".',
    'Correta. A validação segue um protocolo com critérios de aceitação definidos antes da execução.'
  ],
  fonte: 'RDC 166/2017; RDC 318/2019 (estabilidade); "Cap. Ensaios Físicos Líquidos e Semissólidos".'
},
{
  id: 'CQ25-B-01', origem: '2025 – 1ª VA (Q1)', assunto: 'Espectrofotometria UV-Vis',
  enun: `Um farmacêutico determina o teor de vitamina C (ácido ascórbico) em comprimidos por espectrofotometria UV-Vis a 265 nm. Sabendo que a análise obedece à Lei de Lambert-Beer, qual afirmação está correta?`,
  alts: [
    'A absorbância é diretamente proporcional ao caminho óptico, mas independe da concentração.',
    'A transmitância cresce linearmente com a concentração.',
    'Em concentrações adequadas, a absorbância é linearmente proporcional à concentração do analito.',
    'Quanto maior a concentração, maior a transmitância.',
    'A Lei de Lambert-Beer não se aplica a amostras de medicamentos, apenas a padrões.'
  ],
  c: 'C',
  e: [
    'Errada. A = ε·b·c depende da concentração e do caminho óptico.',
    'Errada. A transmitância cai exponencialmente com a concentração (A = −log T).',
    'Correta. A = ε·b·c: linearidade em soluções diluídas e límpidas.',
    'Errada. Mais concentração significa mais absorção e MENOS transmitância.',
    'Errada. Aplica-se a amostras, desde que não haja interferentes e a faixa seja linear.'
  ],
  fonte: 'Cap. 5 (Espectroscopia), p. 83–87 (UV-Vis usado em análise quantitativa; Lambert-Beer).'
},
{
  id: 'CQ25-B-02', origem: '2025 – 1ª VA (Q2)', assunto: 'Cálculos de controle de qualidade',
  enun: `Pantoprazol sódico (MP1) de um novo fornecedor: água por Karl Fischer = 4,0%. Doseamento: ~350 mg em 50 mL de etanol 96%, 1 gota de azul de bromofenol 0,1% SI, titulado com HCl 0,1 M SV (fator 0,98). Massa = 350,1 mg; volume de HCl = 8,0 mL. Cada mL de HCl 0,1 M equivale a 40,535 mg de pantoprazol sódico. Especificação: 98,0% a 102,0% em relação à substância anidra.

I. A determinação prévia de água não era relevante para o doseamento.
II. O Karl Fischer é um método volumétrico de pureza, que quantifica a impureza (água) por titulação.
III. O doseamento empregou um método clássico de quantificação.
IV. Ao dessecar a amostra e analisá-la, o resultado está de acordo com a especificação.
V. O titulante foi o pantoprazol sódico, o titulado o HCl 0,1 M e o indicador o azul de bromotimol.`,
  alts: ['Apenas III e V.', 'Apenas II e III.', 'Apenas I, II e IV.', 'Apenas II, III e IV.', 'Apenas II, IV e V.'],
  c: 'B',
  e: [
    'Errada. V é falsa (titulante e titulado invertidos, e o indicador é o azul de bromoFENOL).',
    'Correta. II (V) e III (V). I (F): a água é necessária para calcular o teor na base anidra. IV (F): 8,0 × 0,98 × 40,535 = 317,8 mg; base anidra = 350,1 × 0,96 = 336,1 mg; teor = 94,6%, fora de 98–102%. V (F).',
    'Errada. I e IV são falsas.',
    'Errada. IV é falsa (94,6%).',
    'Errada. IV e V são falsas.'
  ],
  obs: 'O cálculo na base anidra é o ponto mais cobrado: teor (%) = (V × f × equivalente) ÷ (massa × (1 − %água)) × 100.',
  fonte: 'Cap. 3 – Técnicas clássicas, p. 45 (Karl Fischer volumétrico) e p. 49 (acidimetria/alcalimetria).'
},
{
  id: 'CQ25-B-03', origem: '2025 – 1ª VA (Q3)', assunto: 'Atribuições do CQ e RDC 658/2022',
  enun: `Em uma inspeção, a gestão sênior de uma indústria é questionada sobre organograma, responsabilidades e independência das funções-chave. Considerando a RDC nº 658/22, assinale a correta:`,
  alts: [
    'Embora o CQ avalie a conformidade de matérias-primas, embalagens e produtos acabados, não é sua responsabilidade participar da investigação de desvios.',

    'Definir estratégias de marketing e aprovar materiais promocionais para profissionais de saúde.',
    'A independência entre o Responsável pela Produção e o Responsável pelo CQ é exigida para garantir imparcialidade, com funções registradas em descrições de cargo.',
    'Elaborar ordens de produção e acompanhar a compressão e o revestimento de comprimidos.'
  ],
  c: 'D',
  e: [
    'Errada. O CQ participa da investigação de desvios e reclamações.',
    'Errada. Essa é atribuição da Produção ou da Engenharia, não do CQ.',
    'Errada. Não é função do CQ.',
    'Correta. A RDC 658 exige que os responsáveis pela Produção e pelo CQ sejam independentes entre si, com responsabilidades em descrições de cargo.',
    'Errada. Essas são atividades da Produção.'
  ],
  fonte: 'RDC 658/2022, Arts. 30, 33, 35 e 236 V (independência Produção × CQ; CQ participa da investigação de reclamações).'
},
{
  id: 'CQ25-B-04', origem: '2025 – 1ª VA (Q4)', assunto: 'Gestão da qualidade e ferramentas',
  enun: `Associe as ferramentas (Coluna A) aos exemplos (Coluna B):

Coluna A: a. Diagrama de Pareto; b. Diagrama de Causa e Efeito (Ishikawa); c. Fluxograma; d. Histograma.
Coluna B:
1. Análise da distribuição de tamanhos de comprimidos em um lote, identificando a frequência de cada faixa.
2. Identificação das etapas do processo produtivo, mostrando a sequência das atividades.
3. Determinação das principais causas de desvios de pH em soluções orais.
4. Identificação dos problemas que respondem pela maior parte das reclamações sobre um xarope.`,
  alts: ['a-4, b-3, c-2, d-1', 'a-2, b-3, c-4, d-1', 'a-3, b-2, c-1, d-4', 'a-4, b-2, c-3, d-1', 'a-1, b-4, c-2, d-3'],
  c: 'A',
  e: [
    'Correta. Pareto prioriza os problemas mais frequentes (4); Ishikawa levanta causas (3); fluxograma mostra a sequência (2); histograma mostra a distribuição de frequências (1).',
    'Errada. O Pareto não mostra etapas do processo.',
    'Errada. O Pareto não levanta causas; o fluxograma não mostra distribuição.',
    'Errada. O Ishikawa não descreve sequência de etapas.',
    'Errada. O Pareto não é distribuição de tamanhos (isso é histograma).'
  ],
  fonte: 'Artigo "Ferramentas da qualidade".'
},
{
  id: 'CQ25-B-05', origem: '2025 – 1ª VA (Q5)', assunto: 'Espectrofotometria UV-Vis',
  enun: `"Foram pesados e triturados 20 comprimidos de paracetamol 500 mg. Transferiu-se 0,15 g do pó para balão de 200 mL, adicionaram-se 50 mL de NaOH 0,1 M e 100 mL de água, com agitação por 15 minutos, completando-se com água. Parte da solução (10 mL) foi filtrada e diluída a 100 mL. A absorbância foi lida a 257 nm. Um padrão foi preparado na mesma concentração final, com os mesmos reagentes. Tudo em triplicata."

É correto afirmar:`,
  alts: [
    'A massa transferida (0,15 g) contém somente paracetamol, por isso não deveria ter sido filtrada.',
    'A filtração é necessária para remover partículas suspensas que poderiam desviar a luz incidente.',
    'Como não está explícito, não há necessidade de "branco", pois a amostra era originalmente líquida.',
    'A análise foi na região do visível, por isso deve-se usar cubeta de quartzo.',
    'A análise da amostra seria suficiente, sendo dispensável o padrão em paralelo.'
  ],
  c: 'B',
  e: [
    'Errada. O pó do comprimido contém excipientes (alguns insolúveis).',
    'Correta. Partículas causam espalhamento de luz, que aparece como falsa absorbância.',
    'Errada. O branco (solvente/reagentes) é sempre necessário para zerar o aparelho, e a amostra era sólida.',
    'Errada. 257 nm é UV (200–400 nm), e é justamente por isso que a cubeta é de quartzo. No visível (400–800 nm) podem ser usadas cubetas de sílica ou poliestireno.',
    'Errada. O padrão é necessário para calcular a concentração por comparação.'
  ],
  fonte: 'Cap. 5 (Espectroscopia), p. 84 (branco), p. 85 (cubetas: quartzo no UV) e p. 86 (MS, RMN e IV para elucidação).'
},
{
  id: 'CQ25-B-06', origem: '2025 – 1ª VA (Q6)', assunto: 'Cálculos de controle de qualidade', adaptada: true,
  enun: `No controle de dopagem, a urina de um atleta é analisada para furosemida por UV-Vis com curva externa: A = 0,0025·C + 0,015 (C em ng/mL no extrato analisado). A urina foi diluída 1:5 (1 parte de urina + 4 de diluente). Absorbância média (n = 3) = 0,515. O atleta está apto se a concentração na urina original for ≤ 200 ng/mL.`,
  alts: [
    'C = 200 ng/mL na urina original; atleta apto.',
    'C = 206 ng/mL; atleta inapto por pouco.',
    'C = 200 ng/mL no extrato; × 5 = 1.000 ng/mL na urina original; atleta NÃO apto.',
    'C = 40 ng/mL na urina original; atleta apto.',
    'C = 800 ng/mL na urina original; atleta NÃO apto.'
  ],
  c: 'C',
  e: [
    'Errada. Esqueceu o fator de diluição: 200 ng/mL é a concentração no extrato diluído.',
    'Errada. Não subtraiu o intercepto (0,515 ÷ 0,0025 = 206) e não aplicou a diluição.',
    'Correta. C = (0,515 − 0,015) ÷ 0,0025 = 200 ng/mL no extrato; diluição 1:5 → 200 × 5 = 1.000 ng/mL > 200, logo não apto.',
    'Errada. Dividiu pelo fator em vez de multiplicar.',
    'Errada. Usou fator 4 (1 + 4 = 5 partes, então o fator é 5).'
  ],
  obs: 'Na prova original esta questão era de cálculo discursivo.',
  fonte: 'Cap. 5 (Espectroscopia), p. 84–87; lista "Questões titulação e espectrofotometria" (curva A = 0,025C + 0,010).'
},
{
  id: 'CQ25-B-07', origem: '2025 – 1ª VA (Q7)', assunto: 'CQ de matérias-primas: identificação e pureza', adaptada: true,
  enun: `Ensaios em uma amostra de alanina:

<table><tr><th>Parâmetro</th><th>Referência</th><th>Resultado</th></tr><tr><td>Rotação óptica</td><td>+13,7 a +15,1</td><td>+14,3</td></tr><tr><td>Solubilidade</td><td>Facilmente solúvel em água, muito pouco solúvel em etanol</td><td>Cumpre</td></tr><tr><td>Cloretos</td><td>No máximo 0,05%</td><td>A solução PADRÃO ficou mais turva que a amostra</td></tr><tr><td>Resíduo por incineração</td><td>No máximo 0,1%</td><td>1 g de amostra deixou 0,05 g de resíduo</td></tr></table>
Assinale a análise correta.`,
  alts: [
    'Todos os ensaios estão conformes; a matéria-prima está aprovada.',
    'Rotação óptica, solubilidade e cloretos estão conformes; o resíduo por incineração é 5% (≫ 0,1%), indicando excesso de impurezas inorgânicas; a matéria-prima deve ser reprovada.',
    'Os cloretos estão reprovados, pois a amostra ficou turva.',
    'A rotação óptica está fora, pois +14,3 é diferente do valor médio.',
    'O resíduo por incineração é 0,05%, portanto conforme.'
  ],
  c: 'B',
  e: [
    'Errada. O resíduo por incineração está muito acima do limite.',
    'Correta. Resíduo = 0,05 g ÷ 1 g × 100 = 5% (50 vezes o limite), o que indica sais, metais ou contaminantes inorgânicos. Os demais ensaios estão dentro da referência (cloretos: amostra MENOS turva que o padrão = abaixo do limite).',
    'Errada. A amostra menos turva que o padrão significa cloretos abaixo de 0,05%: conforme.',
    'Errada. +14,3 está dentro da faixa +13,7 a +15,1.',
    'Errada. A conta está errada: 0,05 g em 1 g = 5%, não 0,05%.'
  ],
  obs: 'Na prova original esta questão era discursiva.',
  fonte: 'CQ MPs, p. 246 (rotação óptica), p. 249 (resíduo por ignição = impurezas inorgânicas); Cap. 3, p. 45 (cloretos: amostra não pode ser mais turva que o padrão).'
},
{
  id: 'CQ25-B-08', origem: '2025 – 1ª VA (Q8)', assunto: 'Cromatografia (CCD, CLAE e CG)',
  enun: `A enzima β-D-frutofuranosidase (FFH) hidrolisa a sacarose em D-glicose e D-frutose. Uma CCD avaliou a hidrólise: L1 = reação com enzima de bactéria; L2 = reação com enzima de fungo; L3 = padrão de glicose; L4 = padrão de frutose. Fase estacionária: sílica; fase móvel: acetona:éter etílico (7:3). (Na placa, L1 e L2 mostram manchas na altura da glicose (mais alta) e da frutose (intermediária), além de sacarose perto da origem.)

É correto afirmar que:`,
  alts: [
    'A análise não permite identificar glicose e frutose, sendo necessárias outras técnicas.',
    'Apenas em L1 é possível confirmar glicose e frutose, ou seja, o fungo não metabolizou a sacarose.',
    'A CCD permitiu a determinação qualitativa de glicose e frutose em L1 e L2, sendo a frutose mais polar que a glicose.',
    'A CCD é uma técnica de separação que não permite identificar nem quantificar, apenas purificar.',
    'Pelo tempo de retenção é possível classificar as substâncias: a que demorou mais para se deslocar é a mais apolar.'
  ],
  c: 'C',
  e: [
    'Errada. A comparação com os padrões (mesmo Rf) permite a identificação qualitativa.',
    'Errada. L2 também apresenta as duas manchas.',
    'Correta. As manchas de L1 e L2 coincidem com os padrões. Em sílica (polar), quem migra menos (Rf menor) é mais polar: a frutose ficou abaixo da glicose.',
    'Errada. A CCD identifica (por comparação de Rf) e pode ser semiquantitativa.',
    'Errada. Na CCD se usa Rf, não "tempo de retenção"; e quem se desloca menos em sílica é o mais POLAR.'
  ],
  fonte: 'Cap. 3 – Técnicas clássicas, p. 43 (CCD: sílica, Rf = dr/dm, comparação com padrão).'
},
{
  id: 'CQ25-B-09', origem: '2025 – 1ª VA (Q9)', assunto: 'Espectrofotometria UV-Vis',
  enun: `Sertürner isolou a morfina da papoula. Mais de 150 anos depois, a Purdue Pharma lançou o Oxycontin (oxicodona), inspirado na morfina, com papel central na epidemia de opioides nos EUA. (Estruturas: a morfina tem OH fenólico, OH alcoólico e dupla ligação; a oxicodona tem metoxila no lugar do fenol, uma cetona e OH terciário.)

Considerando a análise físico-química dessas moléculas, é possível afirmar que:`,
  alts: [
    'Apresentam exatamente os mesmos grupos funcionais, sendo inviável distingui-las por técnicas clássicas.',

    'Medidas de pH e ponto de fusão não são apropriadas para identificação de compostos orgânicos.',
    'As propriedades organolépticas provavelmente não seriam suficientes para diferenciá-las, mas técnicas espectroscópicas, como espectrometria de massas e RMN, as elucidariam.',

  ],
  c: 'D',
  e: [
    'Errada. Os grupos são diferentes (fenol × metoxila; cetona na oxicodona).',
    'Errada. Titulação é técnica de QUANTIFICAÇÃO (doseamento), não de identificação.',
    'Errada. O ponto de fusão é uma constante física clássica de identificação.',
    'Correta. Ambas são pós brancos semelhantes; EM (massa molar e fragmentação) e RMN (estrutura) as diferenciam com certeza.',
    'Errada. É preciso preparar soluções, e a absorbância é DIRETAMENTE proporcional à concentração.'
  ],
  fonte: 'Cap. 5, p. 86–87 (UV não elucida estrutura; MS, RMN e IV sim); CQ MPs, p. 244 (organolépticas não têm fins analíticos).'

{
  id: 'CF-IN-01', origem: 'Inédita', assunto: 'Conciliação de medicamentos',
  enun: `Dona Maria, 78 anos, recebe alta após internação por pneumonia. Em casa, usava anlodipino, sinvastatina e omeprazol. Na prescrição de alta constam anlodipino, sinvastatina, omeprazol e amoxicilina + clavulanato por mais 3 dias, mas o enalapril, que ela relata usar há anos, não aparece nem na prescrição de internação nem na de alta, sem justificativa no prontuário.

  alts: [
    'Orientar a paciente a voltar a tomar o enalapril em casa, pois é medicamento de uso contínuo.',
    'Ignorar a discrepância, pois a prescrição de alta é responsabilidade exclusiva do médico.',
    'Confirmar o uso do enalapril com outras fontes (receitas, embalagens, familiar, UBS), contatar o prescritor para esclarecer se a omissão foi intencional, documentar a decisão e orientar a paciente sobre o esquema final.',

{
  id: 'CF-IN-02', origem: 'Inédita', assunto: 'Acompanhamento farmacoterapêutico',
  enun: `No método clínico, os problemas relacionados à farmacoterapia (PRF) são classificados segundo quatro necessidades do paciente. Associe:

( ) Paciente usa omeprazol há 3 anos sem indicação clínica atual.
( ) Hipertenso em uso correto de losartana 50 mg mantém PA de 160/100 mmHg.
( ) Paciente em uso de AINE apresenta epigastralgia e melena.
( ) Paciente não toma a metformina porque "dá diarreia" e não contou ao médico.`,

  c: 'A',
  e: [
    'Correta. Medicamento sem indicação = necessidade; dose ou medicamento insuficiente para atingir a meta = efetividade; reação adversa (sangramento digestivo) = segurança; não tomar por decisão própria = adesão.',
    'Errada. Os dois primeiros estão trocados.',
    'Errada. Ineficácia é efetividade (2), e a reação adversa é segurança (3).',

    'Errada. Os dois últimos estão trocados: a epigastralgia é de segurança e a interrupção é de adesão.'

  fonte: 'Slide de Cuidado Farmacêutico 93 (7 PRM de Strand, 2004) e 21 (necessidade, segurança, efetividade).'

{
  id: 'CF-IN-03', origem: 'Inédita', assunto: 'Resoluções CFF 585 e 586/2013',
  enun: `I. A Resolução CFF nº 586/2013 permite que o farmacêutico prescreva medicamentos cuja dispensação exige prescrição médica, desde que exista diagnóstico prévio e que esteja previsto em programas, protocolos, diretrizes ou normas técnicas aprovados para uso no âmbito de instituições de saúde.

{
  id: 'CF-IN-04', origem: 'Inédita', assunto: 'Dispensação e Farmácia Especializada',
  enun: `Um paciente transplantado retira tacrolimo na Farmácia Especializada do SUS. Durante a dispensação, relata que passou a tomar chá de erva-de-são-joão "para a ansiedade". O farmacêutico sabe que essa planta induz o CYP3A4.

{
  id: 'CF-IN-05', origem: 'Inédita', assunto: 'Terminologia e conceitos',
  enun: `Sobre os serviços farmacêuticos clínicos, associe corretamente:

{
  id: 'CF-IN-07', origem: 'Inédita', assunto: 'Educação em saúde e prática baseada em evidências',
  enun: `Um farmacêutico precisa decidir se recomenda um suplemento a uma paciente e encontra: (1) um vídeo de um médico famoso; (2) um estudo observacional com 50 pacientes; (3) uma revisão sistemática com metanálise de ensaios clínicos randomizados; (4) a opinião de um colega.

  id: 'CF-IN-08', origem: 'Inédita', assunto: 'Legislação sanitária (Leis 5.991/73 e 13.021/14)',

addQ('cq', 'ineditas', 'Inédita', [
{
  id: 'CQ-IN-01', origem: 'Inédita', assunto: 'Cálculos de controle de qualidade',
  enun: `Comprimidos com 250 mg de fármaco (peso médio 400 mg). Pesou-se pó equivalente a um peso médio, dissolvido em balão de 100,0 mL. 2,0 mL foram diluídos a 50,0 mL e a absorbância foi comparada a um padrão de 100 µg/mL (A padrão = 0,500). A absorbância da amostra foi 0,490.

Qual o teor e a conclusão (especificação 90–110%)?`,
  alts: [
    '98 µg/mL; 245 mg; 98%; aprovado.',
    '98 µg/mL; 196 mg; 78,4%; reprovado.',
    '100 µg/mL; 250 mg; 100%; aprovado.',
    '98 µg/mL; 9,8 mg; 3,9%; reprovado.',
    '102 µg/mL; 255 mg; 102%; aprovado.'
  ],
  c: 'A',
  e: [
    'Correta. C amostra = (0,490 ÷ 0,500) × 100 = 98 µg/mL. Fator de diluição = 50/2 = 25, então 2.450 µg/mL no balão. × 100 mL = 245.000 µg = 245 mg. 245 ÷ 250 = 98%: aprovado.',
    'Errada. Usou o peso médio (400 mg) como declarado em vez de 250 mg.',
    'Errada. Desconsiderou a diferença de absorbância.',
    'Errada. Não aplicou o fator de diluição.',
    'Errada. Inverteu a razão (padrão ÷ amostra).'
  ],
  obs: 'Comparação com padrão: C amostra = (A amostra ÷ A padrão) × C padrão.',
  fonte: 'Material "Espectroscopia" — doseamento por comparação com padrão.'
},

{
  id: 'CQ-IN-03', origem: 'Inédita', assunto: 'Validação de métodos analíticos',
  enun: `Associe o parâmetro de validação (RDC 166/2017) ao ensaio:

1. Exatidão  2. Precisão (repetibilidade)  3. Seletividade  4. Robustez

( ) Seis determinações a 100% da concentração de trabalho, com cálculo do DPR.
( ) Ensaio de recuperação com placebo contaminado com quantidades conhecidas do analito.
( ) Variação deliberada do pH da fase móvel e da temperatura da coluna.
( ) Análise de placebo, padrão e amostra degradada, mostrando ausência de interferência no pico do analito.`,
  alts: ['2, 1, 4, 3', '1, 2, 4, 3', '2, 1, 3, 4', '3, 1, 4, 2', '2, 4, 1, 3'],
  c: 'A',
  e: [
    'Correta. Repetições com DPR = precisão; recuperação = exatidão; variações deliberadas = robustez; ausência de interferência = seletividade.',

    'Errada. As duas últimas estão trocadas.',
    'Errada. As repetições não avaliam a seletividade.',
    'Errada. A recuperação não é robustez.'
  ],
  obs: 'Linearidade = curva de calibração; limites de detecção (LD) e de quantificação (LQ) = menores concentrações detectáveis e quantificáveis.',
  fonte: 'RDC 166/2017.'
},
{

  enun: `Em uma CCD com sílica (fase estacionária) e fase móvel apolar, a substância X percorreu 2,0 cm e a Y percorreu 6,0 cm, com frente do solvente a 8,0 cm. Assinale a correta.`,

  enun: `Na determinação de perda por dessecação, um pesa-filtro vazio pesou 25,000 g; com a amostra, 27,000 g; após secagem até massa constante, 26,960 g. Especificação: no máximo 1,5%.`,

addQ('cq', 'ineditas', 'Lista', [
{
  id: 'CQ-LS-01', origem: 'Lista de exercícios (Profa. Líghia)', assunto: 'Cálculos de controle de qualidade',
  enun: `Durante o CQ de uma matéria-prima, um analista usa uma solução padrão de concentração conhecida para determinar o teor de uma substância. O procedimento se baseia em uma reação estequiométrica entre analito e titulante, com ponto final identificado por mudança visual.

  alts: [
    'Na titulometria indireta, uma solução de concentração conhecida, em excesso, é colocada junto à amostra e ao indicador, no erlenmeyer, seguida da titulação com reagente de concentração conhecida.',
