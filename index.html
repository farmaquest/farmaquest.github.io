<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FarmaQuest Simulados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: barra azul fixa no topo; coluna central de 1100px; questão + barra lateral de navegação */
:root{
  --bar:#12305b; --bar-fg:#ffffff; --bar-sub:#cfe2f8; --bar-hover:rgba(255,255,255,.14);
  --heading:#12305b; --link:#1b4380; --btn:#12305b; --btn-hover:#1b4380; --on-btn:#ffffff;
  --baby:#d9ebfb; --baby-2:#eef6fe; --baby-3:#a9d0f5;
  --bg:#f4f7fb; --card:#ffffff; --soft:#f7f9fc; --track:#e6ecf3; --line:#e3e8ef;
  --text:#1f2a37; --muted:#5f6b7c; --disabled:#b9c3d0;
  --ok:#1f9d55; --ok-bg:#e8f7ee; --ok-line:#a7dfbd;
  --err:#d64545; --err-bg:#fdecec; --err-line:#f3b4b4;
  --warn:#9a6412; --warn-bg:#fff7e6; --warn-line:#f1d39a;
  --mid:#e0a526; --on-state:#ffffff;
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bar:#0b1a33; --bar-fg:#f1f5fb; --bar-sub:#9fbde3; --bar-hover:rgba(255,255,255,.10);
    --heading:#d3e3f8; --link:#8dbdf3; --btn:#2f6fc4; --btn-hover:#3d80d8; --on-btn:#ffffff;
    --baby:#1d3557; --baby-2:#182a45; --baby-3:#3c5f8f;
    --bg:#0f1726; --card:#172236; --soft:#1b2840; --track:#24324c; --line:#2a3a57;
    --text:#e4ebf5; --muted:#9aa8bd; --disabled:#3a4760;
    --ok:#4cc38a; --ok-bg:#13301f; --ok-line:#24603e;
    --err:#f07575; --err-bg:#3a1a1d; --err-line:#6f2b30;
    --warn:#e2b04a; --warn-bg:#33290f; --warn-line:#6b5520;
    --mid:#e2b04a; --on-state:#0f1726; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bar:#0b1a33; --bar-fg:#f1f5fb; --bar-sub:#9fbde3; --bar-hover:rgba(255,255,255,.10);
  --heading:#d3e3f8; --link:#8dbdf3; --btn:#2f6fc4; --btn-hover:#3d80d8; --on-btn:#ffffff;
  --baby:#1d3557; --baby-2:#182a45; --baby-3:#3c5f8f;
  --bg:#0f1726; --card:#172236; --soft:#1b2840; --track:#24324c; --line:#2a3a57;
  --text:#e4ebf5; --muted:#9aa8bd; --disabled:#3a4760;
  --ok:#4cc38a; --ok-bg:#13301f; --ok-line:#24603e;
  --err:#f07575; --err-bg:#3a1a1d; --err-line:#6f2b30;
  --warn:#e2b04a; --warn-bg:#33290f; --warn-line:#6b5520;
  --mid:#e2b04a; --on-state:#0f1726; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--baby-3);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}

/* barra superior */
.topbar{background:var(--bar);color:var(--bar-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;cursor:pointer;user-select:none;background:none;border:0;color:var(--bar-fg);padding:0}
.logo svg{width:30px;height:30px}
.logo span b{color:var(--baby-3)}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.nav button{background:transparent;border:0;color:var(--bar-sub);padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px;white-space:nowrap}
.nav button.active,.nav button:hover{background:var(--bar-hover);color:var(--bar-fg)}

.perfil-chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;max-width:200px;border:1px solid var(--bar-hover);background:var(--bar-hover);color:var(--bar-fg);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;font-size:14px}
.perfil-chip:hover{background:rgba(255,255,255,.22)}
.perfil-chip .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--baby);color:var(--heading);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.avatar svg{width:24px;height:24px}
.avatar.big{width:64px;height:64px}
.avatar.big svg{width:52px;height:52px}
.perfil-overlay{position:fixed;inset:0;z-index:60;background:rgba(8,16,32,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.perfil-card{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:26px 24px;width:min(420px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.perfil-card h2{margin:0;color:var(--heading);font-size:21px}
.perfil-card p{margin:0;color:var(--muted);font-size:14.5px}
.perfil-card label{font-weight:700;font-size:14px;color:var(--heading)}
.perfil-card input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--baby-3);border-radius:8px;background:var(--card);color:var(--text)}
.perfil-card .erro{color:var(--err);font-size:13px;min-height:1em}
.perfil-card{max-height:calc(100vh - 32px);overflow-y:auto}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;font-size:15px}
.ou{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line)}
.login-links{display:flex;flex-direction:column;align-items:center;gap:8px}
.nota-wv{background:var(--baby-2);border:1px solid var(--baby-3);border-radius:8px;padding:8px 12px}
#lg-ok{width:100%;padding:11px 16px;font-size:15px}
.perfil-card .acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.install-banner{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--baby-2);border:1px solid var(--baby-3);border-radius:var(--radius);padding:12px 40px 12px 14px;margin-bottom:16px;font-size:14.5px}
.install-banner .txt{flex:1;min-width:150px}
.install-banner .x{position:absolute;top:6px;right:6px;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.passos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--text)}
.passos li::marker{font-weight:800;color:var(--link)}
.copia{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.copia input{flex:1;min-width:0;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--baby-3);border-radius:8px;background:var(--soft);color:var(--text)}
.theme-btn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--bar-hover);background:var(--bar-hover);color:var(--bar-fg);display:flex;align-items:center;justify-content:center;padding:0}
.theme-btn:hover{background:rgba(255,255,255,.22)}
.theme-btn svg{width:20px;height:20px}
.wrap{max-width:1100px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0 0 4px;color:var(--heading);text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}

/* botões e controles */
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--btn);color:var(--on-btn)}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{background:var(--disabled);cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--link);border:1px solid var(--baby-3)}
.btn.ghost:hover{background:var(--baby-2)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--card);color:var(--err);border:1px solid var(--err-line)}
.toggle{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:18px;font-size:14.5px;cursor:pointer}
.toggle input{width:18px;height:18px;margin-top:2px;accent-color:var(--btn);flex:0 0 auto}
.sync-pill{display:inline-block;font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:-8px 0 16px}
.sync-pill.alerta{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line);border-radius:10px;display:block;padding:8px 12px}
.bk-area{width:100%;min-height:110px;font-family:var(--mono);font-size:12px;padding:10px;border:1px solid var(--baby-3);border-radius:8px;background:var(--soft);color:var(--text);resize:vertical;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;color:var(--link);font-weight:600;font-size:14px;padding:0;text-align:center;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--baby-3);background:var(--card);color:var(--link);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--heading);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:min(90vw,520px);text-align:center}

/* início */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:0}
.mcard-head{background:linear-gradient(135deg,var(--bar),var(--btn-hover));color:var(--bar-fg);padding:16px 18px;min-height:92px;height:100%;display:flex;flex-direction:column;justify-content:center}
.mcard-head h3{margin:0;font-size:18px;text-wrap:balance}
.mcard-head p{margin:2px 0 0;color:var(--bar-sub);font-size:14px}
.mcard-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.geral-card{display:flex;flex-direction:column;margin-top:18px}
.geral-card .mcard-head{min-height:0}
.sim-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--baby-2)}
.sim-row .info{flex:1;min-width:0}
.sim-row .t{font-weight:700;color:var(--heading);font-size:15px}
.sim-row .d{font-size:13px;color:var(--muted)}
.pbar{height:6px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--link)}

/* questão */
.qlayout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.sidebar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:sticky;top:calc(76px + env(safe-area-inset-top,0px))}
.sidebar h4{margin:0 0 4px;font-size:15px;color:var(--heading)}
.sidebar .muted{font-size:13px;color:var(--muted);margin-bottom:12px}
.qnav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 14px}
.qnav button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 0;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.qnav button.cur{outline:2px solid var(--link);outline-offset:1px}
.qnav button.ok{background:var(--ok);border-color:var(--ok);color:var(--on-state)}
.qnav button.err{background:var(--err);border-color:var(--err);color:var(--on-state)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.backlink{background:none;border:0;color:var(--link);font-weight:700;padding:0;margin-bottom:12px;font-size:14px}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.qhead{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.qnum{background:var(--btn);color:var(--on-btn);font-weight:800;border-radius:6px;padding:3px 10px;font-size:15px}
.qcode{font-size:13px;color:var(--muted);font-weight:600}
.qpath{font-size:14px;color:var(--link);font-weight:600}
.qpath .sep{color:var(--muted);margin:0 6px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 18px;background:var(--baby-2);border-bottom:1px solid var(--line);font-size:13.5px}
.qmeta b{color:var(--heading)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.badge.blue{background:var(--baby);color:var(--heading);border-color:var(--baby-3)}
.qbody{padding:20px 22px 8px;min-width:0}
.enun{white-space:pre-wrap;font-size:16px;margin:0 0 18px;overflow-wrap:anywhere}
.enun table{border-collapse:collapse;margin:10px 0;font-size:14px;white-space:normal;display:block;max-width:100%;overflow-x:auto}
.enun td,.enun th{border:1px solid var(--line);padding:5px 9px;text-align:left}
.enun th{background:var(--baby-2)}
.alts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.alt:hover{background:var(--baby-2)}
.alt .L{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--link);color:var(--link);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--card)}
.alt .T{padding-top:4px;min-width:0;overflow-wrap:anywhere}
.alt.sel{background:var(--baby);border-color:var(--baby-3)}
.alt.sel .L{background:var(--link);color:var(--card)}
.locked .alt{cursor:default}
.locked .alt:hover{background:transparent}
.alt.right{background:var(--ok-bg);border-color:var(--ok-line)}
.alt.right .L{background:var(--ok);border-color:var(--ok);color:var(--on-state)}
.alt.wrong{background:var(--err-bg);border-color:var(--err-line)}
.alt.wrong .L{background:var(--err);border-color:var(--err);color:var(--on-state)}
.qactions{display:flex;align-items:center;gap:12px;padding:14px 22px 18px;flex-wrap:wrap}
.result{font-weight:700;padding:8px 14px;border-radius:8px;font-size:15px}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.err{background:var(--err-bg);color:var(--err)}
.spacer{flex:1}
.tabs{display:flex;gap:2px;border-top:1px solid var(--line);background:var(--soft);padding:0 10px;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.active{color:var(--heading);border-bottom-color:var(--link)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.tabpanel{padding:18px 22px 22px;border-top:1px solid var(--line)}
.gab{font-size:17px;font-weight:800;color:var(--heading);margin:0 0 14px}
.orig{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:6px}
.exp{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.exp.right{border-color:var(--ok-line);background:var(--ok-bg)}
.exp.mine{box-shadow:0 0 0 2px var(--err) inset}
.exp h5{margin:0 0 4px;font-size:14.5px}
.exp.right h5{color:var(--ok)}
.exp.wrongx h5{color:var(--err)}
.exp p{margin:0;font-size:14.5px}
.exp .you{font-size:12px;font-weight:700;color:var(--err);margin-left:6px}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:10px 14px;font-size:14px;margin:12px 0 0}
.note b{color:var(--warn)}
.note.info{background:var(--baby-2);border-color:var(--baby-3)}
.note.info b{color:var(--link)}
.src{font-size:13px;color:var(--muted);margin-top:12px}
.stat-big{display:flex;gap:16px;flex-wrap:wrap}
.stat-big div{background:var(--baby-2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:120px}
.stat-big b{display:block;font-size:22px;color:var(--heading)}
.stat-big span{font-size:13px;color:var(--muted)}

/* resumo, desempenho, treinar */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:30px;color:var(--heading);line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h3{margin:0 0 12px;color:var(--heading);font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3 .pct{margin-left:auto;font-size:15px}
.brow{display:grid;grid-template-columns:minmax(120px,240px) 1fr 80px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.brow.has-btn{grid-template-columns:minmax(120px,240px) 1fr 80px auto}
.brow .bar{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.brow .bar i{display:block;height:100%;border-radius:6px}
.brow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.brow .n{font-weight:400;color:var(--muted);font-size:12px}
.list{list-style:none;padding:0;margin:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:180px}
.list .meta{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}

/* flashcards */
.fc-meta{font-size:13.5px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.fc-card{display:flex;flex-direction:column;justify-content:center;width:100%;min-height:240px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:28px 26px;text-align:left;font-size:18px;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.fc-card.flip{background:var(--baby-2);border-color:var(--baby-3)}
.fc-card .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--link);margin-bottom:10px}
.fc-card .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.fc-card .hint{font-size:13px;color:var(--muted);margin-top:14px}
.fc-stats{font-size:13.5px;color:var(--muted);margin-top:12px}

/* fórmulas */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:22px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.fcard h4{margin:0 0 8px;color:var(--heading);font-size:16px}
.formula{font-family:var(--mono);background:var(--baby-2);border:1px solid var(--baby-3);border-radius:8px;padding:10px 12px;font-size:14.5px;overflow-x:auto;white-space:pre-wrap;color:var(--text)}
.fcard p{margin:8px 0 0;font-size:14px}

<script>
/* Cuidados Farmacêuticos — Prof. Manoel Pinheiro Lucio Neto */

/* ================= PROVAS 2026 (1ª VA + 2ª VA) ================= */
addQ('cf', '2026', 2026, [
{
  id: 'CF26-P1-01', origem: '2026 – 1ª VA (Q1)', assunto: 'Dispensação e Farmácia Especializada', adaptada: true,
  enun: `Um paciente em tratamento de uma doença crônica comparece a uma Farmácia Especializada do SUS para receber os medicamentos prescritos. O farmacêutico verifica a documentação, analisa a prescrição e os registros do tratamento, confere o medicamento e esclarece dúvidas sobre administração e conservação. Além do atendimento individual, participa da organização do serviço, buscando garantir disponibilidade, armazenamento adequado, rastreabilidade e segurança.

Sobre as atribuições do farmacêutico e a organização da dispensação nesse serviço, assinale a alternativa correta.`,
  alts: [
    'A dispensação na Farmácia Especializada se resume à conferência do medicamento com a receita, pois a análise da prescrição e a orientação são atribuições exclusivas do prescritor.',
    'O farmacêutico analisa prescrição e documentação, confere o medicamento, orienta o usuário, promove a adesão e identifica problemas relacionados a medicamentos; o serviço deve ser organizado com equipe capacitada, estrutura e armazenamento adequados, fluxo de atendimento definido, registros com rastreabilidade e POPs.',
    'Como os medicamentos do Componente Especializado são de alto custo, a prioridade da organização do serviço é reduzir o tempo de atendimento, dispensando registros individuais de dispensação.',
    'A padronização de processos por POPs é recomendada apenas para o armazenamento, não se aplicando ao fluxo de atendimento e à dispensação.',
    'A identificação de problemas relacionados a medicamentos só deve ocorrer em consultório farmacêutico, não fazendo parte do ato de dispensação.'
  ],
  c: 'B',
  e: [
    'Errada. Dispensar não é só entregar e conferir: a análise da prescrição e a orientação ao usuário são atribuições do farmacêutico no ato da dispensação.',
    'Correta. Reúne as duas dimensões cobradas na prova original: a assistencial (análise da prescrição, conferência, orientação, adesão, identificação de PRM) e a técnico-gerencial (recursos humanos, estrutura, armazenamento e conservação, fluxo de atendimento, registros e rastreabilidade, POPs).',
    'Errada. O registro da dispensação é obrigatório e garante rastreabilidade, ainda mais em medicamentos de alto custo. Agilidade não pode se sobrepor à segurança.',
    'Errada. Os POPs padronizam todas as etapas do serviço, inclusive a recepção, a análise da prescrição, a entrega e o registro.',
    'Errada. Identificar PRM (dose, interação, adesão, reação adversa) faz parte da dispensação qualificada, em qualquer serviço.'
  ],
  obs: 'Na prova original esta questão era discursiva (2,0 pontos), com itens a) atribuições e b) organização do serviço.',
  fonte: 'Material "CUIDADO FARMACÊUTICO" (dispensação; serviços farmacêuticos) e Componente Especializado da Assistência Farmacêutica (SUS).'
},
{
  id: 'CF26-P1-02', origem: '2026 – 1ª VA (Q2)', assunto: 'Educação em saúde e prática baseada em evidências',
  enun: `Uma equipe de uma UBS identificou aumento no número de pacientes com dificuldades na adesão aos tratamentos e dúvidas sobre o uso de medicamentos. O farmacêutico propôs ações de educação em saúde e a revisão das orientações fornecidas, fundamentando-as em evidências científicas atualizadas e adequando-as às necessidades da população. Classifique em V ou F:

I. Durante uma atividade educativa com hipertensos, o farmacêutico usa linguagem acessível, estimula perguntas e considera os conhecimentos e experiências dos participantes.
II. Ao elaborar uma orientação, o farmacêutico prioriza informações de influenciadores da área da saúde, desde que tenham muitos seguidores e relatos positivos de pacientes.
III. Diante de estudos com resultados divergentes, o farmacêutico deve considerar qualidade metodológica, nível de evidência, aplicabilidade dos resultados e características do paciente antes de decidir.
IV. Na prática baseada em evidências, a melhor evidência disponível deve ser usada isoladamente para determinar a conduta, mesmo quando preferências e necessidades do paciente diferem das condições dos estudos.
V. Uma ação de educação em saúde pode contribuir para a autonomia do paciente ao favorecer a compreensão sobre sua condição e farmacoterapia, permitindo sua participação nas decisões.`,
  alts: ['V, F, V, F, V', 'V, V, F, F, V', 'F, F, V, V, F', 'V, F, F, V, V', 'F, V, V, F, F'],
  c: 'A',
  e: [
    'Correta. I (V): educação dialógica, que valoriza o saber do paciente. II (F): número de seguidores não é critério de qualidade da evidência. III (V): avaliação crítica da literatura. IV (F): a PBE integra evidência, experiência clínica e preferências do paciente. V (V): educação em saúde promove autonomia e decisão compartilhada.',
    'Errada. O item II é falso (influenciadores não são fonte confiável) e o III é verdadeiro.',
    'Errada. Os itens I e V são verdadeiros, e o IV é falso: a evidência não é usada isoladamente na prática baseada em evidências.',
    'Errada. O III é verdadeiro e o IV é falso. A PBE é um tripé: evidência + experiência profissional + valores e preferências do paciente.',
    'Errada. I e V são verdadeiros; II é falso.'
  ],
  fonte: 'Princípios da prática baseada em evidências (Sackett) e educação em saúde dialógica, conforme o material de Cuidado Farmacêutico.'
},
{
  id: 'CF26-P1-03', origem: '2026 – 1ª VA (Q3)', assunto: 'Dispensação e Farmácia Especializada',
  enun: `Em uma UBS, uma paciente de 67 anos apresenta prescrição de losartana 50 mg para uso contínuo. O farmacêutico verifica a identificação da paciente, analisa a prescrição (dose, via, frequência, possíveis problemas), separa e confere o medicamento, orienta sobre uso, conservação e cuidados e, por fim, registra o atendimento.

Considerando as boas práticas de dispensação, assinale a sequência mais adequada das etapas.`,
  alts: [
    'Separação do medicamento → entrega ao paciente → análise da prescrição → orientação → registro.',
    'Recepção e identificação do paciente/prescrição → análise da prescrição → separação e conferência do medicamento → orientação ao paciente → entrega e registro da dispensação.',
    'Análise da prescrição → registro da dispensação → separação do medicamento → identificação do paciente → orientação.',
    'Identificação do paciente → entrega do medicamento → análise da prescrição → registro → orientação farmacêutica.',
    'Recepção da prescrição → separação do medicamento → registro → análise da prescrição → entrega ao paciente.'
  ],
  c: 'B',
  e: [
    'Errada. Entregar o medicamento antes de analisar a prescrição inverte a lógica da dispensação: a análise vem antes da separação.',
    'Correta. É a ordem lógica: acolher e identificar, analisar a prescrição, separar e conferir, orientar, e por fim entregar e registrar.',
    'Errada. Registrar antes de separar e identificar o paciente depois da análise não faz sentido: a identificação é a primeira etapa.',
    'Errada. Entregar antes de analisar a prescrição e orientar só depois do registro compromete a segurança.',
    'Errada. A análise da prescrição deve vir antes da separação e do registro.'
  ],
  fonte: 'Slides de Cuidado Farmacêutico 52–55 (passos da dispensação: abordagem, análise da prescrição, exame do medicamento, orientação e verificação do entendimento).'
},
{
  id: 'CF26-P1-04', origem: '2026 – 1ª VA (Q4)', assunto: 'Terminologia e conceitos',
  enun: `Em uma reunião multiprofissional, um profissional usou como sinônimos os termos Farmácia Clínica, Atenção Farmacêutica, Cuidado Farmacêutico e Serviços Farmacêuticos Clínicos. O farmacêutico esclareceu que, embora relacionados, os conceitos são distintos.

Assinale a alternativa correta.`,
  alts: [
    'Farmácia Clínica e Atenção Farmacêutica são sinônimos e correspondem exclusivamente à dispensação de medicamentos.',
    'Cuidado Farmacêutico corresponde exclusivamente ao acompanhamento farmacoterapêutico de pacientes crônicos, não abrangendo outros serviços clínicos.',
    'Farmácia Clínica é a área da Farmácia voltada à ciência e à prática do uso racional de medicamentos, enquanto o Cuidado Farmacêutico envolve ações e serviços realizados pelo farmacêutico com foco nas necessidades de saúde do indivíduo, da família e da comunidade.',
    'Serviços Farmacêuticos Clínicos são as atividades administrativas de seleção, programação, aquisição, armazenamento e distribuição de medicamentos.',
    'Atenção Farmacêutica é direcionada exclusivamente à identificação de interações e eventos adversos, sem acompanhamento do paciente.'
  ],
  c: 'C',
  e: [
    'Errada. Não são sinônimos, e nenhum dos dois se limita à dispensação.',
    'Errada. O Cuidado Farmacêutico abrange vários serviços: rastreamento, educação em saúde, manejo de problemas autolimitados, revisão da farmacoterapia, conciliação, acompanhamento etc.',
    'Correta. Farmácia Clínica é a área (ciência e prática do uso racional); Cuidado Farmacêutico é o modelo de prática centrado no paciente, na família e na comunidade, executado por meio dos serviços farmacêuticos clínicos.',
    'Errada. Essas atividades são técnico-gerenciais (ciclo logístico da Assistência Farmacêutica), não serviços clínicos.',
    'Errada. A Atenção Farmacêutica (Hepler & Strand) envolve justamente o acompanhamento do paciente e a responsabilidade pelos resultados da farmacoterapia.'
  ],
  fonte: 'Slides de Cuidado Farmacêutico 9, 11, 13, 16 e 17 (definições de Atenção Farmacêutica, Assistência Farmacêutica, Cuidado Farmacêutico e Farmácia Clínica — RE/CFF 585/2013).'
},
{
  id: 'CF26-P1-05', origem: '2026 – 1ª VA (Q5)', assunto: 'Educação em saúde e prática baseada em evidências', adaptada: true,
  enun: `Em um serviço de saúde, o farmacêutico identificou que muitos usuários tinham dificuldade para compreender seus tratamentos, usavam medicamentos de forma inadequada e recorriam com frequência à automedicação. Ele propôs ações de educação em saúde, individuais e coletivas, que estimulassem a participação dos usuários.

Qual conjunto de estratégias é o mais adequado e por quê?`,
  alts: [
    'Distribuir folhetos com a bula resumida de cada medicamento, evitando conversas para não confundir o paciente com informações demais.',
    'Palestras técnicas sobre farmacologia para a comunidade, com linguagem científica, já que a precisão do conteúdo é o fator que mais aumenta a adesão.',
    'Orientação individual com linguagem acessível e confirmação do entendimento (ex.: pedir que o paciente repita como vai tomar), tabela de horários com pictogramas para idosos ou pessoas com baixa escolaridade, e atividades coletivas (rodas de conversa, grupos de hipertensos e diabéticos, campanhas sobre automedicação), pois a educação dialógica aumenta autonomia, adesão e uso racional.',
    'Restringir a dispensação a quem comprovar que entendeu o tratamento, como forma de forçar a adesão.',
    'Encaminhar todos os usuários ao médico para que ele explique o tratamento, pois educação em saúde não é atribuição do farmacêutico.'
  ],
  c: 'C',
  e: [
    'Errada. Material escrito ajuda, mas sozinho e sem diálogo não garante compreensão. A educação em saúde pressupõe comunicação e participação do paciente.',
    'Errada. A linguagem técnica afasta o usuário; a adesão melhora quando a comunicação é adaptada ao público.',
    'Correta. Combina estratégias individuais e coletivas, adapta a linguagem, checa o entendimento e estimula a participação, que é o que a prova pedia (três estratégias e como elas promovem autonomia, adesão e uso racional).',
    'Errada. Condicionar o acesso ao medicamento é antiético e não promove autonomia.',
    'Errada. Educação em saúde é atribuição clínica do farmacêutico (Resolução CFF 585/2013).'
  ],
  obs: 'Na prova original esta questão era discursiva (2,0 pontos). Boas estratégias para citar: tabela de horários com símbolos (sol e lua) para idosos ou pessoas com baixa escolaridade, e eventos de conscientização sobre automedicação.',
  fonte: 'Material "CUIDADO FARMACÊUTICO" — educação em saúde; Resolução CFF 585/2013.'
},
{
  id: 'CF26-P1-06', origem: '2026 – 1ª VA (Q6)', assunto: 'Farmácia clínica',
  enun: `Paciente de 72 anos, internado, com hipertensão, diabetes e insuficiência cardíaca, usa oito medicamentos de uso contínuo. Na revisão da farmacoterapia, o farmacêutico clínico identifica uma possível interação e uma dose que precisa de ajuste pela função renal. Após discussão com a equipe, são feitas intervenções e o paciente recebe orientações antes da alta.

Qual resultado está mais diretamente relacionado à atuação do farmacêutico clínico?`,
  alts: [
    'Centralização das decisões terapêuticas no farmacêutico, reduzindo a necessidade de avaliação pelos demais profissionais.',
    'Priorização da redução dos custos dos medicamentos, independentemente dos resultados clínicos.',
    'Identificação e prevenção de problemas relacionados à farmacoterapia, contribuindo para a segurança do paciente e para a efetividade do tratamento.',
    'Garantia de que todos os medicamentos prescritos sejam mantidos durante a internação, evitando alterações.',
    'Restrição da atuação à identificação de interações, sem participação nas decisões sobre a farmacoterapia.'
  ],
  c: 'C',
  e: [
    'Errada. O farmacêutico clínico atua de forma colaborativa, dentro da equipe; ele não centraliza as decisões.',
    'Errada. A redução de custos pode ser consequência, mas o foco é o resultado clínico e a segurança.',
    'Correta. A revisão da farmacoterapia identificou interação e ajuste renal (PRM), e as intervenções acordadas com a equipe aumentam segurança e efetividade.',
    'Errada. O objetivo é otimizar a farmacoterapia, o que muitas vezes exige alterações (ajuste de dose, suspensão, substituição).',
    'Errada. Ele participa das decisões, propondo intervenções à equipe.'
  ],
  fonte: 'Farmácia clínica hospitalar; Resolução CFF 585/2013.'
},
{
  id: 'CF26-P1-07', origem: '2026 – 1ª VA (Q7)', assunto: 'Dispensação e Farmácia Especializada',
  enun: `Paciente de 63 anos retira medicamentos de uso contínuo em uma drogaria. O farmacêutico percebe que uma dose está diferente da que ela usava. Ela diz que não foi orientada sobre a mudança e tem dúvidas sobre os horários. Antes de fornecer os medicamentos, o farmacêutico analisa a prescrição, esclarece as dúvidas e faz as orientações necessárias.

A conduta demonstra que:`,
  alts: [
    'a dispensação deve priorizar a entrega rápida, e dúvidas sobre o tratamento devem ser esclarecidas exclusivamente pelo prescritor.',
    'a análise da prescrição é necessária apenas quando o medicamento tem restrição legal.',
    'a orientação farmacêutica é opcional, indicada principalmente para quem usa o medicamento pela primeira vez.',
    'a dispensação envolve análise da prescrição, avaliação do uso dos medicamentos e orientação ao paciente, contribuindo para o uso seguro e racional da farmacoterapia.',
    'a responsabilidade do farmacêutico termina após a conferência entre o medicamento fornecido e o prescrito.'
  ],
  c: 'D',
  e: [
    'Errada. Esclarecer dúvidas sobre o uso do medicamento é atribuição do farmacêutico; agilidade não substitui segurança.',
    'Errada. Toda prescrição deve ser analisada, e não apenas a de medicamentos controlados.',
    'Errada. A orientação faz parte da dispensação, inclusive em mudanças de dose de tratamentos já em uso, como no caso.',
    'Correta. O caso mostra a dispensação como serviço clínico: o farmacêutico analisa, avalia e orienta antes de entregar.',
    'Errada. A conferência é só uma etapa; orientar e verificar o entendimento também são responsabilidades do farmacêutico.'
  ],
  fonte: 'Boas práticas de dispensação (RDC 44/2009; Cuidado Farmacêutico).'
},
{
  id: 'CF26-P1-08', origem: '2026 – 1ª VA (Q8)', assunto: 'Educação em saúde e prática baseada em evidências',
  enun: `Em uma UBS, pacientes interrompem anti-hipertensivos quando a pressão normaliza, e parte da população usa antibióticos guardados em casa para tratar gripe e resfriado. O farmacêutico organiza atividades educativas individuais e coletivas sobre adesão, uso racional, riscos da automedicação e promoção da saúde.

Essas ações têm como principal finalidade:`,
  alts: [
    'ampliar a autonomia e o conhecimento dos usuários para favorecer decisões mais seguras sobre sua saúde, melhorar a adesão e promover o uso racional de medicamentos.',
    'reduzir a procura pelos demais profissionais, tornando o farmacêutico responsável por todas as necessidades da comunidade.',
    'orientar os usuários a evitar medicamentos sempre que possível, independentemente da indicação.',
    'concentrar-se na transmissão de informações técnicas, sem considerar hábitos, conhecimentos e necessidades dos usuários.',
    'garantir que os usuários sigam rigorosamente as orientações, sem participar das decisões sobre o tratamento.'
  ],
  c: 'A',
  e: [
    'Correta. É a definição da finalidade da educação em saúde: autonomia, adesão e uso racional, com o paciente participando das decisões.',
    'Errada. A educação em saúde complementa o trabalho da equipe; não substitui os outros profissionais.',
    'Errada. Uso racional é usar o medicamento certo quando indicado, e não evitar medicamentos de forma indiscriminada.',
    'Errada. Ignorar o contexto do usuário é o modelo "bancário", que o material critica.',
    'Errada. Contradiz a autonomia e a decisão compartilhada.'
  ],
  fonte: 'Material "CUIDADO FARMACÊUTICO" — educação em saúde.'
},
{
  id: 'CF26-P2-01', origem: '2026 – 2ª VA (Q1)', assunto: 'Acompanhamento farmacoterapêutico', adaptada: true,
  enun: `O acompanhamento farmacoterapêutico usa um método clínico estruturado, que permite a coleta sistemática de dados, a identificação de problemas relacionados à farmacoterapia, a tomada de decisões e o desenvolvimento de um plano de cuidado centrado no paciente.

Qual alternativa descreve corretamente as etapas principais desse método?`,
  alts: [
    'Dispensação → conferência da receita → entrega → arquivamento da prescrição.',
    'Coleta de dados do paciente (acolhimento, anamnese farmacêutica, medicamentos em uso, problemas de saúde) → avaliação da farmacoterapia e identificação de problemas (necessidade, efetividade, segurança, adesão) → elaboração do plano de cuidado com metas e intervenções, pactuado com paciente e equipe → seguimento e avaliação dos resultados.',
    'Prescrição de novos medicamentos → avaliação dos exames → alta do paciente, sem necessidade de retorno.',
    'Identificação de interações medicamentosas → comunicação ao médico → encerramento do acompanhamento.',

  e: [

  obs: 'Na prova original esta questão era discursiva. Uma resposta completa cita as etapas: coleta de dados do paciente → avaliação da farmacoterapia e identificação dos PRF → plano de cuidado → seguimento.',
  fonte: 'Slides de Cuidado Farmacêutico 89–105 (método clínico de Correr & Otuki: coletar dados → identificar PRF → plano de cuidado com o paciente → seguimento).'
},
{
  id: 'CF26-P2-02', origem: '2026 – 2ª VA (Q2)', assunto: 'Acompanhamento farmacoterapêutico',
  enun: `O acompanhamento farmacoterapêutico é uma prática sistematizada para identificar, prevenir e resolver problemas relacionados à farmacoterapia, que culmina em um plano de cuidado. Analise:

I. O acompanhamento deve ser registrado em prontuário clínico e incluir histórico de saúde, uso atual de medicamentos, objetivos terapêuticos e avaliação de adesão.
II. O plano de cuidado pode incluir ajuste de dose, substituição de medicamentos e solicitação de exames, independentemente de articulação com outros profissionais.
III. O plano de cuidado é dinâmico e deve ser atualizado conforme a resposta clínica, os efeitos adversos ou a necessidade de novas intervenções.
IV. O acompanhamento farmacoterapêutico é exclusivo do ambiente hospitalar e não se aplica ao consultório farmacêutico nem à atenção primária.

Estão corretas:`,
  alts: ['I e III', 'II e IV', 'I, II e III', 'I, III e IV', 'Todas estão corretas.'],
  c: 'A',
  e: [
    'Correta. I: o registro em prontuário é obrigatório. III: o plano de cuidado é dinâmico e revisto a cada seguimento.',
    'Errada. II é falsa (as intervenções que alteram a prescrição exigem articulação com o prescritor e a equipe) e IV é falsa (o acompanhamento ocorre na APS, em consultórios e em drogarias).',
    'Errada. Inclui o item II, que é falso: o farmacêutico não altera tratamentos "independentemente" da equipe.',
    'Errada. Inclui o item IV, que é falso.',
    'Errada. II e IV são falsas.'
  ],
  fonte: 'Resoluções CFF 585/2013 e 586/2013; material de Cuidado Farmacêutico.'
},
{
  id: 'CF26-P2-03', origem: '2026 – 2ª VA (Q3)', assunto: 'Conciliação de medicamentos',
  enun: `José, 67 anos, foi internado para uma cirurgia. Na admissão, informa que usa cinco medicamentos, mas não sabe o nome de dois. A esposa mostra fotos das embalagens e uma receita antiga. Comparando com a prescrição hospitalar, o farmacêutico identifica que um medicamento de uso contínuo não foi prescrito, e não há justificativa no prontuário. O paciente pergunta: "Minha esposa pode trazer esse remédio para eu continuar tomando aqui?"

Qual é a melhor conduta do farmacêutico?`,
  alts: [
    'Orientar a esposa a trazer o medicamento e autorizar seu uso, pois a receita antiga comprova a necessidade.',
    'Explicar que todos os medicamentos de casa devem ser suspensos durante a internação.',
    'Registrar a lista da receita antiga como definitiva e solicitar a inclusão de todos os itens na prescrição hospitalar.',
    'Confirmar o uso atual com fontes complementares, esclarecer a omissão com a equipe e documentar a decisão, orientando o paciente sobre o tratamento durante a internação.',
    'Adiar a investigação até a alta, quando será possível comparar as prescrições.'
  ],
  c: 'D',
  e: [
    'Errada. Uma receita antiga não confirma o uso atual, e o farmacêutico não "autoriza" o uso de medicamento trazido de casa sem avaliação da equipe.',
    'Errada. Não existe essa regra. A omissão pode ser um erro (discrepância não intencional) que precisa ser resolvido.',
    'Errada. A receita antiga pode estar desatualizada; a lista precisa ser confirmada com mais de uma fonte.',
    'Correta. É a conciliação de medicamentos: obter a melhor história de medicamentos (mais de uma fonte), comparar com a prescrição, esclarecer as discrepâncias com a equipe e documentar.',
    'Errada. A conciliação deve ser feita nas transições de cuidado, idealmente nas primeiras 24 a 48 horas da admissão. Esperar a alta mantém o risco ao paciente.'
  ],
  fonte: 'Slides de Cuidado Farmacêutico 60–64 (conciliação: discrepâncias não intencionais como omissão; entrevista com paciente/acompanhante e prontuário).'
},
{
  id: 'CF26-P2-04', origem: '2026 – 2ª VA (Q4)', assunto: 'Resoluções CFF 585 e 586/2013',
  enun: `Na implantação de um serviço de cuidado farmacêutico em uma UBS, um profissional disse que a atuação do farmacêutico deveria se limitar à dispensação e às orientações sobre horários. O farmacêutico explicou que a Resolução CFF nº 585/2013 regulamenta atribuições clínicas que ampliam sua participação no cuidado.

Considerando essa resolução, assinale a correta.`,
  alts: [
    'A atuação clínica do farmacêutico está restrita ao ambiente hospitalar.',

    'O farmacêutico pode participar do planejamento e da avaliação da farmacoterapia, realizar intervenções e colaborar com a equipe de saúde, mantendo uma relação de cuidado centrada no paciente.',
    'As atribuições clínicas dependem da presença de problemas relacionados aos medicamentos, sendo dispensáveis na promoção da saúde e prevenção de doenças.',
    'A autonomia profissional permite definir as metas do tratamento sem considerar as necessidades e a participação do paciente.'
  ],
  c: 'C',
  e: [
    'Errada. A Resolução 585/2013 vale para todos os níveis de atenção: hospital, atenção primária, farmácias e consultórios.',
    'Errada. Avaliar os resultados da farmacoterapia é uma das atribuições clínicas centrais.',
    'Correta. Resume o espírito da 585/2013: atribuições clínicas, como avaliação da farmacoterapia, intervenções e participação na equipe, centradas no paciente.',
    'Errada. A resolução inclui ações de promoção da saúde e prevenção de doenças, e não só o manejo de PRM.',
    'Errada. As metas são pactuadas com o paciente (cuidado centrado na pessoa).'
  ],
  fonte: 'Resolução CFF nº 585/2013 (atribuições clínicas do farmacêutico).'
},
{
  id: 'CF26-P2-05', origem: '2026 – 2ª VA (Q5)', assunto: 'Resoluções CFF 585 e 586/2013', adaptada: true,
  enun: `Na implantação de um consultório farmacêutico, um estudante disse que a prescrição farmacêutica é apenas indicar medicamentos isentos de prescrição (MIP). Outro afirmou que o farmacêutico pode prescrever qualquer medicamento ou modificar tratamentos de outros profissionais, desde que conheça a doença.

À luz da Resolução CFF nº 586/2013, assinale a correta.`,
  alts: [
    'O primeiro estudante está certo: prescrição farmacêutica é sinônimo de indicação de MIP.',
    'O segundo estudante está certo: com conhecimento técnico, o farmacêutico pode prescrever qualquer medicamento.',
    'Prescrição farmacêutica é o ato de selecionar e documentar terapias farmacológicas e não farmacológicas e outras intervenções relativas ao cuidado do paciente. MIPs podem ser prescritos no âmbito da competência do farmacêutico; medicamentos que exigem prescrição médica só podem ser prescritos quando previstos em programas, protocolos ou diretrizes institucionais, com acordo com os prescritores e com o farmacêutico especialista na área clínica.',
    'A prescrição farmacêutica de medicamentos tarjados é permitida em qualquer situação, desde que o paciente concorde.',
    'A Resolução 586/2013 proíbe a prescrição de medidas não farmacológicas, que são exclusivas de outros profissionais.'
  ],
  c: 'C',
  e: [
    'Errada. A prescrição farmacêutica não se limita a medicamentos: inclui medidas não farmacológicas, encaminhamentos e outras intervenções.',
    'Errada. O farmacêutico não pode prescrever qualquer medicamento nem alterar livremente tratamentos de outros profissionais.',
    'Correta. Traz o conceito da 586/2013 e a distinção: MIP (e plantas medicinais, fitoterápicos isentos etc.) dentro da competência; medicamentos sob prescrição médica só com respaldo de protocolo ou programa institucional, acordo de colaboração e título de especialista.',
    'Errada. A concordância do paciente não substitui as condições exigidas pela resolução.',
    'Errada. Medidas não farmacológicas fazem parte da prescrição farmacêutica.'
  ],
  obs: 'Na prova original esta questão era discursiva (itens a e b). Responda com base no texto da Resolução CFF 586/2013, que é o que a questão pede.',
  fonte: 'Slides de Cuidado Farmacêutico 76–78 (conceito de prescrição farmacêutica; MIP; "se, e somente se" para medicamentos sob prescrição) e Resolução CFF 586/2013.'
}
]);

{
  id: 'CF25-A-01', origem: '2025 – 2ª VA (Q1)', assunto: 'Acompanhamento farmacoterapêutico', adaptada: true,
  enun: `Sr. Joaquim, 75 anos, em consulta de seguimento na UBS, tem hipertensão, diabetes tipo 2 e doença renal crônica estágio 3. Relata cansaço, câimbras noturnas e dificuldade para controlar o açúcar, mesmo usando os medicamentos corretamente. Esquema atual: hidroclorotiazida 25 mg 1x/dia, losartana 100 mg 1x/dia, metformina 850 mg 3x/dia e glibenclamida 5 mg 2x/dia.

Qual alternativa identifica corretamente problemas relacionados à farmacoterapia e intervenções adequadas?`,

    'Não há problemas na farmacoterapia; os sintomas são esperados da idade e a conduta é apenas reforçar a adesão.',
    'Metformina em dose plena (2.550 mg/dia) na DRC aumenta o risco de acidose lática e exige ajuste pela taxa de filtração glomerular; a glibenclamida em idoso com DRC aumenta o risco de hipoglicemia, e o tiazídico pode causar hipocalemia (câimbras, cansaço) e piorar a glicemia. Intervenções: propor ao médico ajuste de dose ou substituição e monitorar função renal, eletrólitos e HbA1c.',
    'O único problema é a losartana, que deve ser suspensa imediatamente pelo farmacêutico por causa da DRC.',

  ],
  c: 'B',
  e: [

    'Correta. São PRM de segurança e de efetividade ligados à DRC: dose de metformina inadequada para a função renal, sulfonilureia de longa ação em idoso renal (risco de hipoglicemia), e tiazídico que causa distúrbios eletrolíticos e hiperglicemia. As intervenções passam pelo prescritor e pelo monitoramento laboratorial.',

},
{
  id: 'CF25-A-02', origem: '2025 – 2ª VA (Q2)', assunto: 'Resoluções CFF 585 e 586/2013',
  enun: `Mulher de 32 anos procura o farmacêutico na farmácia da Unidade de Saúde com constipação leve, sem dor abdominal, sem sinais de alarme e com histórico semelhante. Não usa medicamentos contínuos, está em bom estado geral e nega alergias.

},
{
  id: 'CF25-A-03', origem: '2025 – 2ª VA (Q3)', assunto: 'Dispensação e Farmácia Especializada',
  enun: `Na farmácia hospitalar, um paciente recém-diagnosticado com epilepsia recebe carbamazepina 200 mg. Ao conversar com ele, o farmacêutico descobre que não foi orientado sobre o uso contínuo e que "pretende tomar só quando tiver crise". Ele também não sabe que o medicamento pode causar sonolência e tontura no início.

},
{
  id: 'CF25-A-04', origem: '2025 – 2ª VA (Q4)', assunto: 'Conciliação de medicamentos',
  enun: `Carlos, 52 anos, recebe alta após infarto agudo do miocárdio e retira AAS, clopidogrel, atorvastatina e metoprolol. Está confuso sobre a posologia, acha que deve tomar todos juntos pela manhã e diz ter dificuldade de lembrar horários.

    'Errada. Somente a C está correta.'
  ],
  fonte: 'Transição do cuidado e orientação de alta (serviços farmacêuticos clínicos).'
},
{
  id: 'CF25-A-05', origem: '2025 – 2ª VA (Q5)', assunto: 'Legislação: Portaria 344/98 e prescrição',
  enun: `Joana, 42 anos, apresenta uma receita branca em duas vias de um psiquiatra com clonazepam 2 mg ("1 comprimido à noite por 30 dias") e metilfenidato 10 mg ("1 comprimido pela manhã por 30 dias"). A receita foi emitida há 20 dias. O farmacêutico identificou que o metilfenidato pertence à Lista B1 da Portaria SVS/MS nº 344/1998 e o clonazepam à Lista C1.

  enun: `Segundo Simonetti et al. (2009), o farmacêutico deve assegurar o uso seguro e racional dos medicamentos prescritos e atender à demanda de medicamentos e produtos da drogaria. Para Hepler (1990), a assistência farmacêutica é um processo cooperativo que busca resultados terapêuticos ótimos e melhor qualidade de vida do paciente.

{
  id: 'DPF26-P2-01', origem: '2026 – 2ª VA (Q1)', assunto: 'Comprimidos',
  enun: `O comprimido é a forma farmacêutica sólida mais utilizada no mundo, obtida pela compressão de pós ou granulados. Avalie:

  id: 'DPF25-A-05', origem: '2025 – 2ª VA (Q5)', assunto: 'Pós e grânulos', adaptada: true,
  enun: `Julgue V ou F:

( ) Uma mistura de pós ou grânulos pode ser enquadrada como produto intermediário quando usada para produzir comprimidos ou outras formas sólidas.
( ) Durante a granulação seca ou úmida, podemos gerar grânulos maiores chamados "slug", que devem passar por calibração.
( ) Os pós têm ótima estabilidade devido à sua grande superfície de contato.
( ) Podemos produzir pellets pelo processo de esferonização ou peletização.
( ) Grânulos preparados por via úmida podem ser veiculados em cápsulas gelatinosas duras.
( ) Máquinas semiautomáticas são utilizadas para preencher totalmente as cápsulas gelatinosas duras.`,
  alts: ['V, F, F, V, V, V', 'V, V, F, V, V, V', 'V, F, V, V, V, F', 'V, F, F, V, V, F', 'F, F, F, V, V, V'],
  c: 'A',
  e: [
    'Correta. 1º V; 2º F (o slug é exclusivo da via seca); 3º F; 4º V; 5º V; 6º V (as semiautomáticas preenchem TOTALMENTE as cápsulas).',
    'Errada. O "slug" não ocorre na via úmida, então o 2º item é falso.',
    'Errada. A grande superfície de contato REDUZ a estabilidade.',
    'Errada. Nesta versão (2025) o último item diz "totalmente", e isso é verdadeiro.',
    'Errada. O 1º item é verdadeiro.'
  ],
  obs: 'Esta questão voltou em 2026 com "parcialmente" no último item, e aí ele passou a ser falso.',
  fonte: 'Aula "Pós e grânulos 2026", slides 23, 26 e 35; aula "Cápsulas", slide 13 (semiautomática = enchimento total).'
},
{
  id: 'DPF25-A-06', origem: '2025 – 2ª VA (Q6)', assunto: 'Pós e grânulos', adaptada: true,
  enun: `Entre as principais técnicas de obtenção de granulados estão a granulação por via úmida e por via seca. Qual sequência descreve corretamente a granulação por VIA ÚMIDA?`,
  alts: [
    'Pesagem → moagem/tamisação → mistura → compactação em slugs → moagem → calibração.',
    'Pesagem → moagem/tamisação → mistura → adição da solução aglutinante (malaxagem) → granulação (tamisação da massa úmida) → secagem → calibração (tamisação do granulado seco) → mistura com lubrificante.',
    'Pesagem → mistura → compressão direta → revestimento.',
    'Pesagem → secagem → adição de líquido → compressão.',
    'Mistura → compactação por rolos → secagem em leito fluidizado → envase.'
  ],
  c: 'B',
  e: [
    'Errada. Essa é a sequência da via SECA.',
    'Correta. É a sequência clássica da via úmida, com aglutinante líquido e etapa de secagem.',
    'Errada. Isso é compressão direta, sem granulação.',
    'Errada. A secagem vem DEPOIS da adição do líquido e da granulação.',
    'Errada. Compactação por rolos é via seca, que não tem secagem.'
  ],
  obs: 'Na prova original esta questão era discursiva (diferenciar via úmida e via seca). Revise também a sequência da via seca: mistura → compactação (slugs ou lâminas) → moagem → calibração.',
  fonte: 'Aula "Pós e grânulos".'
},
{
  id: 'DPF25-A-07', origem: '2025 – 2ª VA (Q7)', assunto: 'Cápsulas',
  enun: `Uma estratégia simples para obtenção de sistemas de liberação pulsátil seria o desenvolvimento de:`,
  alts: [
    'comprimidos efervescentes.',
    'comprimidos revestidos contendo polímero solúvel em pH ácido.',
    'cápsulas gelatinosas duras com pellets revestidos e não revestidos.',
    'granulados esferonizados sem revestimento.',
    'comprimidos revestidos por drageamento contendo excipientes de elevada hidrossolubilidade.'
  ],
  c: 'C',
  e: [
    'Errada. Os efervescentes liberam tudo de uma vez (liberação imediata).',
    'Errada. Um polímero solúvel em pH ácido dissolve logo no estômago, e o resultado é liberação imediata.',
    'Correta. Os pellets não revestidos liberam uma dose imediata e os revestidos liberam uma segunda dose depois: são "pulsos" de liberação.',
    'Errada. Sem revestimento não há atraso, e a liberação é imediata.',
    'Errada. Excipientes muito hidrossolúveis aceleram a liberação; não criam pulsos.'
  ],
  fonte: 'Aula "Pós e grânulos 2026", slides 35–36 (pellets, MUPS) e aula "Comprimidos 2026", slide 37 (liberação pulsátil).'
},
{
  id: 'DPF25-A-08', origem: '2025 – 2ª VA (Q8)', assunto: 'Comprimidos',
  enun: `Na produção de comprimidos, podem ocorrer defeitos relacionados à compressão inadequada ou às propriedades do material, como o capping e a laminação. Assinale a correta:`,
  alts: [
    'Capping ocorre quando o comprimido apresenta divisão em camadas horizontais devido ao excesso de lubrificante.',
    'Laminação é a separação da parte superior (ou inferior) do comprimido, como uma "tampa" se soltando.',
    'Ambos os defeitos podem ser causados por ar aprisionado na matriz durante a compressão.',
    'A solução mais comum para o capping é aumentar a velocidade de compressão para garantir maior coesão.',
    'A laminação geralmente é desejável, pois melhora a dissolução do comprimido.'
  ],
  c: 'C',
  e: [
    'Errada. A definição está trocada: divisão em camadas horizontais é a LAMINAÇÃO.',
    'Errada. A definição está trocada: a "tampa" que se solta é o CAPPING (capeamento).',
    'Correta. O ar aprisionado, que não sai durante a compressão, se expande na ejeção e separa a tampa ou as camadas. Outras causas: excesso de finos, pouca umidade e força excessiva.',
    'Errada. Aumentar a velocidade PIORA, porque o ar tem menos tempo para sair. A solução é reduzir a velocidade, usar pré-compressão e ajustar a formulação.',
    'Errada. É um defeito e reprova o lote.'
  ],
  fonte: 'Aula "Comprimidos 2026", slide 25 (capping: presença de ar, grânulo úmido/rígido, pouco aglutinante; laminação).'
},
{
  id: 'DPF25-B-01', origem: '2025 – 1ª VA (Q1)', assunto: 'Boas Práticas de Fabricação (RDC 658/2022)',
  enun: `A RDC nº 658/2022 dispõe sobre as Boas Práticas de Fabricação de Medicamentos. Considere:

I. Os laboratórios de controle de qualidade devem ser preferencialmente unidos às áreas de produção.
II. As instalações devem ser projetadas e equipadas para garantir máxima proteção contra a entrada de insetos ou outros animais.
III. Deve existir espaço suficiente para evitar misturas e contaminação cruzada.
IV. As salas de descanso, refeitórios e banheiros podem estar unidos às áreas de fabricação e controle.
V. Os ralos devem ser sifonados e ter dimensões adequadas.`,
  alts: ['Somente II, III e IV são corretas.', 'Somente I, II, III e IV são corretas.', 'Somente II, III e V são corretas.', 'Somente I, II e III são corretas.', 'Todas são corretas.'],
  c: 'C',
  e: [
    'Errada. IV é falsa.',
    'Errada. I e IV são falsas.',
    'Correta. I é falsa (CQ separado da produção) e IV também (áreas auxiliares separadas); II, III e V são requisitos da RDC 658.',
    'Errada. I é falsa.',
    'Errada. I e IV são falsas.'
  ],
  obs: 'Questão quase idêntica à de 2026 (1ª VA, Q2). O professor reaproveita.',
  fonte: 'RDC 658/2022 — instalações.'
},
{
  id: 'DPF25-B-02', origem: '2025 – 1ª VA (Q2)', assunto: 'Boas Práticas de Fabricação (RDC 658/2022)',
  enun: `Numa inspeção sanitária, foram encontrados materiais altamente sensibilizantes (antibiótico cefalosporínico – cefalexina) na mesma área fabril de produtos comuns. Para minimizar o risco de danos graves à saúde e de contaminação cruzada, o auditor deve sugerir:

I. utilizar instalações segregadas e dedicadas.
II. terceirizar a produção de medicamentos desta natureza.
III. como alternativa à alteração nas instalações, intensificar as autoinspeções.
IV. fortalecer o treinamento das pessoas relacionadas às áreas de controle.

Marque a alternativa com os itens verdadeiros.`,
  alts: ['I e II.', 'II e III.', 'III e IV.', 'I, II e III.', 'I, II e IV.'],
  c: 'E',
  e: [
    'Errada. O item IV também é uma medida válida.',
    'Errada. III é falsa.',
    'Errada. III é falsa, e I ficou de fora.',
    'Errada. III é falsa: autoinspeção não substitui instalações dedicadas.',
    'Correta. Para betalactâmicos e outros sensibilizantes, a RDC 658 exige instalações segregadas e dedicadas (ou terceirização para quem as tenha), além de pessoal treinado. Autoinspeção não elimina o risco de contaminação cruzada.'
  ],
  fonte: 'Aula "Boas práticas de fabricação", slide 46 (áreas dedicadas para materiais sensibilizantes) e slide 31 (terceirização).'
},
{
  id: 'DPF25-B-03', origem: '2025 – 1ª VA (Q3)', assunto: 'Pré-formulação e propriedades dos pós',
  enun: `Os estudos de pré-formulação são realizados nas etapas de pesquisa de fármacos e visam acumular o máximo de informação sobre o comportamento das novas entidades químicas

PORQUE

diversos aspectos da substância ativa, como a biodisponibilidade a partir da forma farmacêutica, ou do medicamento, como o prazo de validade e até o processamento industrial, são afetados pelas propriedades físico-químicas dos fármacos.`,
  alts: [

    'As asserções I e II são falsas.'
  ],
  c: 'A',
  e: [
    'Correta. A pré-formulação caracteriza o fármaco (solubilidade, pKa, logP, polimorfismo, estabilidade, propriedades dos pós) justamente porque essas propriedades determinam biodisponibilidade, validade e processamento.',
    'Errada. A II explica diretamente o porquê da I.',
    'Errada. A II é verdadeira.',
    'Errada. A I é verdadeira.',
    'Errada. As duas são verdadeiras.'
  ],
  fonte: 'Aula "Pré-formulação", slides 4–5 (objetivos e análises da pré-formulação).'
},
{ ...DPF_PILULAS, id: 'DPF25-B-04', origem: '2025 – 1ª VA (Q4)' },
{
  id: 'DPF25-B-05', origem: '2025 – 1ª VA (Q5)', assunto: 'Boas Práticas de Fabricação (RDC 658/2022)',
  enun: `Durante a pesagem de dois pós (A e B) para duas preparações distintas, um pouco do pó A caiu sobre B, que já havia sido pesado. Ambos os pós foram usados em suas preparações.

Considerando o conceito de contaminação cruzada, é correto afirmar que:`,

},

<script>
/* Controle de Qualidade — Profa. Lyghia Maria Araújo Meirelles
   (Produção e Controle de Qualidade na Indústria) */

/* ================= PROVAS 2026 ================= */
addQ('cq', '2026', 2026, [
{
  id: 'CQ26-P1-01', origem: '2026 – 1ª VA (Q1)', assunto: 'Gestão da qualidade e ferramentas',
  enun: `Uma indústria adotava uma abordagem baseada principalmente na inspeção do produto acabado, evitando que chegassem ao mercado unidades fora das especificações. Após desvios recorrentes, passou a atuar preventivamente sobre matérias-primas, processos, equipamentos e etapas produtivas.

Considerando a evolução do conceito de qualidade, a mudança representa:`,
  alts: [
    'A substituição do controle estatístico pela inspeção final, aumentando a detecção de defeituosos.',
    'A transição de uma abordagem predominantemente corretiva para uma abordagem preventiva e sistêmica da qualidade.',
    'A transferência das responsabilidades do Controle de Qualidade para a Produção.',
    'A redução da necessidade de análises laboratoriais, pois a qualidade passa a ser garantida pelo processo.',
    'A concentração das atividades de qualidade na liberação do produto acabado.'
  ],
  c: 'B',
  e: [
    'Errada. É o contrário: a empresa saiu da inspeção final para o controle do processo.',
    'Correta. Evolução clássica: inspeção (corretiva) → controle estatístico → garantia da qualidade → gestão da qualidade total (preventiva e sistêmica).',
    'Errada. O CQ continua independente da Produção (RDC 658).',
    'Errada. As análises continuam necessárias; a prevenção não as elimina.',
    'Errada. Isso descreve a abordagem antiga.'
  ],
  fonte: 'Artigo "Ferramentas da qualidade"; evolução da qualidade (inspeção → GQT).'
},
{
  id: 'CQ26-P1-02', origem: '2026 – 1ª VA (Q2)', assunto: 'Gestão da qualidade e ferramentas', adaptada: true,
  enun: `Na fabricação de uma solução oral, aumentou a frequência de unidades com pH mais ácido ao final do processo, fora da tendência histórica, embora ainda dentro das especificações. O CQ considera que isso pode indicar alteração no processo.

Qual estratégia de investigação é a mais adequada?`,
  alts: [
    'Nenhuma ação é necessária, pois os resultados estão dentro da especificação.',
    'Levantar dados históricos e dos lotes recentes (matérias-primas e fornecedores, equipamentos, calibração do pHmetro, operadores, condições ambientais); usar o gráfico de controle para confirmar a tendência, o diagrama de Ishikawa (6M) para levantar causas possíveis e o Pareto para priorizar as mais frequentes.',
    'Reprovar todos os lotes produzidos no último ano e trocar o fornecedor de todas as matérias-primas.',
    'Usar apenas o fluxograma, pois ele mostra a causa raiz do desvio.',
    'Ajustar o pH final com base para voltar ao valor histórico, sem investigar a causa.'
  ],
  c: 'B',
  e: [
    'Errada. A tendência fora do padrão histórico é sinal de perda de controle e deve ser investigada de forma preventiva.',
    'Correta. Junta coleta de informações, gráfico de controle (que identifica a tendência), Ishikawa (causas) e Pareto (prioridades), o que a prova pedia nos itens 1 a 3.',
    'Errada. É uma reação desproporcional e sem base em dados.',
    'Errada. O fluxograma mapeia o processo, mas não identifica causas sozinho.',
    'Errada. Corrigir o sintoma sem achar a causa raiz não resolve o problema.'
  ],
  obs: 'Na prova original esta questão era discursiva. Além de Ishikawa e Pareto, a resposta precisa mostrar como IDENTIFICAR o problema: o gráfico (carta) de controle, que evidencia a tendência.',
  fonte: 'Artigo "Ferramentas da qualidade".'
},
{
  id: 'CQ26-P1-03', origem: '2026 – 1ª VA (Q3)', assunto: 'Gestão da qualidade e ferramentas',
  enun: `Na fabricação de comprimidos, o CQ observou aumento gradual da variabilidade do peso médio ao longo de várias semanas. Embora ainda dentro das especificações, a tendência indica possível perda de controle do processo.

A ferramenta mais adequada para acompanhar a estabilidade do processo ao longo do tempo é:`,
  alts: ['Gráfico de Pareto.', 'Diagrama de Ishikawa.', 'Gráfico de controle.', 'Fluxograma.', 'Histograma.'],
  c: 'C',
  e: [
    'Errada. O Pareto prioriza causas e problemas por frequência; não acompanha o processo no tempo.',
    'Errada. O Ishikawa organiza causas possíveis; não monitora tendências.',
    'Correta. O gráfico (carta) de controle mostra os dados ao longo do tempo com limites de controle e revela tendências e perda de controle estatístico antes de sair da especificação.',
    'Errada. O fluxograma descreve a sequência de etapas.',
    'Errada. O histograma mostra a distribuição de frequência em um momento, sem a dimensão do tempo.'
  ],
  fonte: 'Artigo "Ferramentas da qualidade" (Infarma, 2021) — carta de controle para mostrar tendências; RDC 658, Art. 245.'
},
{
  id: 'CQ26-P1-04', origem: '2026 – 1ª VA (Q4)', assunto: 'Atribuições do CQ e RDC 658/2022',
  enun: `Na liberação de um lote de cápsulas, a Produção informou que todos os parâmetros de processo estavam conformes e pediu liberação imediata. O CQ, porém, ainda não havia concluído os ensaios previstos para o produto acabado.

Considerando as atribuições do CQ, a conduta mais adequada é:`,
  alts: [
    'Liberar o lote, pois a Produção considerou os parâmetros satisfatórios.',
    'Liberar provisoriamente e concluir os ensaios depois.',
    'Liberar o lote somente após avaliar os resultados analíticos e os demais requisitos de liberação.',
    'Transferir a decisão para a Produção, que acompanha a fabricação.',
    'Liberar quando a identificação for conforme, independentemente dos demais ensaios.'
  ],
  c: 'C',
  e: [
    'Errada. A liberação depende da avaliação do CQ e da Garantia da Qualidade, que são independentes da Produção.',
    'Errada. Não existe "liberação provisória" de produto acabado sem os ensaios concluídos.',
    'Correta. Só se libera depois de cumpridas todas as especificações e de revisada a documentação do lote.',
    'Errada. Isso viola a independência entre Produção e CQ.',
    'Errada. A identificação sozinha não garante teor, pureza, dissolução etc.'
  ],
  fonte: 'RDC 658/2022, Arts. 13, 14 VII e 229 (nenhum produto liberado antes da avaliação da qualidade).'
},
{
  id: 'CQ26-P1-05', origem: '2026 – 1ª VA (Q5)', assunto: 'Gestão da qualidade e ferramentas',
  enun: `Uma indústria analisou 200 registros de desvios do último ano:

<table><tr><th>Categoria</th><th>Ocorrências</th></tr><tr><td>Falha operacional</td><td>82</td></tr><tr><td>Equipamento</td><td>48</td></tr><tr><td>Matéria-prima</td><td>32</td></tr><tr><td>Ambiente</td><td>21</td></tr><tr><td>Documentação</td><td>17</td></tr></table>
A gerência quer priorizar ações corretivas identificando as categorias que representam a maior parcela dos problemas. A decisão mais adequada é:`,
  alts: [
    'Elaborar um gráfico de Pareto e priorizar inicialmente as causas com maior frequência.',
    'Elaborar um histograma para determinar a causa raiz de cada desvio.',
    'Usar um gráfico de dispersão para comprovar que todas as causas têm a mesma importância.',
    'Usar um diagrama de Ishikawa para estabelecer automaticamente a frequência de cada causa.',
    'Usar um gráfico de controle para eliminar as categorias de menor frequência.'
  ],
  c: 'A',
  e: [
    'Correta. É o princípio 80/20: falha operacional e equipamento somam 130 de 200 (65%) e devem ser atacados primeiro.',
    'Errada. O histograma mostra distribuição de dados contínuos; não determina causa raiz.',
    'Errada. A dispersão avalia correlação entre duas variáveis.',
    'Errada. O Ishikawa lista causas, mas não calcula frequências.',
    'Errada. O gráfico de controle monitora um processo no tempo.'
  ],
  fonte: 'Artigo "Ferramentas da qualidade" (Infarma, 2021) — Pareto em ordem decrescente para priorizar.'
},
{
  id: 'CQ26-P1-06', origem: '2026 – 1ª VA (Q6)', assunto: 'CQ de matérias-primas: identificação e pureza',
  enun: `Uma indústria recebe um lote de fármaco como matéria-prima. O fornecedor apresenta certificado de análise, mas surge dúvida quanto à identidade do material. O CQ precisa de um ensaio capaz de confirmar que a substância recebida corresponde ao fármaco declarado.

A estratégia mais apropriada é:`,
  alts: [
    'Determinar apenas a perda por dessecação, pois esse ensaio confirma a identidade química.',
    'Determinar apenas o teor, pois qualquer substância em concentração adequada será considerada o fármaco.',
    'Utilizar uma técnica de identificação baseada em propriedade espectral ou cromatográfica característica da substância, conforme método farmacopeico ou validado.',
    'Determinar o pH da solução aquosa e identificar algum cátion ou ânion da molécula.',
    'Determinar exclusivamente o resíduo por incineração, pois ele caracteriza a estrutura química.'
  ],
  c: 'C',
  e: [
    'Errada. A perda por dessecação mede umidade e voláteis; é ensaio de pureza, não de identidade.',
    'Errada. O teor não é específico e pressupõe que a identidade já foi confirmada.',
    'Correta. Espectro no IV (a "impressão digital"), UV ou tempo de retenção/Rf comparado ao padrão são ensaios específicos de identificação.',
    'Errada. pH e reações de íons são pouco específicos; servem no máximo como triagem.',
    'Errada. O resíduo por incineração avalia impurezas inorgânicas.'
  ],
  fonte: 'CQ MPs (Cap. 13), p. 243 (Quadro 13.1) e p. 248 (espectrometria e cromatografia na identificação).'
},
{
  id: 'CQ26-P1-07', origem: '2026 – 1ª VA (Q7)', assunto: 'CQ de matérias-primas: identificação e pureza', adaptada: true,
  enun: `Uma matéria-prima chegou com documentação adequada, mas o responsável pelo CQ precisa definir a estratégia analítica de identidade antes do uso.

Qual alternativa descreve a estratégia correta e explica por que um único ensaio não basta?`,
  alts: [
    'Basta conferir o certificado de análise do fornecedor; ensaios de identidade são redundantes.',
    'Combinar ensaios clássicos de triagem (reações químicas de grupos funcionais, CCD comparada ao padrão, constantes físicas como ponto de fusão e poder rotatório) com técnicas instrumentais mais específicas (espectroscopia no IV, UV, CLAE). Um ensaio isolado pode dar falso positivo, porque substâncias diferentes podem ter a mesma reação ou o mesmo ponto de fusão.',
    'Fazer somente a espectrofotometria UV, que é específica e dispensa outros ensaios.',
    'Realizar apenas o ensaio de dissolução, que confirma a identidade e o desempenho.',
    'Fazer apenas reações coloridas, pois são as mais específicas para fármacos.'
  ],
  c: 'B',
  e: [
    'Errada. A indústria deve testar a identidade de cada recipiente/lote recebido, mesmo com certificado (RDC 658).',
    'Correta. Ensaios complementares, clássicos e instrumentais, aumentam a especificidade. A combinação evita conclusões erradas.',
    'Errada. Vários compostos absorvem no UV; sozinho ele é pouco específico.',
    'Errada. Dissolução é ensaio de produto acabado, não de identidade de matéria-prima.',
    'Errada. As reações coloridas indicam grupos funcionais e não são específicas.'
  ],
  obs: 'Na prova original esta questão era discursiva. Uma resposta completa combina ensaios clássicos como triagem, espectroscopia no IV e constantes físicas (ponto de fusão, poder rotatório).',
  fonte: 'Material "CQ MPs"; "Cap. 3 – Técnicas clássicas"; "Espectroscopia".'
},
{
  id: 'CQ26-P1-08', origem: '2026 – 1ª VA (Q8)', assunto: 'Cromatografia (CCD, CLAE e CG)',
  enun: `No CQ de uma matéria-prima, o ensaio de identificação foi conforme. Entretanto, a análise cromatográfica revelou um pico adicional significativo, não correspondente ao componente principal.

A interpretação mais adequada é:`,
  alts: [
    'O material deve ser aprovado, pois a identificação confirmou o fármaco.',
    'O resultado indica possível impureza, que deve ser avaliada conforme os critérios e limites estabelecidos para o material.',
    'O pico adicional é obrigatoriamente um produto de degradação, que pode ser ignorado se o teor estiver conforme.',
    'A identificação torna desnecessária a avaliação de pureza.',
    'O pico adicional não tem relevância quando o teor está dentro da especificação.'
  ],
  c: 'B',
  e: [
    'Errada. Identidade não é pureza: o material pode ser o fármaco certo e estar contaminado.',
    'Correta. O pico adicional sugere impureza (de síntese, de degradação ou contaminante), que precisa ser identificada e quantificada contra os limites da monografia.',
    'Errada. Não é "obrigatoriamente" degradação, e impurezas não podem ser ignoradas.',
    'Errada. Identidade e pureza são ensaios distintos e complementares.',
    'Errada. Impurezas acima do limite reprovam o material, mesmo com teor conforme.'
  ],
  fonte: 'Material "CQ MPs" — ensaios de pureza.'
},
{
  id: 'CQ26-P1-09', origem: '2026 – 1ª VA (Q9)', assunto: 'Cálculos de controle de qualidade',
  enun: `No CQ de uma matéria-prima, foi feito o ensaio de substâncias insolúveis. Uma amostra de 2,50 g foi processada e o resíduo insolúvel, seco até massa constante, pesou 7,5 mg. A especificação é de no máximo 0,30% (m/m).

O lote deve ser:`,
  alts: [
    'Aprovado, pois o resultado é inferior a 0,50%.',
    'Aprovado, pois a massa de resíduo corresponde a aproximadamente 0,30% da amostra.',
    'Reprovado, pois o resultado é superior ao limite especificado.',
    'Reprovado, pois qualquer presença de insolúveis é incompatível com a qualidade.',
    'Considerado inconclusivo, pois o ensaio só determina o percentual de solúveis.'
  ],
  c: 'B',
  e: [
    'Errada. A especificação é 0,30%, não 0,50%.',
    'Correta. 7,5 mg ÷ 2.500 mg × 100 = 0,30%, que é igual ao limite máximo ("no máximo 0,30%"), portanto conforme.',
    'Errada. O resultado não ultrapassa o limite.',
    'Errada. A especificação admite até 0,30%.',
    'Errada. O ensaio quantifica justamente os insolúveis.'
  ],
  obs: 'Atenção às unidades: converta g para mg (2,50 g = 2.500 mg) antes de dividir.',
  fonte: 'Material "CQ MPs" — ensaios de pureza.'
},
{
  id: 'CQ26-P1-10', origem: '2026 – 1ª VA (Q10)', assunto: 'CQ de matérias-primas: identificação e pureza',
  enun: `Para verificar o íon ferro em uma matéria-prima, o método farmacopeico é um ensaio-limite: a resposta da amostra é comparada visualmente com uma solução-padrão na concentração do limite. A coloração da amostra foi menos intensa que a do padrão.

A interpretação correta é:`,
  alts: [
    'A amostra tem concentração do contaminante necessariamente igual a zero.',
    'A amostra está conforme, pois a resposta não excede a correspondente ao limite.',
    'A amostra está não conforme, pois qualquer resposta positiva indica contaminante acima do permitido.',
    'O ensaio não permite conclusão, pois ensaios-limite são exclusivamente qualitativos.',
    'A amostra deve obrigatoriamente passar por determinação quantitativa antes de qualquer decisão.'
  ],
  c: 'B',
  e: [
    'Errada. O ensaio-limite não prova ausência; mostra só que está ABAIXO do limite.',
    'Correta. Amostra com coloração ou turbidez menor que a do padrão significa concentração abaixo do limite, ou seja, conforme.',
    'Errada. Uma resposta positiva abaixo do padrão é aceitável.',
    'Errada. É semiquantitativo: permite decidir se está acima ou abaixo do limite.',
    'Errada. O ensaio-limite farmacopeico basta para a decisão.'
  ],
  obs: 'A mesma lógica vale para cloretos e sulfatos: se o PADRÃO é mais turvo que a amostra, a amostra está conforme.',
  fonte: 'CQ MPs, p. 250–251 (ensaios-limite são semiquantitativos; ferro: amostra não deve ser mais escura que o padrão); Cap. 3, p. 45.'
},
{
  id: 'CQ26-P2-01', origem: '2026 – 2ª VA (Q1)', assunto: 'Ensaios físicos de formas farmacêuticas', adaptada: true,
  enun: `Comprimidos de liberação imediata com 500 mg de fármaco X (+ 50 mg de talco + 15 mg de Aerosil®; peso teórico 565 mg) tiveram os resultados:

<table><tr><th>Ensaio</th><th>Lote 1</th><th>Lote 2</th><th>Especificação</th></tr><tr><td>Peso médio</td><td>505,0 mg</td><td>565,2 mg</td><td>565 mg ± 5%</td></tr><tr><td>Friabilidade</td><td>Mi 5,05 g / Mf 4,98 g</td><td>Mi 5,65 g / Mf 5,42 g</td><td>&lt; 1,5%</td></tr><tr><td>Desintegração</td><td>5 min</td><td>10 min</td><td>até 30 min</td></tr><tr><td>Teor de X</td><td>487 mg</td><td>503 mg</td><td>95–105%</td></tr><tr><td>Dissolução</td><td>89%</td><td>86%</td><td>≥ 80%</td></tr></table>
Assinale a alternativa correta.`,
  alts: [
    'O Lote 2 atende a todas as especificações e está aprovado.',
    'O Lote 1 é reprovado no peso médio (505 mg está abaixo de 536,75 mg), e o Lote 2 é reprovado na friabilidade (4,07%, acima de 1,5%).',
